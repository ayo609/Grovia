<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Admin - Grovia</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-elevated: #22222e;
            --accent-red: #ff4444;
            --accent-red-dark: #cc0000;
            --accent-gold: #ffd700;
            --accent-green: #00e676;
            --text-primary: #f5f5f7;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --border: rgba(255,255,255,0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 40% at 10% 10%, rgba(255,68,68,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(255,215,0,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        .header-badge {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, var(--accent-gold), #ff9800);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 10px 30px rgba(255,215,0,0.3);
        }

        .header-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-red));
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 1rem;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: var(--transition);
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(255,215,0,0.1);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field.error {
            border-color: var(--accent-red);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: var(--transition);
        }

        .toggle-password:hover {
            color: var(--text-primary);
        }

        .error-message {
            color: var(--accent-red);
            font-size: 0.75rem;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .password-strength {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            transition: var(--transition);
        }

        .strength-bar.weak { background: var(--accent-red); }
        .strength-bar.medium { background: var(--accent-gold); }
        .strength-bar.strong { background: var(--accent-green); }

        .create-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-gold), #ff9800);
            border: none;
            border-radius: var(--radius-sm);
            color: #0a0a0f;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .create-btn:hover {
            box-shadow: 0 8px 25px rgba(255,215,0,0.3);
            transform: translateY(-2px);
        }

        .create-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loading .btn-text { visibility: hidden; }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(10,10,15,0.3);
            border-top-color: #0a0a0f;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .btn-loading .spinner { display: block; }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--accent-gold);
        }

        .toasts {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            min-width: 280px;
            max-width: 360px;
            display: flex;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transform: translateX(110%);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .toast.show { transform: translateX(0); }
        .toast::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            border-radius: var(--radius-md) 0 0 var(--radius-md);
        }
        .toast.success::before { background: var(--accent-green); }
        .toast.error::before { background: var(--accent-red); }
        .toast-icon { font-size: 1.2rem; flex-shrink: 0; }
        .toast-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .toast-msg { font-size: 0.78rem; color: var(--text-secondary); }

        @media (max-width: 480px) {
            .form-card { padding: 25px 20px; }
            .header-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-badge">
            <div class="header-icon">👑</div>
            <h1 class="header-title">Create Admin</h1>
            <p class="header-subtitle">Setup a new admin account</p>
        </div>

        <div class="form-card">
            <form id="createAdminForm" onsubmit="handleCreateAdmin(event)">
                <div class="form-group">
                    <label class="form-label">Admin Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input 
                            type="text" 
                            class="input-field" 
                            id="adminUsername" 
                            placeholder="Enter admin username" 
                            autocomplete="off"
                            required
                        >
                    </div>
                    <div class="error-message" id="usernameError">Username must be at least 3 characters</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Admin Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input 
                            type="email" 
                            class="input-field" 
                            id="adminEmail" 
                            placeholder="Enter admin email" 
                            autocomplete="email"
                            required
                        >
                    </div>
                    <div class="error-message" id="emailError">Please enter a valid email</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔑</span>
                        <input 
                            type="password" 
                            class="input-field" 
                            id="adminPassword" 
                            placeholder="Minimum 6 characters" 
                            autocomplete="new-password"
                            oninput="checkPasswordStrength()"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('adminPassword')">👁</button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strength1"></div>
                        <div class="strength-bar" id="strength2"></div>
                        <div class="strength-bar" id="strength3"></div>
                        <div class="strength-bar" id="strength4"></div>
                        <div class="strength-bar" id="strength5"></div>
                    </div>
                    <div class="error-message" id="passwordError">Password must be at least 6 characters</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            class="input-field" 
                            id="confirmPassword" 
                            placeholder="Re-enter password" 
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁</button>
                    </div>
                    <div class="error-message" id="confirmError">Passwords do not match</div>
                </div>

                <button type="submit" class="create-btn" id="createBtn">
                    <span class="btn-text">Create Admin Account</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <a href="admin-login.html" class="back-link">← Back to Admin Login</a>
    </div>

    <div class="toasts" id="toasts"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
            authDomain: "grovia-15266.firebaseapp.com",
            projectId: "grovia-15266",
            storageBucket: "grovia-15266.firebasestorage.app",
            messagingSenderId: "330674853010",
            appId: "1:330674853010:web:15a2cce632dd4528b8024b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function toast(type, title, msg) {
            const box = document.getElementById('toasts');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<div class="toast-icon">${type === 'success' ? '✓' : '✗'}</div><div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
            box.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4000);
        }

        window.togglePassword = function(fieldId) {
            const input = document.getElementById(fieldId);
            input.type = input.type === 'password' ? 'text' : 'password';
        };

        window.checkPasswordStrength = function() {
            const password = document.getElementById('adminPassword').value;
            let score = 0;
            
            if (password.length >= 6) score++;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;
            
            for (let i = 1; i <= 5; i++) {
                const bar = document.getElementById('strength' + i);
                bar.classList.remove('weak', 'medium', 'strong');
                if (i <= score) {
                    if (score <= 2) bar.classList.add('weak');
                    else if (score <= 3) bar.classList.add('medium');
                    else bar.classList.add('strong');
                }
            }
        };

        window.handleCreateAdmin = async function(event) {
            event.preventDefault();
            
            const username = document.getElementById('adminUsername').value.trim();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const createBtn = document.getElementById('createBtn');
            
            // Reset errors
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
            
            // Validate
            if (!username || username.length < 3) {
                document.getElementById('usernameError').classList.add('show');
                return;
            }
            
            if (!email || !email.includes('@')) {
                document.getElementById('emailError').classList.add('show');
                return;
            }
            
            if (!password || password.length < 6) {
                document.getElementById('passwordError').classList.add('show');
                return;
            }
            
            if (password !== confirmPassword) {
                document.getElementById('confirmError').classList.add('show');
                return;
            }
            
            createBtn.classList.add('btn-loading');
            createBtn.disabled = true;
            
            try {
                // Check if username already exists
                const usernameQuery = query(collection(db, 'users'), where('username', '==', username.toLowerCase()));
                const usernameSnap = await getDocs(usernameQuery);
                
                if (!usernameSnap.empty) {
                    toast('error', 'Username Taken', 'This username is already in use.');
                    createBtn.classList.remove('btn-loading');
                    createBtn.disabled = false;
                    return;
                }
                
                // Create auth account
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;
                
                // Create user document with isAdmin flag
                await setDoc(doc(db, 'users', uid), {
                    uid,
                    username: username.toLowerCase(),
                    email,
                    isAdmin: true,
                    role: 'admin',
                    depositWallet: 0,
                    withdrawalWallet: 0,
                    totalEarnings: 0,
                    referralEarnings: 0,
                    totalReferrals: 0,
                    status: 'active',
                    createdAt: serverTimestamp()
                });
                
                toast('success', 'Admin Created', `${username} is now an admin. They can login via admin-login.html.`);
                
                // Reset form
                document.getElementById('adminUsername').value = '';
                document.getElementById('adminEmail').value = '';
                document.getElementById('adminPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                
                // Reset strength bars
                for (let i = 1; i <= 5; i++) {
                    document.getElementById('strength' + i).classList.remove('weak', 'medium', 'strong');
                }
                
                setTimeout(() => {
                    window.location.href = 'admin-login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Create admin error:', error);
                
                const errorMessages = {
                    'auth/email-already-in-use': 'This email is already registered.',
                    'auth/invalid-email': 'Please enter a valid email address.',
                    'auth/weak-password': 'Password is too weak. Use at least 6 characters.',
                    'auth/network-request-failed': 'Network error. Check your connection.'
                };
                
                toast('error', 'Creation Failed', errorMessages[error.code] || 'An error occurred. Please try again.');
            } finally {
                createBtn.classList.remove('btn-loading');
                createBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
