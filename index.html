<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grovia - Dollar Investment Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --accent-green: #00ff88;
            --accent-blue: #00d4ff;
            --accent-purple: #7c3aed;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border-color: #2d3748;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow-glow: 0 0 30px rgba(0, 255, 136, 0.1);
            --font-primary: 'Space Grotesk', sans-serif;
            --font-secondary: 'Inter', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-secondary);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: var(--accent-green);
            border-radius: 50%;
            pointer-events: none;
            animation: float 20s infinite;
            opacity: 0.3;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(100px, -50px); }
            50% { transform: translate(50px, 100px); }
            75% { transform: translate(-100px, 50px); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue), var(--accent-purple));
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo-section { text-align: center; margin-bottom: 30px; }
        .logo-icon {
            width: 60px; height: 60px; margin: 0 auto 20px;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .logo-icon::before {
            content: ''; position: absolute; width: 100%; height: 100%;
            border: 2px solid var(--accent-green); transform: rotate(45deg);
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate {
            0% { transform: rotate(45deg); }
            100% { transform: rotate(405deg); }
        }
        .logo-icon span {
            font-family: var(--font-primary); font-size: 1.8rem; font-weight: 700;
            color: var(--accent-green); position: relative; z-index: 1;
        }
        .brand-name {
            font-family: var(--font-primary); font-size: 2.2rem; font-weight: 700;
            letter-spacing: 3px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand-tagline {
            font-size: 0.85rem; color: var(--text-muted);
            letter-spacing: 2px; text-transform: uppercase; margin-top: 10px;
        }

        .top-nav { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .login-link {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; background: transparent;
            border: 1px solid var(--accent-blue); color: var(--accent-blue);
            font-family: var(--font-primary); font-size: 0.9rem; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
            transition: var(--transition); border-radius: 2px; text-decoration: none;
        }
        .login-link:hover { background: var(--accent-blue); color: var(--bg-primary); }

        .form-section { display: none; animation: slideIn 0.5s ease; }
        .form-section.active { display: block; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .section-title {
            font-family: var(--font-primary); font-size: 1.5rem; font-weight: 600;
            margin-bottom: 30px; color: var(--text-primary);
        }

        .input-group { margin-bottom: 25px; position: relative; }
        .input-label {
            display: block; font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            color: var(--accent-green); margin-bottom: 8px;
        }
        .input-field {
            width: 100%; background: var(--bg-secondary);
            border: 1px solid var(--border-color); color: var(--text-primary);
            padding: 14px 16px; font-family: var(--font-secondary);
            font-size: 0.95rem; border-radius: 2px;
            transition: var(--transition); outline: none;
        }
        .input-field:focus { border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1); }
        .input-field::placeholder { color: var(--text-muted); }
        .input-field.error { border-color: var(--error); }
        .input-field.success { border-color: var(--success); }

        /* ══════ PHONE INPUT WITH COUNTRY PICKER ══════ */
        .phone-input-wrapper {
            display: flex;
            gap: 0;
            position: relative;
        }

        .country-picker-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-right: none;
            border-radius: 2px 0 0 2px;
            color: var(--text-primary);
            font-family: var(--font-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            min-width: 100px;
            flex-shrink: 0;
            outline: none;
        }
        .country-picker-btn:hover { border-color: var(--accent-green); }
        .country-picker-btn.open { border-color: var(--accent-green); }

        .country-flag { font-size: 1.1rem; line-height: 1; }
        .country-dial { font-weight: 600; font-size: 0.85rem; }
        .country-caret {
            margin-left: auto;
            font-size: 0.6rem;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }
        .country-picker-btn.open .country-caret { transform: rotate(180deg); }

        .phone-input-wrapper .input-field {
            border-radius: 0 2px 2px 0;
            flex: 1;
            min-width: 0;
        }

        /* Country dropdown */
        .country-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--accent-green);
            border-radius: 2px;
            max-height: 300px;
            overflow: hidden;
            display: none;
            z-index: 100;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .country-dropdown.show { display: flex; flex-direction: column; }

        .country-search-box {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .country-search-input {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            color: var(--text-primary);
            font-family: var(--font-secondary);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
        }
        .country-search-input:focus { border-color: var(--accent-green); }
        .country-search-input::placeholder { color: var(--text-muted); }

        .country-list {
            overflow-y: auto;
            flex: 1;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }
        .country-list::-webkit-scrollbar { width: 6px; }
        .country-list::-webkit-scrollbar-track { background: transparent; }
        .country-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        .country-list::-webkit-scrollbar-thumb:hover { background: var(--accent-green); }

        .country-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            cursor: pointer;
            transition: background 0.15s ease;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .country-option:last-child { border-bottom: none; }
        .country-option:hover,
        .country-option.highlighted {
            background: rgba(0, 255, 136, 0.08);
        }
        .country-option.selected {
            background: rgba(0, 255, 136, 0.12);
        }

        .country-option .flag { font-size: 1.2rem; flex-shrink: 0; }
        .country-option .name {
            flex: 1;
            font-size: 0.85rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .country-option .dial {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--accent-blue);
            flex-shrink: 0;
        }

        .country-empty {
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .feedback-message { font-size: 0.8rem; margin-top: 5px; display: none; }
        .feedback-message.valid { color: var(--success); display: block; }
        .feedback-message.invalid { color: var(--error); display: block; }
        .feedback-message.checking { color: var(--text-muted); display: block; }

        .progress-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .progress-step { width: 40px; height: 3px; background: var(--border-color); transition: var(--transition); }
        .progress-step.active { background: var(--accent-green); }
        .progress-step.completed { background: var(--accent-blue); }

        .btn-primary {
            width: 100%; padding: 15px; background: transparent;
            border: 2px solid var(--accent-green); color: var(--accent-green);
            font-family: var(--font-primary); font-size: 1rem; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
            transition: var(--transition); border-radius: 2px;
            position: relative; overflow: hidden;
        }
        .btn-primary::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%; background: var(--accent-green);
            transition: var(--transition); z-index: -1;
        }
        .btn-primary:hover { color: var(--bg-primary); }
        .btn-primary:hover::before { left: 0; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .form-navigation { display: flex; gap: 15px; margin-top: 30px; }
        .btn-back {
            padding: 15px 25px; background: transparent;
            border: 1px solid var(--border-color); color: var(--text-secondary);
            cursor: pointer; font-family: var(--font-secondary);
            font-size: 0.9rem; transition: var(--transition); border-radius: 2px;
        }
        .btn-back:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .btn-next { flex: 1; }

        .referral-banner {
            display: none; background: rgba(0, 255, 136, 0.05);
            border-left: 3px solid var(--accent-green);
            padding: 12px 16px; margin-bottom: 20px;
            font-size: 0.85rem; color: var(--accent-green);
        }
        .referral-banner.show { display: block; }

        .form-footer { text-align: center; margin-top: 25px; font-size: 0.85rem; color: var(--text-secondary); }
        .form-footer a { color: var(--accent-green); text-decoration: none; font-weight: 600; }

        .toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .toast {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 2px; padding: 16px 20px; min-width: 300px; max-width: 400px;
            display: flex; align-items: flex-start; gap: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto; position: relative; overflow: hidden;
        }
        .toast.show { transform: translateX(0); }
        .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
        .toast.success::before { background: var(--success); }
        .toast.error::before { background: var(--error); }
        .toast.warning::before { background: var(--warning); }
        .toast-icon { width: 24px; height: 24px; flex-shrink: 0; margin-top: 2px; }
        .toast.success .toast-icon { color: var(--success); }
        .toast.error .toast-icon { color: var(--error); }
        .toast.warning .toast-icon { color: var(--warning); }
        .toast-content { flex: 1; }
        .toast-title { font-family: var(--font-primary); font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
        .toast-message { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; }
        .toast-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 1.2rem; }

        .spinner {
            display: none; width: 20px; height: 20px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-top-color: var(--accent-green); border-radius: 50%;
            animation: spin 0.6s linear infinite; margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-loading .spinner { display: block; }
        .btn-loading .btn-text { display: none; }

        @media (max-width: 600px) {
            .card { padding: 30px 20px; }
            .brand-name { font-size: 1.8rem; }
            .toast { min-width: 250px; max-width: 350px; }
            .country-picker-btn { min-width: 88px; padding: 14px 10px; }
            .country-dial { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="particle" style="top: 20%; left: 10%;"></div>
    <div class="particle" style="top: 60%; left: 80%; animation-delay: -5s;"></div>
    <div class="particle" style="top: 40%; left: 50%; animation-delay: -10s;"></div>
    <div class="particle" style="top: 80%; left: 20%; animation-delay: -15s;"></div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <div class="card">
            <div class="top-nav">
                <a href="login.html" class="login-link">Login</a>
            </div>

            <div class="logo-section">
                <div class="logo-icon"><span>G</span></div>
                <h1 class="brand-name">Grovia</h1>
                <p class="brand-tagline">Dollar Investment Platform</p>
            </div>

            <div class="referral-banner" id="referralBanner">
                Referral code applied: <strong id="referralCodeDisplay"></strong>
            </div>

            <div class="progress-bar">
                <div class="progress-step active" id="progress1"></div>
                <div class="progress-step" id="progress2"></div>
                <div class="progress-step" id="progress3"></div>
            </div>

            <div class="form-section active" id="section1">
                <h2 class="section-title">Account Information</h2>
                <div class="input-group">
                    <label class="input-label">Username</label>
                    <input type="text" class="input-field" id="username" placeholder="Choose a unique username" autocomplete="username" oninput="checkUsernameAvailability()">
                    <div class="feedback-message" id="usernameFeedback"></div>
                </div>
                <div class="input-group">
                    <label class="input-label">Email Address</label>
                    <input type="email" class="input-field" id="email" placeholder="Enter your email" autocomplete="email">
                </div>
                <div class="input-group">
                    <label class="input-label">Phone Number</label>
                    <div class="phone-input-wrapper">
                        <button type="button" class="country-picker-btn" id="countryPickerBtn" onclick="toggleCountryDropdown(event)">
                            <span class="country-flag" id="selectedFlag">🇳🇬</span>
                            <span class="country-dial" id="selectedDial">+234</span>
                            <span class="country-caret">▼</span>
                        </button>
                        <input type="tel" class="input-field" id="phone" placeholder="Phone number" autocomplete="tel" inputmode="numeric">
                    </div>
                    <div class="feedback-message" id="phoneFeedback"></div>

                    <!-- Country dropdown -->
                    <div class="country-dropdown" id="countryDropdown">
                        <div class="country-search-box">
                            <input type="text" class="country-search-input" id="countrySearch" placeholder="Search country..." oninput="filterCountries()" onkeydown="handleCountryKeyNav(event)">
                        </div>
                        <div class="country-list" id="countryList"></div>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Referral Code (Optional)</label>
                    <input type="text" class="input-field" id="referral" placeholder="Enter referral code" autocomplete="off" oninput="validateReferralCode()">
                    <div class="feedback-message" id="referralFeedback"></div>
                </div>
                <div class="form-navigation">
                    <button class="btn-primary" onclick="nextStep(1)">
                        <span class="btn-text">Continue</span>
                        <div class="spinner"></div>
                    </button>
                </div>
            </div>

            <div class="form-section" id="section2">
                <h2 class="section-title">Security Setup</h2>
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input type="password" class="input-field" id="password" placeholder="Minimum 6 characters" autocomplete="new-password">
                </div>
                <div class="input-group">
                    <label class="input-label">Confirm Password</label>
                    <input type="password" class="input-field" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
                </div>
                <div class="form-navigation">
                    <button class="btn-back" onclick="prevStep(2)">← Back</button>
                    <button class="btn-primary btn-next" onclick="nextStep(2)">
                        <span class="btn-text">Continue</span>
                        <div class="spinner"></div>
                    </button>
                </div>
            </div>

            <div class="form-section" id="section3">
                <h2 class="section-title">Review & Create</h2>
                <div style="margin-bottom: 30px;">
                    <div style="margin-bottom: 15px;"><small style="color: var(--text-muted);">Username</small><p style="font-weight: 500;" id="reviewUsername"></p></div>
                    <div style="margin-bottom: 15px;"><small style="color: var(--text-muted);">Email</small><p style="font-weight: 500;" id="reviewEmail"></p></div>
                    <div style="margin-bottom: 15px;"><small style="color: var(--text-muted);">Phone</small><p style="font-weight: 500;" id="reviewPhone"></p></div>
                    <div style="margin-bottom: 15px;"><small style="color: var(--text-muted);">Password</small><p style="color: var(--accent-green); font-weight: 500;" id="reviewPassword"></p></div>
                    <div><small style="color: var(--text-muted);">Referral Code</small><p style="font-weight: 500;" id="reviewReferral"></p></div>
                </div>
                <div class="form-navigation">
                    <button class="btn-back" onclick="prevStep(3)">← Back</button>
                    <button class="btn-primary btn-next" onclick="createAccount()">
                        <span class="btn-text">Create Account</span>
                        <div class="spinner"></div>
                    </button>
                </div>
            </div>

            <div class="form-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

        /* ══════ STATE ══════ */
        let usernameAvailable = false;
        let referralValid = false;
        let referralOwnerUid = null;
        let userIPAddress = null;
        let selectedCountry = COUNTRIES[0];  // Nigeria by default
        let filteredCountries = [...COUNTRIES];
        let highlightedIndex = -1;

        /* ══════ IP ══════ */
        async function getIPAddress() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIPAddress = data.ip;
            } catch (e) {
                console.error('Error getting IP:', e);
                userIPAddress = 'unknown';
            }
        }
        getIPAddress();

        /* ══════ TOAST ══════ */
        function showToast(type, title, message, duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✓', error: '✗', warning: '!' };
            toast.innerHTML = `
                <div class="toast-icon">${icons[type]}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('show'); }, 100);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, duration);
        }

        /* ══════ COUNTRY PICKER ══════ */
        function renderCountryList() {
            const list = document.getElementById('countryList');
            if (filteredCountries.length === 0) {
                list.innerHTML = '<div class="country-empty">No countries found</div>';
                return;
            }
            list.innerHTML = filteredCountries.map((c, i) => `
                <div class="country-option${c.name === selectedCountry.name ? ' selected' : ''}${i === highlightedIndex ? ' highlighted' : ''}"
                     onclick="selectCountry('${c.name.replace(/'/g, "\\'")}')">
                    <span class="flag">${c.flag}</span>
                    <span class="name">${c.name}</span>
                    <span class="dial">${c.dial}</span>
                </div>
            `).join('');
        }

        window.toggleCountryDropdown = function(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('countryDropdown');
            const btn = document.getElementById('countryPickerBtn');
            const isOpen = dropdown.classList.contains('show');

            if (isOpen) {
                closeCountryDropdown();
            } else {
                dropdown.classList.add('show');
                btn.classList.add('open');
                filteredCountries = [...COUNTRIES];
                highlightedIndex = filteredCountries.findIndex(c => c.name === selectedCountry.name);
                renderCountryList();
                document.getElementById('countrySearch').value = '';
                setTimeout(() => {
                    document.getElementById('countrySearch').focus();
                    scrollToSelected();
                }, 50);
            }
        };

        function closeCountryDropdown() {
            document.getElementById('countryDropdown').classList.remove('show');
            document.getElementById('countryPickerBtn').classList.remove('open');
            highlightedIndex = -1;
        }

        function scrollToSelected() {
            const list = document.getElementById('countryList');
            const sel = list.querySelector('.country-option.selected');
            if (sel) sel.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }

        window.selectCountry = function(name) {
            const country = COUNTRIES.find(c => c.name === name);
            if (!country) return;
            selectedCountry = country;
            document.getElementById('selectedFlag').textContent = country.flag;
            document.getElementById('selectedDial').textContent = country.dial;
            closeCountryDropdown();
        };

        window.filterCountries = function() {
            const q = document.getElementById('countrySearch').value.trim().toLowerCase();
            if (!q) {
                filteredCountries = [...COUNTRIES];
            } else {
                filteredCountries = COUNTRIES.filter(c =>
                    c.name.toLowerCase().includes(q) ||
                    c.dial.replace('+', '').includes(q.replace('+', ''))
                );
            }
            highlightedIndex = filteredCountries.length > 0 ? 0 : -1;
            renderCountryList();
        };

        window.handleCountryKeyNav = function(e) {
            if (!filteredCountries.length) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                highlightedIndex = Math.min(highlightedIndex + 1, filteredCountries.length - 1);
                renderCountryList();
                scrollHighlighted();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                highlightedIndex = Math.max(highlightedIndex - 1, 0);
                renderCountryList();
                scrollHighlighted();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (highlightedIndex >= 0) {
                    selectCountry(filteredCountries[highlightedIndex].name);
                }
            } else if (e.key === 'Escape') {
                closeCountryDropdown();
            }
        };

        function scrollHighlighted() {
            const el = document.getElementById('countryList').querySelector('.country-option.highlighted');
            if (el) el.scrollIntoView({ block: 'nearest' });
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.phone-input-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                closeCountryDropdown();
            }
        });

        /* ══════ USERNAME CHECK ══════ */
        window.checkUsernameAvailability = async function() {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const feedback = document.getElementById('usernameFeedback');
            if (!username) { feedback.className = 'feedback-message'; feedback.textContent = ''; usernameAvailable = false; return; }
            if (username.length < 3) { feedback.className = 'feedback-message invalid'; feedback.textContent = 'Username must be at least 3 characters'; usernameAvailable = false; return; }
            if (!/^[a-zA-Z0-9_]+$/.test(username)) { feedback.className = 'feedback-message invalid'; feedback.textContent = 'Only letters, numbers, and underscores allowed'; usernameAvailable = false; return; }

            feedback.className = 'feedback-message checking';
            feedback.textContent = 'Checking availability...';

            try {
                const usersRef = collection(db, 'users');
                const q = query(usersRef, where('username', '==', username));
                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) {
                    feedback.className = 'feedback-message valid';
                    feedback.textContent = '✓ Username is available';
                    usernameAvailable = true;
                    document.getElementById('username').classList.add('success');
                    document.getElementById('username').classList.remove('error');
                } else {
                    feedback.className = 'feedback-message invalid';
                    feedback.textContent = '✗ Username is already taken';
                    usernameAvailable = false;
                    document.getElementById('username').classList.add('error');
                    document.getElementById('username').classList.remove('success');
                }
            } catch (error) {
                feedback.className = 'feedback-message invalid';
                feedback.textContent = 'Error checking username';
                usernameAvailable = false;
            }
        };

        /* ══════ REFERRAL CHECK ══════ */
        window.validateReferralCode = function() {
            const code = document.getElementById('referral').value.trim().toUpperCase();
            const feedback = document.getElementById('referralFeedback');
            if (!code) { feedback.className = 'feedback-message'; feedback.textContent = ''; referralValid = false; referralOwnerUid = null; return; }

            feedback.className = 'feedback-message checking';
            feedback.textContent = 'Verifying referral code...';

            setTimeout(async () => {
                try {
                    const codeDoc = await getDoc(doc(db, 'referralCodes', code));
                    if (codeDoc.exists()) {
                        const ownerUid = codeDoc.data().uid;
                        const userDoc = await getDoc(doc(db, 'users', ownerUid));
                        if (userDoc.exists()) {
                            feedback.className = 'feedback-message valid';
                            feedback.textContent = '✓ Valid referral code';
                            referralValid = true;
                            referralOwnerUid = ownerUid;
                            document.getElementById('referral').classList.add('success');
                            document.getElementById('referralCodeDisplay').textContent = code;
                            document.getElementById('referralBanner').classList.add('show');
                            showToast('success', 'Referral Applied', `Welcome from ${userDoc.data().username}!`);
                        } else {
                            feedback.className = 'feedback-message invalid';
                            feedback.textContent = '✗ Invalid referral code';
                            referralValid = false;
                        }
                    } else {
                        feedback.className = 'feedback-message invalid';
                        feedback.textContent = '✗ Invalid referral code';
                        referralValid = false;
                    }
                } catch (error) {
                    feedback.className = 'feedback-message invalid';
                    feedback.textContent = 'Error verifying code';
                    referralValid = false;
                }
            }, 600);
        };

        /* ══════ NAVIGATION ══════ */
        window.nextStep = function(step) {
            if (step === 1) {
                const username = document.getElementById('username').value.trim().toLowerCase();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();

                if (!username || username.length < 3) { showToast('error', 'Invalid Username', 'Please enter a valid username.'); return; }
                if (!usernameAvailable) { showToast('error', 'Username Unavailable', 'Please choose an available username.'); return; }
                if (!email || !email.includes('@')) { showToast('error', 'Invalid Email', 'Please enter a valid email.'); return; }
                if (!phone || phone.length < 6) { showToast('error', 'Invalid Phone', 'Please enter a valid phone number.'); return; }
            }
            if (step === 2) {
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                if (!password || password.length < 6) { showToast('error', 'Weak Password', 'Password must be at least 6 characters.'); return; }
                if (password !== confirmPassword) { showToast('error', 'Password Mismatch', 'Passwords do not match.'); return; }
                document.getElementById('reviewUsername').textContent = document.getElementById('username').value;
                document.getElementById('reviewEmail').textContent = document.getElementById('email').value;
                document.getElementById('reviewPhone').textContent = `${selectedCountry.flag} ${selectedCountry.dial} ${document.getElementById('phone').value}`;
                document.getElementById('reviewPassword').textContent = '••••••••';
                const referralCode = document.getElementById('referral').value.trim();
                document.getElementById('reviewReferral').textContent = referralCode || 'None';
            }
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            const nextSection = document.getElementById(`section${step + 1}`);
            if (nextSection) nextSection.classList.add('active');
            for (let i = 1; i <= 3; i++) {
                const progress = document.getElementById(`progress${i}`);
                progress.classList.remove('active', 'completed');
                if (i < step + 1) progress.classList.add('completed');
                if (i === step + 1) progress.classList.add('active');
            }
        };

        window.prevStep = function(step) {
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            const prevSection = document.getElementById(`section${step - 1}`);
            if (prevSection) prevSection.classList.add('active');
            for (let i = 1; i <= 3; i++) {
                const progress = document.getElementById(`progress${i}`);
                progress.classList.remove('active', 'completed');
                if (i < step - 1) progress.classList.add('completed');
                if (i === step - 1) progress.classList.add('active');
            }
        };

        /* ══════ CREATE ACCOUNT ══════ */
        window.createAccount = async function() {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const fullPhone = selectedCountry.dial + phone.replace(/^0+/, '');
            const password = document.getElementById('password').value;
            const referralCode = document.getElementById('referral').value.trim().toUpperCase();
            const button = event.target;
            button.classList.add('btn-loading');
            button.disabled = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;
                const shortCode = uid.substring(0, 8).toUpperCase();

                let referredBy = null;
                if (referralValid && referralOwnerUid && referralOwnerUid !== uid) {
                    referredBy = referralOwnerUid;
                }

                await setDoc(doc(db, 'users', uid), {
                    uid,
                    username,
                    email,
                    phone: fullPhone,
                    countryCode: selectedCountry.dial,
                    countryName: selectedCountry.name,
                    password,
                    referredBy,
                    referralCode: shortCode,
                    ipAddress: userIPAddress,
                    deviceInfo: navigator.userAgent,
                    depositWallet: 0.00,
                    withdrawalWallet: 0.00,
                    totalDeposits: 0.00,
                    totalWithdrawals: 0.00,
                    activeInvestments: 0.00,
                    referralEarnings: 0.00,
                    totalEarnings: 0.00,
                    currency: 'USD',
                    createdAt: serverTimestamp(),
                    status: 'active'
                });

                await setDoc(doc(db, 'referralCodes', shortCode), {
                    uid,
                    username,
                    createdAt: serverTimestamp()
                });

                if (referredBy) {
                    const referrerRef = doc(db, 'users', referredBy);
                    const referrerDoc = await getDoc(referrerRef);
                    if (referrerDoc.exists()) {
                        await setDoc(referrerRef, {
                            totalReferrals: (referrerDoc.data().totalReferrals || 0) + 1
                        }, { merge: true });
                    }
                }

                button.classList.remove('btn-loading');
                button.disabled = false;
                showToast('success', 'Welcome to Grovia!', 'Your account has been created successfully.', 6000);

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                button.classList.remove('btn-loading');
                button.disabled = false;
                console.error('Registration error:', error);
                const errorMessages = {
                    'auth/email-already-in-use': 'This email is already registered.',
                    'auth/invalid-email': 'Please enter a valid email address.',
                    'auth/weak-password': 'Password is too weak.',
                    'auth/network-request-failed': 'Network error. Check your connection.'
                };
                showToast('error', 'Registration Failed', errorMessages[error.code] || 'An error occurred. Please try again.');
            }
        };

        /* ══════ INIT ══════ */
        document.addEventListener('DOMContentLoaded', () => {
            // Set default country (Nigeria)
            document.getElementById('selectedFlag').textContent = selectedCountry.flag;
            document.getElementById('selectedDial').textContent = selectedCountry.dial;

            // URL referral
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            if (refCode) {
                document.getElementById('referral').value = refCode.toUpperCase();
                validateReferralCode();
            }
        });
    </script>
