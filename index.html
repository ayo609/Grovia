<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grovia - Dollar Investment Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --accent-green: #00ff88;
            --accent-blue: #00d4ff;
            --accent-purple: #7c3aed;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border-color: #2d3748;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow-glow: 0 0 30px rgba(0, 255, 136, 0.1);
            --font-primary: 'Space Grotesk', sans-serif;
            --font-secondary: 'Inter', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-secondary);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Grid Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: var(--accent-green);
            border-radius: 50%;
            pointer-events: none;
            animation: float 20s infinite;
            opacity: 0.3;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(100px, -50px); }
            50% { transform: translate(50px, 100px); }
            75% { transform: translate(-100px, 50px); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        /* Main Card */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue), var(--accent-purple));
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--accent-green);
            transform: rotate(45deg);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(45deg); }
            100% { transform: rotate(405deg); }
        }

        .logo-icon span {
            font-family: var(--font-primary);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-green);
            position: relative;
            z-index: 1;
        }

        .brand-name {
            font-family: var(--font-primary);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* Form Sections */
        .form-section {
            display: none;
            animation: slideIn 0.5s ease;
        }

        .form-section.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .section-title {
            font-family: var(--font-primary);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-primary);
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-green);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 16px;
            font-family: var(--font-secondary);
            font-size: 0.95rem;
            border-radius: 2px;
            transition: var(--transition);
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field.error {
            border-color: var(--error);
        }

        /* Progress Indicator */
        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .progress-step {
            width: 40px;
            height: 3px;
            background: var(--border-color);
            transition: var(--transition);
        }

        .progress-step.active {
            background: var(--accent-green);
        }

        .progress-step.completed {
            background: var(--accent-blue);
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--accent-green);
            color: var(--accent-green);
            font-family: var(--font-primary);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent-green);
            transition: var(--transition);
            z-index: -1;
        }

        .btn-primary:hover {
            color: var(--bg-primary);
        }

        .btn-primary:hover::before {
            left: 0;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font-secondary);
            font-size: 0.9rem;
            padding: 10px;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            color: var(--accent-green);
        }

        /* Navigation Buttons */
        .form-navigation {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-back {
            padding: 15px 25px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font-secondary);
            font-size: 0.9rem;
            transition: var(--transition);
            border-radius: 2px;
        }

        .btn-back:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-next {
            flex: 1;
        }

        /* Referral Banner */
        .referral-banner {
            display: none;
            background: rgba(0, 255, 136, 0.05);
            border-left: 3px solid var(--accent-green);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--accent-green);
        }

        .referral-banner.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        /* Toast Container - Bottom Right */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            padding: 16px 20px;
            min-width: 300px;
            max-width: 400px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }

        .toast.success::before {
            background: var(--success);
        }

        .toast.error::before {
            background: var(--error);
        }

        .toast.warning::before {
            background: var(--warning);
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }

        .toast.success .toast-icon {
            color: var(--success);
        }

        .toast.error .toast-icon {
            color: var(--error);
        }

        .toast.warning .toast-icon {
            color: var(--warning);
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .toast-message {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 1.2rem;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .toast-close:hover {
            color: var(--text-primary);
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-loading .spinner {
            display: block;
        }

        .btn-loading .btn-text {
            display: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card {
                padding: 30px 20px;
            }
            
            .brand-name {
                font-size: 1.8rem;
            }
            
            .toast {
                min-width: 250px;
                max-width: 350px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div class="particle" style="top: 20%; left: 10%;"></div>
    <div class="particle" style="top: 60%; left: 80%; animation-delay: -5s;"></div>
    <div class="particle" style="top: 40%; left: 50%; animation-delay: -10s;"></div>
    <div class="particle" style="top: 80%; left: 20%; animation-delay: -15s;"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <div class="card">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo-icon">
                    <span>G</span>
                </div>
                <h1 class="brand-name">Grovia</h1>
                <p class="brand-tagline">Dollar Investment Platform</p>
            </div>

            <!-- Referral Banner -->
            <div class="referral-banner" id="referralBanner">
                Referral code applied: <strong id="referralCodeDisplay"></strong>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar">
                <div class="progress-step active" id="progress1"></div>
                <div class="progress-step" id="progress2"></div>
                <div class="progress-step" id="progress3"></div>
            </div>

            <!-- Step 1: Personal Info -->
            <div class="form-section active" id="section1">
                <h2 class="section-title">Personal Information</h2>
                
                <div class="input-group">
                    <label class="input-label">Email Address</label>
                    <input type="email" class="input-field" id="email" placeholder="Enter your email" autocomplete="email">
                </div>

                <div class="input-group">
                    <label class="input-label">Referral Code (Optional)</label>
                    <input type="text" class="input-field" id="referral" placeholder="Enter referral code" autocomplete="off">
                </div>

                <div class="form-navigation">
                    <button class="btn-primary" onclick="nextStep(1)">
                        <span class="btn-text">Continue</span>
                        <div class="spinner"></div>
                    </button>
                </div>
            </div>

            <!-- Step 2: Security -->
            <div class="form-section" id="section2">
                <h2 class="section-title">Security Setup</h2>
                
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input type="password" class="input-field" id="password" placeholder="Minimum 6 characters" autocomplete="new-password">
                </div>

                <div class="input-group">
                    <label class="input-label">Confirm Password</label>
                    <input type="password" class="input-field" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
                </div>

                <div class="form-navigation">
                    <button class="btn-back" onclick="prevStep(2)">← Back</button>
                    <button class="btn-primary btn-next" onclick="nextStep(2)">
                        <span class="btn-text">Continue</span>
                        <div class="spinner"></div>
                    </button>
                </div>
            </div>

            <!-- Step 3: Review & Create -->
            <div class="form-section" id="section3">
                <h2 class="section-title">Review & Create</h2>
                
                <div style="margin-bottom: 30px;">
                    <div style="margin-bottom: 15px;">
                        <small style="color: var(--text-muted);">Email</small>
                        <p style="color: var(--text-primary); font-weight: 500;" id="reviewEmail"></p>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <small style="color: var(--text-muted);">Password Strength</small>
                        <p style="color: var(--accent-green); font-weight: 500;" id="reviewPassword"></p>
                    </div>
                    <div>
                        <small style="color: var(--text-muted);">Referral Code</small>
                        <p style="color: var(--text-primary); font-weight: 500;" id="reviewReferral"></p>
                    </div>
                </div>

                <div class="form-navigation">
                    <button class="btn-back" onclick="prevStep(3)">← Back</button>
                    <button class="btn-primary btn-next" onclick="createAccount()">
                        <span class="btn-text">Create Account</span>
                        <div class="spinner"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
            authDomain: "grovia-15266.firebaseapp.com",
            projectId: "grovia-15266",
            storageBucket: "grovia-15266.firebasestorage.app",
            messagingSenderId: "330674853010",
            appId: "1:330674853010:web:15a2cce632dd4528b8024b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Toast System
        function showToast(type, title, message, duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>',
                error: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                warning: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
            };
            
            toast.innerHTML = `
                <div class="toast-icon">${icons[type]}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 100);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        // Navigation Functions
        window.nextStep = function(step) {
            if (step === 1) {
                const email = document.getElementById('email').value.trim();
                if (!email || !email.includes('@')) {
                    showToast('error', 'Invalid Email', 'Please enter a valid email address.');
                    return;
                }
                showToast('success', 'Email Verified', 'Email address looks good!');
            }
            
            if (step === 2) {
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                if (!password || password.length < 6) {
                    showToast('error', 'Weak Password', 'Password must be at least 6 characters.');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showToast('error', 'Password Mismatch', 'Passwords do not match.');
                    return;
                }
                
                // Update review section
                document.getElementById('reviewEmail').textContent = document.getElementById('email').value;
                document.getElementById('reviewPassword').textContent = 'Strong';
                const referralCode = document.getElementById('referral').value.trim();
                document.getElementById('reviewReferral').textContent = referralCode || 'None';
            }
            
            // Hide all sections
            document.querySelectorAll('.form-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Show next section
            const nextSection = document.getElementById(`section${step + 1}`);
            if (nextSection) {
                nextSection.classList.add('active');
            }
            
            // Update progress
            for (let i = 1; i <= 3; i++) {
                const progress = document.getElementById(`progress${i}`);
                progress.classList.remove('active', 'completed');
                if (i < step + 1) progress.classList.add('completed');
                if (i === step + 1) progress.classList.add('active');
            }
        };

        window.prevStep = function(step) {
            document.querySelectorAll('.form-section').forEach(section => {
                section.classList.remove('active');
            });
            
            const prevSection = document.getElementById(`section${step - 1}`);
            if (prevSection) {
                prevSection.classList.add('active');
            }
            
            for (let i = 1; i <= 3; i++) {
                const progress = document.getElementById(`progress${i}`);
                progress.classList.remove('active', 'completed');
                if (i < step - 1) progress.classList.add('completed');
                if (i === step - 1) progress.classList.add('active');
            }
        };

        // Create Account
        window.createAccount = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const referralCode = document.getElementById('referral').value.trim().toUpperCase();
            
            const button = event.target;
            button.classList.add('btn-loading');
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;
                
                let referredBy = null;
                if (referralCode) {
                    const codeDoc = await getDoc(doc(db, 'referralCodes', referralCode));
                    if (codeDoc.exists() && codeDoc.data().uid !== uid) {
                        referredBy = codeDoc.data().uid;
                    }
                }
                
                const shortCode = uid.substring(0, 8).toUpperCase();
                
                await setDoc(doc(db, 'users', uid), {
                    uid,
                    email,
                    referredBy,
                    referralCode: shortCode,
                    depositWallet: 0.00,
                    withdrawalWallet: 0.00,
                    totalDeposits: 0.00,
                    totalWithdrawals: 0.00,
                    activeInvestments: 0.00,
                    referralEarnings: 0.00,
                    totalEarnings: 0.00,
                    currency: 'USD',
                    createdAt: serverTimestamp(),
                    status: 'active'
                });
                
                await setDoc(doc(db, 'referralCodes', shortCode), {
                    uid,
                    createdAt: serverTimestamp()
                });
                
                button.classList.remove('btn-loading');
                showToast('success', 'Welcome to Grovia! 🎉', 'Your USD investment account has been created successfully.', 6000);
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
                
            } catch (error) {
                button.classList.remove('btn-loading');
                
                const errorMessages = {
                    'auth/email-already-in-use': 'This email is already registered.',
                    'auth/invalid-email': 'Please enter a valid email address.',
                    'auth/weak-password': 'Password is too weak.',
                    'auth/network-request-failed': 'Network error. Check your connection.'
                };
                
                showToast('error', 'Registration Failed', errorMessages[error.code] || 'An error occurred. Please try again.');
            }
        };

        // Check for referral in URL
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            
            if (refCode) {
                document.getElementById('referral').value = refCode.toUpperCase();
                document.getElementById('referralCodeDisplay').textContent = refCode.toUpperCase();
                document.getElementById('referralBanner').classList.add('show');
                showToast('success', 'Referral Applied', `Welcome from ${refCode}!`);
            }
        });
    </script>
</body>
</html>
