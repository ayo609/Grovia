<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - Grovia Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-elevated: #22222e;
            --accent-red: #ff4444;
            --accent-red-dark: #cc0000;
            --accent-gold: #ffd700;
            --accent-green: #00e676;
            --accent-blue: #29b6f6;
            --text-primary: #f5f5f7;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --border: rgba(255,255,255,0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 40% at 10% 10%, rgba(255,68,68,0.05) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(255,215,0,0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 36px; height: 36px; border-radius: 9px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-red-dark));
            display: grid; place-items: center;
            font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: white;
        }
        .logo-name {
            font-family: var(--font-display); font-size: 1rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .admin-email { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); }
        .logout-btn {
            padding: 6px 16px; border-radius: 40px; border: 1px solid rgba(255,68,68,0.4);
            background: transparent; color: var(--accent-red); font-family: var(--font-body);
            font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .logout-btn:hover { background: rgba(255,68,68,0.1); }

        .main { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 24px 16px 0; }

        /* Search & Filter */
        .search-container { margin-bottom: 20px; }
        .search-input-wrapper { position: relative; margin-bottom: 10px; }
        .search-input {
            width: 100%; padding: 14px 16px 14px 44px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-primary);
            font-family: var(--font-body); font-size: 0.9rem; outline: none;
            transition: var(--transition);
        }
        .search-input:focus { border-color: var(--accent-red); }
        .search-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 1.1rem;
        }
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn {
            padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 20px; color: var(--text-secondary); cursor: pointer;
            font-family: var(--font-body); font-size: 0.75rem; font-weight: 600;
            transition: var(--transition);
        }
        .filter-btn:hover { border-color: var(--accent-red); }
        .filter-btn.active {
            background: var(--accent-red); color: white; border-color: transparent;
        }

        /* Stats */
        .stats-row {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px;
        }
        .stat-mini {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px; text-align: center;
        }
        .stat-mini-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-mini-value { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }

        /* Users List */
        .users-list {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-md); overflow: hidden;
        }
        .user-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            transition: var(--transition); flex-wrap: wrap; gap: 10px;
        }
        .user-item:last-child { border-bottom: none; }
        .user-item:hover { background: var(--bg-elevated); }
        .user-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 180px; }
        .user-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-gold));
            display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; color: white;
            flex-shrink: 0;
        }
        .user-details { flex: 1; }
        .user-name { font-weight: 600; font-size: 0.85rem; }
        .user-email { font-size: 0.7rem; color: var(--text-muted); }
        .user-balances { display: flex; gap: 15px; font-size: 0.75rem; }
        .balance-item { text-align: center; }
        .balance-label { font-size: 0.6rem; color: var(--text-muted); }
        .balance-value { font-weight: 700; font-size: 0.8rem; }
        .balance-value.deposit { color: var(--accent-green); }
        .balance-value.withdrawal { color: var(--accent-gold); }
        .user-status {
            padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 600;
        }
        .user-status.active { background: rgba(0,230,118,0.15); color: var(--accent-green); }
        .user-status.suspended { background: rgba(255,68,68,0.15); color: var(--accent-red); }
        .user-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .action-btn {
            padding: 6px 12px; border-radius: 6px; font-size: 0.7rem; font-weight: 600;
            cursor: pointer; border: none; transition: var(--transition); font-family: var(--font-body);
        }
        .view-btn { background: rgba(41,182,246,0.15); color: var(--accent-blue); border: 1px solid rgba(41,182,246,0.3); }
        .view-btn:hover { background: var(--accent-blue); color: white; }
        .edit-btn { background: rgba(255,215,0,0.15); color: var(--accent-gold); border: 1px solid rgba(255,215,0,0.3); }
        .edit-btn:hover { background: var(--accent-gold); color: #0a0a0f; }
        .suspend-btn { background: rgba(255,165,0,0.15); color: #ffa500; border: 1px solid rgba(255,165,0,0.3); }
        .suspend-btn:hover { background: #ffa500; color: white; }
        .reset-btn { background: rgba(124,58,237,0.15); color: #b388ff; border: 1px solid rgba(124,58,237,0.3); }
        .reset-btn:hover { background: #b388ff; color: white; }
        .delete-btn { background: rgba(255,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(255,68,68,0.3); }
        .delete-btn:hover { background: var(--accent-red); color: white; }

        .empty-state {
            text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.85rem;
        }

        .load-more { text-align: center; margin-top: 20px; }
        .load-more-btn {
            padding: 10px 25px; background: transparent; border: 2px solid var(--accent-red);
            color: var(--accent-red); border-radius: 25px; cursor: pointer;
            font-family: var(--font-body); font-weight: 600; transition: var(--transition);
        }
        .load-more-btn:hover { background: var(--accent-red); color: white; }

        /* Bottom Navigation - 7 items */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
            background: rgba(10,10,15,0.95); backdrop-filter: blur(16px);
            border-top: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-around; z-index: 200;
            overflow-x: auto; scrollbar-width: none;
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px; background: none;
            border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition);
            padding: 4px 10px; text-decoration: none; font-family: var(--font-body);
            flex-shrink: 0; min-width: 55px;
        }
        .nav-item:hover, .nav-item.active { color: var(--accent-red); }
        .nav-item svg { width: 20px; height: 20px; }
        .nav-label { font-size: 0.58rem; font-weight: 600; }

        /* Modals */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .overlay.show { display: flex; }
        .modal {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 28px; width: 100%; max-width: 420px; position: relative;
            animation: fadeUp 0.25s ease; max-height: 90vh; overflow-y: auto;
        }
        @keyframes fadeUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-close {
            position: absolute; top: 14px; right: 14px; background: none; border: none;
            color: var(--text-muted); font-size: 1.3rem; cursor: pointer;
        }
        .modal-title {
            font-family: var(--font-display); font-size: 1.2rem; font-weight: 700;
            margin-bottom: 15px; color: var(--accent-gold);
        }
        .modal-text { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-label {
            display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px;
        }
        .form-input {
            width: 100%; padding: 11px 14px; background: var(--bg-secondary);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            color: var(--text-primary); font-family: var(--font-body); font-size: 0.9rem;
            outline: none; transition: var(--transition);
        }
        .form-input:focus { border-color: var(--accent-gold); }
        .form-select {
            width: 100%; padding: 11px 14px; background: var(--bg-secondary);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            color: var(--text-primary); font-family: var(--font-body); font-size: 0.9rem;
            outline: none; transition: var(--transition); cursor: pointer;
        }
        .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-modal {
            padding: 11px; border-radius: var(--radius-sm); font-family: var(--font-body);
            font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: var(--transition);
        }
        .btn-modal.cancel { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-modal.danger { background: rgba(255,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(255,68,68,0.3); }
        .btn-modal.danger:hover { background: var(--accent-red); color: white; }
        .btn-modal.confirm { background: var(--accent-green); color: #0a0a0f; }
        .btn-modal.confirm:hover { opacity: 0.85; }
        .btn-modal.add { background: var(--accent-green); color: #0a0a0f; }
        .btn-modal.add:hover { opacity: 0.85; }
        .btn-modal.deduct { background: rgba(255,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(255,68,68,0.3); }
        .btn-modal.deduct:hover { background: var(--accent-red); color: white; }

        .detail-row {
            display: flex; justify-content: space-between; padding: 8px 0;
            border-bottom: 1px solid var(--border); font-size: 0.82rem;
        }
        .detail-label { color: var(--text-muted); }
        .detail-value { font-weight: 600; }

        .toasts { position: fixed; bottom: 76px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 13px 16px; min-width: 280px; max-width: 360px; display: flex; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); transform: translateX(110%);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative;
        }
        .toast.show { transform: translateX(0); }
        .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
        .toast.success::before { background: var(--accent-green); }
        .toast.error::before { background: var(--accent-red); }
        .toast-icon { font-size: 1rem; flex-shrink: 0; }
        .toast-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .toast-msg { font-size: 0.78rem; color: var(--text-secondary); }

        @media (max-width: 600px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .main { padding: 16px 12px 0; }
            .logo-name { display: none; }
            .admin-email { display: none; }
            .user-balances { flex-direction: column; gap: 4px; }
            .nav-item { min-width: 45px; padding: 4px 6px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-mark">A</div>
        <div class="logo-name">Admin Panel</div>
    </div>
    <div class="header-right">
        <span class="admin-email" id="adminEmail">admin@grovia.com</span>
        <button class="logout-btn" onclick="showLogout()">Logout</button>
    </div>
</header>

<main class="main">
    <!-- Search -->
    <div class="search-container">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Search by username or email..." oninput="searchUsers()">
        </div>
        <div class="filter-row">
            <button class="filter-btn active" onclick="filterUsers('all', this)">All</button>
            <button class="filter-btn" onclick="filterUsers('active', this)">Active</button>
            <button class="filter-btn" onclick="filterUsers('suspended', this)">Suspended</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-mini">
            <div class="stat-mini-label">Total</div>
            <div class="stat-mini-value" id="statTotal" style="color: var(--accent-blue);">0</div>
        </div>
        <div class="stat-mini">
            <div class="stat-mini-label">Active</div>
            <div class="stat-mini-value" id="statActive" style="color: var(--accent-green);">0</div>
        </div>
        <div class="stat-mini">
            <div class="stat-mini-label">Suspended</div>
            <div class="stat-mini-value" id="statSuspended" style="color: var(--accent-red);">0</div>
        </div>
        <div class="stat-mini">
            <div class="stat-mini-label">New (7d)</div>
            <div class="stat-mini-value" id="statNew" style="color: var(--accent-gold);">0</div>
        </div>
    </div>

    <!-- Users List -->
    <div class="users-list" id="usersList">
        <div class="empty-state">Loading users...</div>
    </div>

    <!-- Load More -->
    <div class="load-more" id="loadMoreContainer" style="display: none;">
        <button class="load-more-btn" onclick="loadMoreUsers()">Load More</button>
    </div>
</main>

        <span class="nav-label">History</span>

</nav>

<!-- Logout Modal -->
<div class="overlay" id="logoutOverlay">
    <div class="modal">
        <div class="modal-title" style="color: var(--accent-red);">Confirm Logout</div>
        <p class="modal-text">Are you sure you want to logout?</p>
        <div class="modal-btns">
            <button class="btn-modal cancel" onclick="closeLogout()">Cancel</button>
            <button class="btn-modal danger" onclick="doLogout()">Logout</button>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div class="overlay" id="deleteOverlay">
    <div class="modal">
        <div class="modal-title" style="color: var(--accent-red);">Delete User</div>
        <p class="modal-text" id="deleteText"></p>
        <div class="modal-btns">
            <button class="btn-modal cancel" onclick="closeDelete()">Cancel</button>
            <button class="btn-modal danger" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<!-- Suspend Modal -->
<div class="overlay" id="suspendOverlay">
    <div class="modal">
        <div class="modal-title" id="suspendTitle">Suspend User</div>
        <p class="modal-text" id="suspendText"></p>
        <div class="modal-btns">
            <button class="btn-modal cancel" onclick="closeSuspend()">Cancel</button>
            <button class="btn-modal confirm" onclick="confirmSuspend()">Confirm</button>
        </div>
    </div>
</div>

<!-- Reset Password Modal -->
<div class="overlay" id="resetOverlay">
    <div class="modal">
        <div class="modal-title">Reset Password</div>
        <p class="modal-text" id="resetText"></p>
        <div class="modal-btns">
            <button class="btn-modal cancel" onclick="closeReset()">Cancel</button>
            <button class="btn-modal confirm" onclick="confirmReset()">Reset to Grovia12$</button>
        </div>
    </div>
</div>

<!-- Wallet Operations Modal -->
<div class="overlay" id="walletOverlay">
    <div class="modal">
        <button class="modal-close" onclick="closeWallet()">×</button>
        <div class="modal-title">Wallet Operations</div>
        <div id="walletUserInfo" style="margin-bottom: 15px; font-size: 0.85rem;"></div>
        
        <div class="form-group">
            <label class="form-label">Operation Type</label>
            <select class="form-select" id="operationType">
                <option value="add">Add Funds</option>
                <option value="deduct">Deduct Funds</option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label">Wallet</label>
            <select class="form-select" id="walletType">
                <option value="depositWallet">Deposit Wallet</option>
                <option value="withdrawalWallet">Withdrawal Wallet</option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label">Amount</label>
            <input type="number" class="form-input" id="walletAmount" placeholder="Enter amount" step="0.01" min="0.01">
        </div>
        
        <div class="modal-btns">
            <button class="btn-modal cancel" onclick="closeWallet()">Cancel</button>
            <button class="btn-modal add" onclick="performWalletOperation()">Apply</button>
        </div>
    </div>
</div>

<!-- User Detail Modal -->
<div class="overlay" id="detailOverlay">
    <div class="modal">
        <button class="modal-close" onclick="closeDetail()">×</button>
        <div class="modal-title">User Details</div>
        <div id="detailContent"></div>
    </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, doc, deleteDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
    authDomain: "grovia-15266.firebaseapp.com",
    projectId: "grovia-15266",
    storageBucket: "grovia-15266.firebasestorage.app",
    messagingSenderId: "330674853010",
    appId: "1:330674853010:web:15a2cce632dd4528b8024b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allUsers = [];
let filteredUsers = [];
let currentFilter = 'all';
let searchQuery = '';
let visibleCount = 20;
let userToDelete = null;
let userToSuspend = null;
let userToReset = null;
let userToEditWallet = null;

function toast(type, title, msg) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<div class="toast-icon">${type === 'success' ? 'OK' : '!'}</div><div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4000);
}

window.showLogout = () => document.getElementById('logoutOverlay').classList.add('show');
window.closeLogout = () => document.getElementById('logoutOverlay').classList.remove('show');
window.doLogout = async () => {
    sessionStorage.removeItem('grovia_admin');
    await signOut(auth);
    location.href = 'admin-login.html';
};

window.showDelete = (uid, username) => {
    userToDelete = { uid, username };
    document.getElementById('deleteText').textContent = `Delete "${username}"? This will remove all their data permanently.`;
    document.getElementById('deleteOverlay').classList.add('show');
};
window.closeDelete = () => { document.getElementById('deleteOverlay').classList.remove('show'); userToDelete = null; };
window.confirmDelete = async () => {
    if (!userToDelete) return;
    try {
        const { uid } = userToDelete;
        const plansQ = query(collection(db, 'plans'), where('uid', '==', uid));
        const plansSnap = await getDocs(plansQ);
        plansSnap.forEach(async d => await deleteDoc(doc(db, 'plans', d.id)));
        
        const txQ = query(collection(db, 'transactions'), where('uid', '==', uid));
        const txSnap = await getDocs(txQ);
        txSnap.forEach(async d => await deleteDoc(doc(db, 'transactions', d.id)));
        
        await deleteDoc(doc(db, 'users', uid));
        closeDelete();
        toast('success', 'User Deleted', `${userToDelete.username} has been deleted.`);
        loadUsers();
    } catch (e) {
        toast('error', 'Failed', 'Error deleting user.');
    }
};

window.showSuspend = (uid, username, status) => {
    userToSuspend = { uid, username, status };
    const newStatus = status === 'active' ? 'suspend' : 'activate';
    document.getElementById('suspendTitle').textContent = newStatus === 'suspend' ? 'Suspend User' : 'Activate User';
    document.getElementById('suspendText').textContent = `${newStatus === 'suspend' ? 'Suspend' : 'Activate'} "${username}"?`;
    document.getElementById('suspendOverlay').classList.add('show');
};
window.closeSuspend = () => { document.getElementById('suspendOverlay').classList.remove('show'); userToSuspend = null; };
window.confirmSuspend = async () => {
    if (!userToSuspend) return;
    const newStatus = userToSuspend.status === 'active' ? 'suspended' : 'active';
    await updateDoc(doc(db, 'users', userToSuspend.uid), { status: newStatus });
    closeSuspend();
    toast('success', 'Updated', `${userToSuspend.username} is now ${newStatus}.`);
    loadUsers();
};

window.showReset = (uid, username) => {
    userToReset = { uid, username };
    document.getElementById('resetText').textContent = `Reset password for "${username}" to "Grovia12$"?`;
    document.getElementById('resetOverlay').classList.add('show');
};
window.closeReset = () => { document.getElementById('resetOverlay').classList.remove('show'); userToReset = null; };
window.confirmReset = async () => {
    if (!userToReset) return;
    await updateDoc(doc(db, 'users', userToReset.uid), { password: 'Grovia12$' });
    closeReset();
    toast('success', 'Password Reset', `Password for ${userToReset.username} has been reset to Grovia12$.`);
};

window.showWallet = (uid, username) => {
    userToEditWallet = { uid, username };
    const user = allUsers.find(u => u.id === uid);
    if (user) {
        document.getElementById('walletUserInfo').innerHTML = `
            <strong>${user.username}</strong> - ${user.email}<br>
            <span style="color: var(--accent-green);">Deposit: $${(user.depositWallet || 0).toFixed(2)}</span> | 
            <span style="color: var(--accent-gold);">Withdrawal: $${(user.withdrawalWallet || 0).toFixed(2)}</span>
        `;
    }
    document.getElementById('operationType').value = 'add';
    document.getElementById('walletType').value = 'depositWallet';
    document.getElementById('walletAmount').value = '';
    document.getElementById('walletOverlay').classList.add('show');
};
window.closeWallet = () => { document.getElementById('walletOverlay').classList.remove('show'); userToEditWallet = null; };

window.performWalletOperation = async () => {
    if (!userToEditWallet) return;
    
    const operation = document.getElementById('operationType').value;
    const walletType = document.getElementById('walletType').value;
    const amount = parseFloat(document.getElementById('walletAmount').value);
    
    if (!amount || amount <= 0) {
        toast('error', 'Invalid Amount', 'Please enter a valid amount.');
        return;
    }
    
    try {
        if (operation === 'add') {
            // Add funds
            await updateDoc(doc(db, 'users', userToEditWallet.uid), {
                [walletType]: increment(amount)
            });
            toast('success', 'Funds Added', `$${amount.toFixed(2)} added to ${userToEditWallet.username}'s ${walletType === 'depositWallet' ? 'deposit' : 'withdrawal'} wallet.`);
        } else {
            // Deduct funds
            const user = allUsers.find(u => u.id === userToEditWallet.uid);
            const currentBalance = user ? (user[walletType] || 0) : 0;
            
            if (amount > currentBalance) {
                toast('error', 'Insufficient Balance', `Cannot deduct $${amount.toFixed(2)}. Current balance is $${currentBalance.toFixed(2)}.`);
                return;
            }
            
            await updateDoc(doc(db, 'users', userToEditWallet.uid), {
                [walletType]: increment(-amount)
            });
            toast('success', 'Funds Deducted', `$${amount.toFixed(2)} deducted from ${userToEditWallet.username}'s ${walletType === 'depositWallet' ? 'deposit' : 'withdrawal'} wallet.`);
        }
        
        closeWallet();
        loadUsers();
    } catch (e) {
        console.error(e);
        toast('error', 'Failed', 'Error performing wallet operation.');
    }
};

window.showDetail = (uid) => {
    const user = allUsers.find(u => u.id === uid);
    if (!user) return;
    const content = document.getElementById('detailContent');
    content.innerHTML = `
        <div class="detail-row"><span class="detail-label">Username</span><span class="detail-value">${user.username}</span></div>
        <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${user.email}</span></div>
        <div class="detail-row"><span class="detail-label">Deposit Wallet</span><span class="detail-value">$${(user.depositWallet || 0).toFixed(2)}</span></div>
        <div class="detail-row"><span class="detail-label">Withdrawal Wallet</span><span class="detail-value">$${(user.withdrawalWallet || 0).toFixed(2)}</span></div>
        <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${user.status || 'active'}</span></div>
    `;
    document.getElementById('detailOverlay').classList.add('show');
};
window.closeDetail = () => document.getElementById('detailOverlay').classList.remove('show');

window.searchUsers = function() {
    searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
    applyFilters();
};

window.filterUsers = function(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
};

function applyFilters() {
    filteredUsers = allUsers.filter(user => {
        const matchesFilter = currentFilter === 'all' || (user.status || 'active') === currentFilter;
        const matchesSearch = !searchQuery || 
            (user.username || '').toLowerCase().includes(searchQuery) || 
            (user.email || '').toLowerCase().includes(searchQuery);
        return matchesFilter && matchesSearch;
    });
    visibleCount = 20;
    renderUsers();
}

function renderUsers() {
    const list = document.getElementById('usersList');
    const visible = filteredUsers.slice(0, visibleCount);
    
    if (visible.length === 0) {
        list.innerHTML = '<div class="empty-state">No users found</div>';
        document.getElementById('loadMoreContainer').style.display = 'none';
        return;
    }
    
    list.innerHTML = '';
    visible.forEach(user => {
        const status = user.status || 'active';
        const item = document.createElement('div');
        item.className = 'user-item';
        item.innerHTML = `
            <div class="user-info">
                <div class="user-avatar">${(user.username || 'U').charAt(0).toUpperCase()}</div>
                <div class="user-details">
                    <div class="user-name">${user.username || 'Unknown'}</div>
                    <div class="user-email">${user.email || ''}</div>
                </div>
            </div>
            <div class="user-balances">
                <div class="balance-item">
                    <div class="balance-label">Deposit</div>
                    <div class="balance-value deposit">$${(user.depositWallet || 0).toFixed(2)}</div>
                </div>
                <div class="balance-item">
                    <div class="balance-label">Withdrawal</div>
                    <div class="balance-value withdrawal">$${(user.withdrawalWallet || 0).toFixed(2)}</div>
                </div>
            </div>
            <span class="user-status ${status}">${status}</span>
            <div class="user-actions">
                <button class="action-btn view-btn" onclick="showDetail('${user.id}')">View</button>
                <button class="action-btn edit-btn" onclick="showWallet('${user.id}', '${user.username}')">Wallet</button>
                <button class="action-btn suspend-btn" onclick="showSuspend('${user.id}', '${user.username}', '${status}')">${status === 'active' ? 'Suspend' : 'Activate'}</button>
                <button class="action-btn reset-btn" onclick="showReset('${user.id}', '${user.username}')">Reset Pass</button>
                <button class="action-btn delete-btn" onclick="showDelete('${user.id}', '${user.username}')">Delete</button>
            </div>
        `;
        list.appendChild(item);
    });
    
    document.getElementById('loadMoreContainer').style.display = filteredUsers.length > visibleCount ? 'block' : 'none';
}

window.loadMoreUsers = function() {
    visibleCount += 20;
    renderUsers();
};

async function loadUsers() {
    try {
        const snapshot = await getDocs(collection(db, 'users'));
        allUsers = [];
        snapshot.forEach(doc => {
            allUsers.push({ id: doc.id, ...doc.data() });
        });
        
        const total = allUsers.length;
        const active = allUsers.filter(u => (u.status || 'active') === 'active').length;
        const suspended = allUsers.filter(u => u.status === 'suspended').length;
        const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
        const newUsers = allUsers.filter(u => {
            const d = u.createdAt?.toDate?.() || new Date(0);
            return d > weekAgo;
        }).length;
        
        document.getElementById('statTotal').textContent = total;
        document.getElementById('statActive').textContent = active;
        document.getElementById('statSuspended').textContent = suspended;
        document.getElementById('statNew').textContent = newUsers;
        
        applyFilters();
    } catch (e) {
        console.error(e);
        document.getElementById('usersList').innerHTML = '<div class="empty-state">Error loading users</div>';
    }
}

onAuthStateChanged(auth, (user) => {
    if (user && sessionStorage.getItem('grovia_admin') === 'true') {
        document.getElementById('adminEmail').textContent = user.email;
        loadUsers();
    } else {
        location.href = 'admin-login.html';
    }
});
</script>
</body>
</html>
