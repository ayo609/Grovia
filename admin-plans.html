<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plans - Grovia Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-elevated: #22222e;
            --accent-red: #ff4444;
            --accent-red-dark: #cc0000;
            --accent-gold: #ffd700;
            --accent-green: #00e676;
            --accent-blue: #29b6f6;
            --accent-purple: #7c3aed;
            --text-primary: #f5f5f7;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --border: rgba(255,255,255,0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 40% at 10% 10%, rgba(0,230,118,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(41,182,246,0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 36px; height: 36px; border-radius: 9px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-red-dark));
            display: grid; place-items: center;
            font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: white;
        }
        .logo-name {
            font-family: var(--font-display); font-size: 1rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .admin-email { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); }
        .logout-btn {
            padding: 6px 16px; border-radius: 40px; border: 1px solid rgba(255,68,68,0.4);
            background: transparent; color: var(--accent-red); font-family: var(--font-body);
            font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .logout-btn:hover { background: rgba(255,68,68,0.1); }

        .main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px 0; }

        /* Stats */
        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px; text-align: center;
        }
        .stat-label {
            font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 4px;
        }
        .stat-value { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; }
        .stat-value.total { color: var(--accent-blue); }
        .stat-value.active { color: var(--accent-green); }
        .stat-value.completed { color: var(--accent-gold); }

        /* Filter Tabs */
        .filter-tabs {
            display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-tab {
            padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 25px; color: var(--text-secondary); cursor: pointer;
            white-space: nowrap; transition: var(--transition);
            font-family: var(--font-body); font-size: 0.78rem; font-weight: 600;
        }
        .filter-tab:hover { border-color: var(--accent-green); }
        .filter-tab.active {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            color: #0a0a0f; border-color: transparent;
        }

        /* Plans List */
        .plans-list { display: flex; flex-direction: column; gap: 12px; }
        .plan-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 16px; transition: var(--transition);
        }
        .plan-card:hover { border-color: var(--accent-green); }
        .plan-card.active { border-left: 3px solid var(--accent-green); }
        .plan-card.completed { border-left: 3px solid var(--accent-gold); }

        .plan-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
        }
        .plan-user { display: flex; align-items: center; gap: 10px; }
        .plan-avatar {
            width: 35px; height: 35px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            display: grid; place-items: center; font-weight: 700; font-size: 0.85rem;
            color: #0a0a0f; flex-shrink: 0;
        }
        .plan-info { flex: 1; }
        .plan-username { font-weight: 600; font-size: 0.85rem; }
        .plan-name { font-size: 0.7rem; color: var(--accent-blue); font-weight: 600; }
        .plan-amount {
            font-family: var(--font-display); font-weight: 700; font-size: 1rem;
            color: var(--accent-green);
        }
        .plan-status {
            padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 600;
        }
        .plan-status.active { background: rgba(0,230,118,0.15); color: var(--accent-green); }
        .plan-status.completed { background: rgba(255,193,7,0.15); color: var(--accent-gold); }

        .plan-details {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px;
        }
        .plan-detail-item {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 8px 10px; font-size: 0.7rem;
        }
        .plan-detail-label { color: var(--text-muted); margin-bottom: 2px; }
        .plan-detail-value { font-weight: 600; }

        .empty-state {
            text-align: center; padding: 40px; background: var(--bg-card);
            border-radius: var(--radius-md); border: 1px solid var(--border);
            color: var(--text-muted); font-size: 0.85rem;
        }

        .load-more { text-align: center; margin-top: 20px; }
        .load-more-btn {
            padding: 10px 25px; background: transparent; border: 2px solid var(--accent-green);
            color: var(--accent-green); border-radius: 25px; cursor: pointer;
            font-family: var(--font-body); font-weight: 600; transition: var(--transition);
        }
        .load-more-btn:hover { background: var(--accent-green); color: #0a0a0f; }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
            background: rgba(10,10,15,0.95); backdrop-filter: blur(16px);
            border-top: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-around; z-index: 200;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px; background: none;
            border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition);
            padding: 4px 12px; text-decoration: none; font-family: var(--font-body);
        }
        .nav-item:hover, .nav-item.active { color: var(--accent-red); }
        .nav-item svg { width: 22px; height: 22px; }
        .nav-label { font-size: 0.6rem; font-weight: 600; }

        /* Logout Modal */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
            z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .overlay.show { display: flex; }
        .modal {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 25px; width: 100%; max-width: 400px; position: relative;
            animation: fadeUp 0.25s ease;
        }
        @keyframes fadeUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-title {
            font-family: var(--font-display); font-size: 1.1rem; font-weight: 700;
            margin-bottom: 12px; color: var(--accent-red);
        }
        .modal-text { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 20px; }
        .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-modal {
            padding: 11px; border-radius: var(--radius-sm); font-family: var(--font-body);
            font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: var(--transition);
        }
        .btn-modal.cancel { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-modal.danger { background: rgba(255,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(255,68,68,0.3); }
        .btn-modal.danger:hover { background: var(--accent-red); color: white; }

        .toasts { position: fixed; bottom: 76px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 13px 16px; min-width: 280px; max-width: 360px; display: flex; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); transform: translateX(110%);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative;
        }
        .toast.show { transform: translateX(0); }
        .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
        .toast.success::before { background: var(--accent-green); }
        .toast.error::before { background: var(--accent-red); }
        .toast-icon { font-size: 1rem; flex-shrink: 0; }
        .toast-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .toast-msg { font-size: 0.78rem; color: var(--text-secondary); }

        @media (max-width: 600px) {
            .main { padding: 16px 12px 0; }
            .logo-name { display: none; }
            .admin-email { display: none; }
            .stats-row { grid-template-columns: 1fr; }
            .plan-details { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-mark">A</div>
        <div class="logo-name">Admin Panel</div>
    </div>
    <div class="header-right">
        <span class="admin-email" id="adminEmail">admin@grovia.com</span>
        <button class="logout-btn" onclick="showLogout()">Logout</button>
    </div>
</header>

<main class="main">
    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">Total Plans</div>
            <div class="stat-value total" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Active</div>
            <div class="stat-value active" id="statActive">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Completed</div>
            <div class="stat-value completed" id="statCompleted">0</div>
        </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterPlans('all', this)">All</button>
        <button class="filter-tab" onclick="filterPlans('active', this)">Active</button>
        <button class="filter-tab" onclick="filterPlans('completed', this)">Completed</button>
    </div>

    <!-- Plans List -->
    <div class="plans-list" id="plansList">
        <div class="empty-state">Loading plans...</div>
    </div>

    <!-- Load More -->
    <div class="load-more" id="loadMoreContainer" style="display: none;">
        <button class="load-more-btn" onclick="loadMorePlans()">Load More</button>
    </div>
</main>

<nav class="bottom-nav">
    <a href="admin-dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="nav-label">Home</span>
    </a>
    <a href="admin-users.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="nav-label">Users</span>
    </a>
    <a href="admin-deposits.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18M7 15h2m4 0h2m-8 4h6M5 10l1-7h12l1 7M5 10v10a2 2 0 002 2h10a2 2 0 002-2V10"/></svg>
        <span class="nav-label">Deposits</span>
    </a>
    <a href="admin-withdrawals.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 14h18M7 19h2m4 0h2m-8 4h6M5 14l-1-7h16l-1 7M5 14v-4a2 2 0 012-2h10a2 2 0 012 2v4"/></svg>
        <span class="nav-label">Withdrawals</span>
    </a>
    <a href="admin-plans.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span class="nav-label">Plans</span>
    </a>
</nav>

<!-- Logout Modal -->
<div class="overlay" id="logoutOverlay">
    <div class="modal">
        <div class="modal-title">Confirm Logout</div>
        <p class="modal-text">Are you sure you want to logout?</p>
        <div class="modal-btns">
            <button class="btn-modal cancel" onclick="closeLogout()">Cancel</button>
            <button class="btn-modal danger" onclick="doLogout()">Logout</button>
        </div>
    </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
    authDomain: "grovia-15266.firebaseapp.com",
    projectId: "grovia-15266",
    storageBucket: "grovia-15266.firebasestorage.app",
    messagingSenderId: "330674853010",
    appId: "1:330674853010:web:15a2cce632dd4528b8024b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allPlans = [];
let currentFilter = 'all';
let visibleCount = 20;

function toast(type, title, msg) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<div class="toast-icon">${type === 'success' ? 'OK' : '!'}</div><div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4000);
}

window.showLogout = () => document.getElementById('logoutOverlay').classList.add('show');
window.closeLogout = () => document.getElementById('logoutOverlay').classList.remove('show');
window.doLogout = async () => {
    sessionStorage.removeItem('grovia_admin');
    await signOut(auth);
    location.href = 'admin-login.html';
};

window.filterPlans = function(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderPlans();
};

function formatDate(dateValue) {
    if (!dateValue) return '—';
    let date;
    if (typeof dateValue.toDate === 'function') date = dateValue.toDate();
    else if (dateValue instanceof Date) date = dateValue;
    else return '—';
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function renderPlans() {
    const list = document.getElementById('plansList');
    const filtered = allPlans.filter(p => currentFilter === 'all' || p.status === currentFilter);
    
    // Update stats
    const total = allPlans.length;
    const active = allPlans.filter(p => p.status === 'active').length;
    const completed = allPlans.filter(p => p.status === 'completed').length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statActive').textContent = active;
    document.getElementById('statCompleted').textContent = completed;
    
    if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">No ${currentFilter} plans found</div>`;
        document.getElementById('loadMoreContainer').style.display = 'none';
        return;
    }
    
    const visible = filtered.slice(0, visibleCount);
    list.innerHTML = '';
    
    visible.forEach(plan => {
        const card = document.createElement('div');
        card.className = `plan-card ${plan.status}`;
        card.innerHTML = `
            <div class="plan-header">
                <div class="plan-user">
                    <div class="plan-avatar">${(plan.username || 'U').charAt(0).toUpperCase()}</div>
                    <div class="plan-info">
                        <div class="plan-username">${plan.username || 'Unknown'}</div>
                        <div class="plan-name">${plan.planName || 'Unknown Plan'}</div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div class="plan-amount">$${(plan.amount || 0).toFixed(2)}</div>
                    <span class="plan-status ${plan.status}">${plan.status}</span>
                </div>
            </div>
            <div class="plan-details">
                <div class="plan-detail-item">
                    <div class="plan-detail-label">Daily ROI</div>
                    <div class="plan-detail-value" style="color: var(--accent-green);">$${plan.dailyROI || 0}/day</div>
                </div>
                <div class="plan-detail-item">
                    <div class="plan-detail-label">Start Date</div>
                    <div class="plan-detail-value">${formatDate(plan.startDate)}</div>
                </div>
                <div class="plan-detail-item">
                    <div class="plan-detail-label">End Date</div>
                    <div class="plan-detail-value">${formatDate(plan.endDate)}</div>
                </div>
                <div class="plan-detail-item">
                    <div class="plan-detail-label">Total Return</div>
                    <div class="plan-detail-value" style="color: var(--accent-gold);">$${((plan.dailyROI || 0) * 30).toFixed(2)}</div>
                </div>
            </div>
        `;
        list.appendChild(card);
    });
    
    document.getElementById('loadMoreContainer').style.display = filtered.length > visibleCount ? 'block' : 'none';
}

window.loadMorePlans = function() {
    visibleCount += 20;
    renderPlans();
};

async function loadPlans() {
    try {
        const plansSnap = await getDocs(collection(db, 'plans'));
        allPlans = [];
        
        for (const docSnap of plansSnap.docs) {
            const data = docSnap.data();
            
            // Get username
            let username = 'Unknown';
            if (data.uid) {
                const userDoc = await getDoc(doc(db, 'users', data.uid));
                if (userDoc.exists()) {
                    username = userDoc.data().username || 'Unknown';
                }
            }
            
            allPlans.push({
                id: docSnap.id,
                ...data,
                username
            });
        }
        
        // Sort by date
        allPlans.sort((a, b) => {
            const dateA = a.createdAt?.toDate?.() || a.startDate?.toDate?.() || new Date(0);
            const dateB = b.createdAt?.toDate?.() || b.startDate?.toDate?.() || new Date(0);
            return dateB - dateA;
        });
        
        renderPlans();
    } catch (e) {
        console.error(e);
        document.getElementById('plansList').innerHTML = '<div class="empty-state">Error loading plans</div>';
    }
}

onAuthStateChanged(auth, (user) => {
    if (user && sessionStorage.getItem('grovia_admin') === 'true') {
        document.getElementById('adminEmail').textContent = user.email;
        loadPlans();
    } else {
        location.href = 'admin-login.html';
    }
});
</script>
</body>
</html>
