<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit — Grovia</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0c1220;
            --bg-secondary: #111927;
            --bg-card: #162030;
            --bg-elevated: #1c2a3a;
            --accent-green: #00e676;
            --accent-blue: #29b6f6;
            --accent-gold: #ffc107;
            --accent-red: #ff5252;
            --text-primary: #eef2f7;
            --text-secondary: #8fa3b8;
            --text-muted: #506070;
            --border: rgba(255,255,255,0.07);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px 16px 48px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 10% 20%, rgba(0,230,118,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 80%, rgba(41,182,246,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .back-btn:hover {
            border-color: rgba(0,230,118,0.4);
            color: var(--accent-green);
        }

        .page-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px;
            text-align: center;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
        }

        .balance-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .balance-amount {
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--accent-green);
            line-height: 1.1;
        }

        /* Payment Method Selection */
        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .payment-method {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .payment-method:hover {
            border-color: var(--accent-blue);
        }

        .payment-method.active {
            border-color: var(--accent-green);
            background: rgba(0,230,118,0.05);
        }

        .payment-method-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .payment-method-name {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .payment-method-desc {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Payment Details */
        .payment-details {
            display: none;
            margin-bottom: 16px;
        }

        .payment-details.show {
            display: block;
        }

        .address-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
        }

        .address-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .address-text {
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            color: var(--accent-blue);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            word-break: break-all;
            margin-bottom: 12px;
            cursor: pointer;
            transition: var(--transition);
            line-height: 1.6;
            user-select: all;
        }

        .copy-btn {
            padding: 9px 22px;
            border: 1px solid rgba(41,182,246,0.3);
            border-radius: var(--radius-sm);
            background: rgba(41,182,246,0.1);
            color: var(--accent-blue);
            font-family: var(--font-body);
            font-size: 0.83rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .copy-btn:hover {
            background: var(--accent-blue);
            color: #0c1220;
            border-color: var(--accent-blue);
        }

        .copy-btn.copied {
            background: rgba(0,230,118,0.15);
            color: var(--accent-green);
            border-color: rgba(0,230,118,0.3);
        }

        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .input-field:focus {
            border-color: rgba(0,230,118,0.45);
            background: var(--bg-elevated);
            box-shadow: 0 0 0 3px rgba(0,230,118,0.06);
        }

        .field-hint {
            margin-top: 5px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .field-hint.error { color: var(--accent-red); }
        .field-hint.success { color: var(--accent-green); }

        .conversion-display {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .conversion-display.show {
            display: block;
        }

        .conversion-text {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .upload-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-btn {
            flex-shrink: 0;
            position: relative;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.83rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            overflow: hidden;
        }

        .upload-btn input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .upload-btn.has-file {
            border-color: rgba(0,230,118,0.4);
            color: var(--accent-green);
        }

        .file-name-display {
            flex: 1;
            font-size: 0.78rem;
            color: var(--text-muted);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Courier New', monospace;
        }

        .file-name-display.ready {
            color: var(--accent-green);
            border-color: rgba(0,230,118,0.25);
            background: rgba(0,230,118,0.04);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            color: #0c1220;
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            border-radius: var(--radius-sm);
        }

        .submit-btn:hover:not(:disabled) {
            opacity: 0.9;
            box-shadow: 0 6px 24px rgba(0,230,118,0.22);
        }

        .submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .toasts {
            position: fixed;
            bottom: 20px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 13px 16px;
            min-width: 260px;
            max-width: 340px;
            display: flex;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transform: translateX(110%);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
            position: relative;
        }

        .toast.show { transform: translateX(0); }
        .toast::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: var(--radius-md) 0 0 var(--radius-md);
        }
        .toast.success::before { background: var(--accent-green); }
        .toast.error::before { background: var(--accent-red); }
        .toast.info::before { background: var(--accent-blue); }
        .toast-icon { font-size: 1rem; flex-shrink: 0; margin-top: 2px; }
        .toast-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .toast-msg { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.4; }

        @media (max-width: 480px) {
            .balance-amount { font-size: 2rem; }
            .page-title { font-size: 1.3rem; }
            .form-card { padding: 18px; }
            .payment-methods { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="page-header">
        <button class="back-btn" onclick="location.href='dashboard.html'" aria-label="Back">←</button>
        <h1 class="page-title">Deposit Funds</h1>
    </div>

    <div class="balance-card">
        <div class="balance-label">Deposit Wallet Balance</div>
        <div class="balance-amount"><span>$</span><span id="depositBalance">0.00</span></div>
    </div>

    <!-- Payment Method Selection -->
    <div class="payment-methods">
        <div class="payment-method active" id="usdtMethod" onclick="selectMethod('usdt')">
            <div class="payment-method-icon">💎</div>
            <div class="payment-method-name">USDT (BEP20)</div>
            <div class="payment-method-desc">Deposit in USD</div>
        </div>
        <div class="payment-method" id="nairaMethod" onclick="selectMethod('naira')">
            <div class="payment-method-icon">₦</div>
            <div class="payment-method-name">Naira</div>
            <div class="payment-method-desc">PALMPAY Transfer</div>
        </div>
    </div>

    <!-- USDT Payment Details -->
    <div class="payment-details show" id="usdtDetails">
        <div class="address-card">
            <div class="address-label">Send USDT To (BEP20)</div>
            <div class="address-text" id="usdtAddress" onclick="copyAddress('usdtAddress')" title="Click to copy">
                0x1234567890ABCDEF1234567890ABCDEF12345678
            </div>
            <button class="copy-btn" onclick="copyAddress('usdtAddress')">Copy Address</button>
        </div>
    </div>

    <!-- Naira Payment Details -->
    <div class="payment-details" id="nairaDetails">
        <div class="address-card">
            <div class="address-label">Send Naira To</div>
            <div class="address-text" id="nairaAccount" onclick="copyAddress('nairaAccount')" title="Click to copy">
                8902203124
            </div>
            <div style="margin-bottom: 10px; font-size: 0.8rem; color: var(--text-secondary);">
                <strong>PALMPAY</strong> - Taufeek Muftau
            </div>
            <button class="copy-btn" onclick="copyAddress('nairaAccount')">Copy Account Number</button>
        </div>
    </div>

    <div class="form-card">
        <div class="form-group">
            <label class="form-label" for="fullName">Full Name</label>
            <input type="text" id="fullName" class="input-field" placeholder="Enter your full name" autocomplete="name">
            <div class="field-hint" id="nameHint"></div>
        </div>

        <div class="form-group" id="usdtAmountGroup">
            <label class="form-label" for="usdtAmount">Amount (USD)</label>
            <input type="number" id="usdtAmount" class="input-field" placeholder="Minimum $5.00" min="5" step="0.01">
            <div class="field-hint" id="usdtAmountHint">Minimum deposit: $5.00</div>
        </div>

        <div class="form-group" id="nairaAmountGroup" style="display: none;">
            <label class="form-label" for="nairaAmount">Amount (₦)</label>
            <input type="number" id="nairaAmount" class="input-field" placeholder="Minimum ₦7,500" min="7500" step="100">
            <div class="field-hint" id="nairaAmountHint">Minimum deposit: ₦7,500 ($5.00)</div>
            <div class="conversion-display" id="conversionDisplay">
                <div class="conversion-text" id="conversionText"></div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Payment Screenshot</label>
            <div class="upload-row">
                <div class="upload-btn" id="uploadBtn">
                    Choose File
                    <input type="file" id="screenshotInput" accept="image/*">
                </div>
                <div class="file-name-display" id="fileNameDisplay">No file chosen</div>
            </div>
            <div class="field-hint" id="screenshotHint"></div>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="submitDeposit()">
            Submit Deposit Request
        </button>
    </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
    authDomain: "grovia-15266.firebaseapp.com",
    projectId: "grovia-15266",
    storageBucket: "grovia-15266.firebasestorage.app",
    messagingSenderId: "330674853010",
    appId: "1:330674853010:web:15a2cce632dd4528b8024b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const NAIRA_RATE = 1500; // ₦1500 = $1

let currentUser = null;
let userData = null;
let uploadedImageB64 = null;
let selectedMethod = 'usdt';

function toast(type, title, msg, dur = 5000) {
    const icons = { success: 'OK', error: '!', info: 'i' };
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `
        <div class="toast-icon">${icons[type] || '·'}</div>
        <div>
            <div class="toast-title">${title}</div>
            <div class="toast-msg">${msg}</div>
        </div>
    `;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 400);
    }, dur);
}

function setHint(id, msg, type = '') {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.className = `field-hint ${type}`;
}

window.selectMethod = function(method) {
    selectedMethod = method;
    
    document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('active'));
    document.getElementById(method + 'Method').classList.add('active');
    
    document.getElementById('usdtDetails').classList.toggle('show', method === 'usdt');
    document.getElementById('nairaDetails').classList.toggle('show', method === 'naira');
    
    document.getElementById('usdtAmountGroup').style.display = method === 'usdt' ? 'block' : 'none';
    document.getElementById('nairaAmountGroup').style.display = method === 'naira' ? 'block' : 'none';
};

window.copyAddress = function(id) {
    const addr = document.getElementById(id).textContent.trim();
    navigator.clipboard.writeText(addr).then(() => {
        toast('success', 'Copied', 'Copied to clipboard.');
    }).catch(() => toast('error', 'Copy Failed', 'Could not copy.'));
};

function compressImage(file, maxW = 900, quality = 0.65) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                let w = img.width, h = img.height;
                if (w > maxW) { h = Math.round((maxW / w) * h); w = maxW; }
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

document.getElementById('screenshotInput').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    const btn = document.getElementById('uploadBtn');
    const display = document.getElementById('fileNameDisplay');
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
        toast('error', 'File Too Large', 'Please upload under 5 MB.');
        this.value = '';
        return;
    }
    try {
        uploadedImageB64 = await compressImage(file);
        display.textContent = file.name;
        display.classList.add('ready');
        btn.classList.add('has-file');
        setHint('screenshotHint', 'Screenshot ready', 'success');
    } catch {
        toast('error', 'Upload Error', 'Failed to process image.');
        this.value = '';
    }
});

// Naira conversion
document.getElementById('nairaAmount').addEventListener('input', function() {
    const nairaAmount = parseFloat(this.value);
    const conversionDisplay = document.getElementById('conversionDisplay');
    const conversionText = document.getElementById('conversionText');
    
    if (nairaAmount && nairaAmount >= 7500) {
        const usdEquivalent = nairaAmount / NAIRA_RATE;
        conversionDisplay.classList.add('show');
        conversionText.textContent = `₦${nairaAmount.toLocaleString()} = $${usdEquivalent.toFixed(2)} USD`;
        setHint('nairaAmountHint', `Will be credited as $${usdEquivalent.toFixed(2)} USD`, 'success');
    } else {
        conversionDisplay.classList.remove('show');
        setHint('nairaAmountHint', 'Minimum deposit: ₦7,500 ($5.00)', '');
    }
});

// USDT validation
document.getElementById('usdtAmount').addEventListener('input', function() {
    const v = parseFloat(this.value);
    if (!this.value) {
        setHint('usdtAmountHint', 'Minimum deposit: $5.00', '');
    } else if (v < 5) {
        setHint('usdtAmountHint', 'Minimum deposit is $5.00', 'error');
    } else {
        setHint('usdtAmountHint', `$${v.toFixed(2)} will be credited after confirmation.`, 'success');
    }
});

window.submitDeposit = async function() {
    if (!currentUser || !userData) return;

    const name = document.getElementById('fullName').value.trim();
    const btn = document.getElementById('submitBtn');
    
    let amountInUSD = 0;
    let paymentMethod = '';
    let amountInput = '';
    
    if (selectedMethod === 'usdt') {
        amountInUSD = parseFloat(document.getElementById('usdtAmount').value);
        paymentMethod = 'USDT (BEP20)';
        amountInput = `$${amountInUSD.toFixed(2)}`;
    } else {
        const nairaAmount = parseFloat(document.getElementById('nairaAmount').value);
        amountInUSD = nairaAmount / NAIRA_RATE;
        paymentMethod = 'Naira (PALMPAY)';
        amountInput = `₦${nairaAmount.toLocaleString()} ($${amountInUSD.toFixed(2)})`;
    }
    
    if (!name || name.length < 3) {
        setHint('nameHint', 'Please enter your full name.', 'error');
        return;
    }
    
    if (!amountInUSD || amountInUSD < 5) {
        toast('error', 'Invalid Amount', 'Minimum deposit is $5.00.');
        return;
    }
    
    if (!uploadedImageB64) {
        setHint('screenshotHint', 'Please upload payment screenshot.', 'error');
        return;
    }
    
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    
    try {
        await addDoc(collection(db, 'deposits'), {
            uid: currentUser.uid,
            username: userData.username || '',
            email: userData.email || '',
            fullName: name,
            amount: amountInUSD,
            amountInput: amountInput,
            paymentMethod: paymentMethod,
            paymentScreenshot: uploadedImageB64,
            status: 'pending',
            createdAt: serverTimestamp(),
            processedAt: null,
            adminNote: ''
        });
        
        toast('success', 'Request Submitted', `${amountInput} deposit is under review.`);
        
        // Reset form
        document.getElementById('fullName').value = '';
        document.getElementById('usdtAmount').value = '';
        document.getElementById('nairaAmount').value = '';
        document.getElementById('screenshotInput').value = '';
        uploadedImageB64 = null;
        document.getElementById('uploadBtn').classList.remove('has-file');
        document.getElementById('fileNameDisplay').textContent = 'No file chosen';
        document.getElementById('fileNameDisplay').classList.remove('ready');
        document.getElementById('conversionDisplay').classList.remove('show');
        setHint('nameHint', '', '');
        setHint('usdtAmountHint', 'Minimum deposit: $5.00', '');
        setHint('nairaAmountHint', 'Minimum deposit: ₦7,500 ($5.00)', '');
        setHint('screenshotHint', '', '');
        
    } catch (e) {
        console.error(e);
        toast('error', 'Submission Failed', 'Something went wrong. Please try again.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Deposit Request';
    }
};

async function loadUser() {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    if (snap.exists()) {
        userData = snap.data();
        document.getElementById('depositBalance').textContent = (userData.depositWallet || 0).toFixed(2);
    }
}

onAuthStateChanged(auth, async user => {
    if (user) {
        currentUser = user;
        await loadUser();
    } else {
        location.href = 'login.html';
    }
});
</script>
</body>
</html>
