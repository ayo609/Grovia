<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Grovia</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0c1220;
            --bg-secondary: #111927;
            --bg-card: #162030;
            --bg-elevated: #1c2a3a;
            --accent-green: #00e676;
            --accent-blue: #29b6f6;
            --accent-gold: #ffc107;
            --accent-purple: #7c3aed;
            --accent-red: #ff5252;
            --text-primary: #eef2f7;
            --text-secondary: #8fa3b8;
            --text-muted: #506070;
            --border: rgba(255,255,255,0.07);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 10% 20%, rgba(124,58,237,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 80%, rgba(0,230,118,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(12,18,32,0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 36px; height: 36px; border-radius: 9px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            display: grid; place-items: center;
            font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
            color: #0c1220;
        }
        .logo-name {
            font-family: var(--font-display); font-size: 1.15rem; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logout-btn {
            padding: 6px 16px; border-radius: 40px; border: 1px solid rgba(255,82,82,0.4);
            background: transparent; color: var(--accent-red); font-family: var(--font-body);
            font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .logout-btn:hover { background: rgba(255,82,82,0.1); }

        .main { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 24px 16px 0; }

        /* Avatar - No box, just floating */
        .avatar-section { text-align: center; margin-bottom: 35px; }
        .avatar-ring {
            width: 90px; height: 90px; margin: 0 auto 12px;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .avatar-ring::before {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            border: 2px dashed var(--accent-purple); animation: rotate 20s linear infinite;
        }
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .profile-avatar {
            width: 75px; height: 75px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: white;
            box-shadow: 0 8px 25px rgba(124,58,237,0.3);
        }
        .profile-name { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }
        .profile-username { font-size: 0.85rem; color: var(--accent-blue); }

        /* Identity - No box, just text rows */
        .identity-section { margin-bottom: 30px; }
        .section-title {
            font-family: var(--font-display); font-size: 0.85rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; color: var(--accent-purple);
            margin-bottom: 12px;
        }
        .identity-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border);
        }
        .identity-row:last-child { border-bottom: none; }
        .identity-label { font-size: 0.82rem; color: var(--text-muted); }
        .identity-value { font-size: 0.88rem; font-weight: 600; }

        /* Wallet - No box */
        .wallet-section { margin-bottom: 30px; }
        .wallet-section .section-title { color: var(--accent-green); }
        .wallet-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border);
        }
        .wallet-row:last-child { border-bottom: none; }
        .wallet-label { font-size: 0.82rem; color: var(--text-muted); }
        .wallet-value { font-family: var(--font-display); font-size: 1rem; font-weight: 700; }

        /* Earnings Chart - SVG */
        .chart-section { margin-bottom: 30px; }
        .chart-section .section-title { color: var(--accent-gold); }
        .chart-container {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 20px;
        }
        .chart-svg { width: 100%; height: 120px; }
        .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 80px; margin-top: 10px; }
        .chart-bar {
            flex: 1; border-radius: 4px 4px 0 0; transition: var(--transition);
            min-height: 4px;
        }
        .chart-bar:hover { opacity: 0.7; }
        .chart-bar.green { background: linear-gradient(180deg, var(--accent-green), rgba(0,230,118,0.3)); }
        .chart-bar.blue { background: linear-gradient(180deg, var(--accent-blue), rgba(41,182,246,0.3)); }
        .chart-bar.gold { background: linear-gradient(180deg, var(--accent-gold), rgba(255,193,7,0.3)); }
        .chart-bar.purple { background: linear-gradient(180deg, var(--accent-purple), rgba(124,58,237,0.3)); }
        .chart-labels { display: flex; gap: 6px; margin-top: 8px; }
        .chart-label { flex: 1; text-align: center; font-size: 0.6rem; color: var(--text-muted); }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
            background: rgba(12,18,32,0.95); backdrop-filter: blur(16px);
            border-top: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-around; z-index: 200;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px; background: none;
            border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition);
            padding: 4px 20px; text-decoration: none; font-family: var(--font-body);
        }
        .nav-item:hover, .nav-item.active { color: var(--accent-green); }
        .nav-item svg { width: 22px; height: 22px; }
        .nav-label { font-size: 0.68rem; font-weight: 600; }

        /* Logout Modal */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
            z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .overlay.show { display: flex; }
        .modal {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 28px; width: 100%; max-width: 380px; position: relative;
        }
        .modal-title {
            font-family: var(--font-display); font-size: 1.2rem; font-weight: 700;
            margin-bottom: 12px; color: var(--accent-red);
        }
        .modal-text { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 20px; }
        .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-modal {
            padding: 11px; border-radius: var(--radius-sm); font-family: var(--font-body);
            font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: var(--transition);
        }
        .btn-modal.cancel { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-modal.danger { background: rgba(255,82,82,0.15); color: var(--accent-red); border: 1px solid rgba(255,82,82,0.3); }
        .btn-modal.danger:hover { background: var(--accent-red); color: white; }

        .toasts { position: fixed; bottom: 76px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 13px 16px; min-width: 260px; max-width: 340px; display: flex; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); transform: translateX(110%);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toast.show { transform: translateX(0); }
        .toast.success::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent-green); }
        .toast.error::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent-red); }
        .toast-icon { font-size: 1rem; }
        .toast-title { font-size: 0.85rem; font-weight: 700; }
        .toast-msg { font-size: 0.78rem; color: var(--text-secondary); }

        @media (max-width: 600px) {
            .main { padding: 16px 12px 0; }
            .logo-name { display: none; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-mark">G</div>
        <div class="logo-name">Grovia</div>
    </div>
    <button class="logout-btn" onclick="showLogout()">Logout</button>
</header>

<main class="main">
    <!-- Avatar - No box -->
    <div class="avatar-section">
        <div class="avatar-ring">
            <div class="profile-avatar" id="profileAvatar">U</div>
        </div>
        <div class="profile-name" id="profileName">Username</div>
        <div class="profile-username" id="profileUsername">@username</div>
    </div>

    <!-- Identity - No box -->
    <div class="identity-section">
        <div class="section-title">Identity</div>
        <div class="identity-row">
            <span class="identity-label">Username</span>
            <span class="identity-value" id="infoUsername">-</span>
        </div>
        <div class="identity-row">
            <span class="identity-label">Email</span>
            <span class="identity-value" id="infoEmail">-</span>
        </div>
        <div class="identity-row">
            <span class="identity-label">Joined</span>
            <span class="identity-value" id="infoMemberSince">-</span>
        </div>
    </div>

    <!-- Wallet - No box -->
    <div class="wallet-section">
        <div class="section-title">Wallet</div>
        <div class="wallet-row">
            <span class="wallet-label">Deposit</span>
            <span class="wallet-value" id="infoDepositWallet" style="color: var(--accent-green);">$0.00</span>
        </div>
        <div class="wallet-row">
            <span class="wallet-label">Withdrawal</span>
            <span class="wallet-value" id="infoWithdrawalWallet" style="color: var(--accent-gold);">$0.00</span>
        </div>
        <div class="wallet-row">
            <span class="wallet-label">Total Earnings</span>
            <span class="wallet-value" id="infoTotalEarnings" style="color: var(--accent-blue);">$0.00</span>
        </div>
    </div>

    <!-- Earnings Chart -->
    <div class="chart-section">
        <div class="section-title">Earnings Overview</div>
        <div class="chart-container">
            <div class="chart-bars" id="chartBars">
                <!-- Bars will be dynamically rendered -->
            </div>
            <div class="chart-labels">
                <span class="chart-label">Mon</span>
                <span class="chart-label">Tue</span>
                <span class="chart-label">Wed</span>
                <span class="chart-label">Thu</span>
                <span class="chart-label">Fri</span>
                <span class="chart-label">Sat</span>
                <span class="chart-label">Sun</span>
            </div>
        </div>
    </div>
</main>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="nav-label">Home</span>
    </a>
    <a href="history.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        <span class="nav-label">History</span>
    </a>
    <a href="referrals.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="nav-label">Referrals</span>
    </a>
    <a href="profile.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="nav-label">Profile</span>
    </a>
</nav>

<!-- Logout Modal -->
<div class="overlay" id="logoutOverlay">
    <div class="modal">
        <div class="modal-title">Confirm Logout</div>
        <p class="modal-text">Are you sure you want to log out of your account?</p>
        <div class="modal-btns">
            <button class="btn-modal cancel" onclick="closeLogout()">Cancel</button>
            <button class="btn-modal danger" onclick="doLogout()">Logout</button>
        </div>
    </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
    authDomain: "grovia-15266.firebaseapp.com",
    projectId: "grovia-15266",
    storageBucket: "grovia-15266.firebasestorage.app",
    messagingSenderId: "330674853010",
    appId: "1:330674853010:web:15a2cce632dd4528b8024b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let userData = null;

function toast(type, title, msg) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<div class="toast-icon">${type === 'success' ? 'OK' : '!'}</div><div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4000);
}

window.showLogout = () => document.getElementById('logoutOverlay').classList.add('show');
window.closeLogout = () => document.getElementById('logoutOverlay').classList.remove('show');
window.doLogout = async () => { await signOut(auth); location.href = 'login.html'; };

document.querySelectorAll('.overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); });
});

function renderChart() {
    const bars = document.getElementById('chartBars');
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const colors = ['green', 'blue', 'gold', 'purple', 'green', 'blue', 'gold'];
    
    // Generate random heights for demo (replace with real data)
    const heights = days.map(() => Math.floor(Math.random() * 70) + 10);
    
    bars.innerHTML = '';
    days.forEach((day, i) => {
        const bar = document.createElement('div');
        bar.className = `chart-bar ${colors[i]}`;
        bar.style.height = `${heights[i]}px`;
        bars.appendChild(bar);
    });
}

async function loadUserData() {
    if (!currentUser) return;
    try {
        const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
        if (userDoc.exists()) {
            userData = userDoc.data();
            
            document.getElementById('profileName').textContent = userData.username || 'User';
            document.getElementById('profileUsername').textContent = '@' + (userData.username || 'user');
            document.getElementById('profileAvatar').textContent = (userData.username || 'U').charAt(0).toUpperCase();
            document.getElementById('infoUsername').textContent = userData.username || '-';
            document.getElementById('infoEmail').textContent = userData.email || '-';
            
            if (userData.createdAt?.toDate) {
                document.getElementById('infoMemberSince').textContent = 
                    userData.createdAt.toDate().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            }
            
            document.getElementById('infoDepositWallet').textContent = '$' + (userData.depositWallet?.toFixed(2) || '0.00');
            document.getElementById('infoWithdrawalWallet').textContent = '$' + (userData.withdrawalWallet?.toFixed(2) || '0.00');
            document.getElementById('infoTotalEarnings').textContent = '$' + (userData.totalEarnings?.toFixed(2) || '0.00');
        }
    } catch (e) { console.error(e); }
}

onAuthStateChanged(auth, user => {
    if (user) {
        currentUser = user;
        loadUserData();
        renderChart();
    } else {
        location.href = 'login.html';
    }
});
</script>
</body>
</html>
