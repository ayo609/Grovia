<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Grovia</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1729;
            --bg-secondary: #1a2332;
            --bg-card: #1f2b3d;
            --accent-green: #00ff88;
            --accent-blue: #00d4ff;
            --accent-gold: #ffd700;
            --accent-purple: #7c3aed;
            --accent-red: #ff4757;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border-color: #2d3748;
            --font-primary: 'Space Grotesk', sans-serif;
            --font-secondary: 'Inter', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-secondary);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
            position: relative;
            overflow-x: hidden;
        }

        /* Diagonal background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(135deg, 
                    rgba(124, 58, 237, 0.05) 0%, 
                    transparent 25%,
                    rgba(0, 255, 136, 0.03) 50%,
                    transparent 75%,
                    rgba(0, 212, 255, 0.05) 100%
                );
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            transform: skewY(-2deg);
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue), var(--accent-green));
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            transform: skewY(2deg);
        }

        .back-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 45px;
            height: 45px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .back-btn:hover {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
            transform: translateX(-3px);
        }

        .header-title {
            font-family: var(--font-primary);
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Profile Card - Main Container */
        .profile-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            margin-bottom: 25px;
        }

        /* Diagonal Split Top Section */
        .profile-top {
            position: relative;
            padding: 30px 25px;
            background: linear-gradient(135deg, 
                rgba(124, 58, 237, 0.15) 0%, 
                rgba(0, 212, 255, 0.1) 50%,
                rgba(0, 255, 136, 0.05) 100%
            );
            overflow: hidden;
        }

        .profile-top::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 70%;
            height: 200%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            transform: skewX(-20deg);
            opacity: 0.1;
        }

        .profile-avatar-section {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-primary);
            font-size: 2rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-family: var(--font-primary);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .profile-username {
            font-size: 0.9rem;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .profile-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent-green);
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Diagonal Divider */
        .diagonal-divider {
            height: 30px;
            background: var(--bg-card);
            position: relative;
            overflow: hidden;
        }

        .diagonal-divider::before {
            content: '';
            position: absolute;
            top: 0;
            left: -10%;
            right: -10%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(124, 58, 237, 0.15) 0%, 
                rgba(0, 212, 255, 0.1) 50%,
                rgba(0, 255, 136, 0.05) 100%
            );
            transform: skewY(-3deg);
        }

        /* Profile Content Sections */
        .profile-content {
            padding: 25px;
        }

        .section-block {
            margin-bottom: 25px;
            position: relative;
        }

        .section-block:last-child {
            margin-bottom: 0;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .section-icon {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: 1rem;
        }

        .section-icon.account {
            background: rgba(124, 58, 237, 0.15);
            color: var(--accent-purple);
        }

        .section-icon.wallet {
            background: rgba(0, 212, 255, 0.15);
            color: var(--accent-blue);
        }

        .section-icon.referral {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
        }

        .section-title {
            font-family: var(--font-primary);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .info-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .info-card:hover {
            border-color: var(--accent-purple);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .info-value {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-mini-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: var(--transition);
        }

        .copy-mini-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 212, 255, 0.1);
        }

        /* Action Buttons */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .action-btn {
            padding: 15px;
            border-radius: 12px;
            font-family: var(--font-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            font-size: 0.9rem;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: var(--transition);
        }

        .action-btn:hover::before {
            left: 0;
        }

        .edit-btn {
            background: var(--accent-purple);
            color: white;
        }

        .password-btn {
            background: var(--accent-blue);
            color: var(--bg-primary);
        }

        .logout-btn {
            background: transparent;
            border: 2px solid var(--accent-red);
            color: var(--accent-red);
            grid-column: span 2;
        }

        .logout-btn:hover {
            background: var(--accent-red);
            color: white;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 2px solid var(--accent-purple);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            padding: 5px 15px;
            text-decoration: none;
            font-family: var(--font-secondary);
        }

        .nav-item:hover,
        .nav-item.active {
            color: var(--accent-purple);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-label {
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 16px 20px;
            margin-bottom: 10px;
            min-width: 300px;
            display: flex;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.4s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .toast.show {
            transform: translateX(0);
        }

        @media (max-width: 600px) {
            .profile-avatar {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }
            
            .profile-name {
                font-size: 1.2rem;
            }
            
            .actions-grid {
                grid-template-columns: 1fr;
            }
            
            .logout-btn {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
                <h1 class="header-title">Profile</h1>
            </div>
        </div>

        <!-- Profile Container -->
        <div class="profile-container">
            <!-- Top Section with Avatar -->
            <div class="profile-top">
                <div class="profile-avatar-section">
                    <div class="profile-avatar" id="profileAvatar">U</div>
                    <div class="profile-info">
                        <div class="profile-name" id="profileName">Username</div>
                        <div class="profile-username" id="profileUsername">@username</div>
                        <div class="profile-status">
                            <span class="status-dot"></span>
                            Active Account
                        </div>
                    </div>
                </div>
            </div>

            <!-- Diagonal Divider -->
            <div class="diagonal-divider"></div>

            <!-- Profile Content -->
            <div class="profile-content">
                <!-- Account Information -->
                <div class="section-block">
                    <div class="section-header">
                        <div class="section-icon account">A</div>
                        <div class="section-title">Account Information</div>
                    </div>
                    <div class="info-card">
                        <div class="info-item">
                            <span class="info-label">Username</span>
                            <span class="info-value" id="infoUsername">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Email</span>
                            <span class="info-value" id="infoEmail">-</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Member Since</span>
                            <span class="info-value" id="infoMemberSince">-</span>
                        </div>
                    </div>
                </div>

                <!-- Wallet Information -->
                <div class="section-block">
                    <div class="section-header">
                        <div class="section-icon wallet">W</div>
                        <div class="section-title">Wallet Information</div>
                    </div>
                    <div class="info-card">
                        <div class="info-item">
                            <span class="info-label">Deposit Wallet</span>
                            <span class="info-value" id="infoDepositWallet">$0.00</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Withdrawal Wallet</span>
                            <span class="info-value" id="infoWithdrawalWallet">$0.00</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Total Earnings</span>
                            <span class="info-value" id="infoTotalEarnings">$0.00</span>
                        </div>
                    </div>
                </div>

                <!-- Referral Information -->
                <div class="section-block">
                    <div class="section-header">
                        <div class="section-icon referral">R</div>
                        <div class="section-title">Referral Information</div>
                    </div>
                    <div class="info-card">
                        <div class="info-item">
                            <span class="info-label">Referral Code</span>
                            <span class="info-value">
                                <span id="infoReferralCode">-</span>
                                <button class="copy-mini-btn" onclick="copyReferralCode()">Copy</button>
                            </span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Total Referrals</span>
                            <span class="info-value" id="infoTotalReferrals">0</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Referral Earnings</span>
                            <span class="info-value" id="infoReferralEarnings">$0.00</span>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="actions-grid">
                    <button class="action-btn edit-btn" onclick="editProfile()">Edit Profile</button>
                    <button class="action-btn password-btn" onclick="changePassword()">Change Password</button>
                    <button class="action-btn logout-btn" onclick="showLogoutModal()">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="nav-label">Home</span>
        </a>
        <a href="history.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            <span class="nav-label">History</span>
        </a>
        <a href="referrals.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            <span class="nav-label">Referrals</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="nav-label">Profile</span>
        </a>
    </nav>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
            authDomain: "grovia-15266.firebaseapp.com",
            projectId: "grovia-15266",
            storageBucket: "grovia-15266.firebasestorage.app",
            messagingSenderId: "330674853010",
            appId: "1:330674853010:web:15a2cce632dd4528b8024b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = null;

        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div>${type === 'success' ? 'OK' : '!'}</div>
                <div>
                    <div style="font-weight: 700;">${title}</div>
                    <div style="font-size: 0.9rem;">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        window.copyReferralCode = function() {
            const code = document.getElementById('infoReferralCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                showToast('success', 'Copied!', 'Referral code copied to clipboard.');
            }).catch(() => {
                showToast('error', 'Copy Failed', 'Unable to copy code.');
            });
        };

        window.editProfile = function() {
            showToast('info', 'Coming Soon', 'Edit profile feature will be available soon.');
        };

        window.changePassword = function() {
            showToast('info', 'Coming Soon', 'Change password feature will be available soon.');
        };

        window.showLogoutModal = function() {
            if (confirm('Are you sure you want to logout?')) {
                signOut(auth).then(() => {
                    window.location.href = 'login.html';
                });
            }
        };

        async function loadUserData() {
            if (!currentUser) return;

            try {
                const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
                if (userDoc.exists()) {
                    userData = userDoc.data();
                    
                    // Update profile info
                    document.getElementById('profileName').textContent = userData.username || 'User';
                    document.getElementById('profileUsername').textContent = '@' + (userData.username || 'user');
                    document.getElementById('profileAvatar').textContent = (userData.username || 'U').charAt(0).toUpperCase();
                    
                    // Account info
                    document.getElementById('infoUsername').textContent = userData.username || '-';
                    document.getElementById('infoEmail').textContent = userData.email || '-';
                    
                    if (userData.createdAt?.toDate) {
                        document.getElementById('infoMemberSince').textContent = 
                            userData.createdAt.toDate().toLocaleDateString('en-US', { 
                                month: 'long', 
                                year: 'numeric' 
                            });
                    }
                    
                    // Wallet info
                    document.getElementById('infoDepositWallet').textContent = 
                        '$' + (userData.depositWallet?.toFixed(2) || '0.00');
                    document.getElementById('infoWithdrawalWallet').textContent = 
                        '$' + (userData.withdrawalWallet?.toFixed(2) || '0.00');
                    document.getElementById('infoTotalEarnings').textContent = 
                        '$' + (userData.totalEarnings?.toFixed(2) || '0.00');
                    
                    // Referral info
                    document.getElementById('infoReferralCode').textContent = 
                        userData.referralCode || userData.uid?.substring(0, 8)?.toUpperCase() || '-';
                    document.getElementById('infoReferralEarnings').textContent = 
                        '$' + (userData.referralEarnings?.toFixed(2) || '0.00');
                    
                    // Count referrals
                    const referralsQuery = query(
                        collection(db, 'users'),
                        where('referredBy', '==', currentUser.uid)
                    );
                    const referralsSnapshot = await getDocs(referralsQuery);
                    document.getElementById('infoTotalReferrals').textContent = referralsSnapshot.size;
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadUserData();
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
