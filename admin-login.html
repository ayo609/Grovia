<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Grovia</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-elevated: #22222e;
            --accent-red: #ff4444;
            --accent-red-dark: #cc0000;
            --accent-gold: #ffd700;
            --text-primary: #f5f5f7;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --border: rgba(255,255,255,0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 40% at 10% 10%, rgba(255,68,68,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(255,215,0,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .admin-badge {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-red-dark));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 10px 30px rgba(255,68,68,0.3);
        }

        .admin-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-gold));
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-red);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 1.1rem;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: var(--transition);
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px rgba(255,68,68,0.1);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            transition: var(--transition);
        }

        .toggle-password:hover {
            color: var(--text-primary);
        }

        .error-message {
            color: var(--accent-red);
            font-size: 0.75rem;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-red-dark));
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            box-shadow: 0 8px 25px rgba(255,68,68,0.3);
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loading .btn-text { visibility: hidden; }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .btn-loading .spinner { display: block; }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--accent-red);
        }

        .toasts {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            min-width: 280px;
            max-width: 360px;
            display: flex;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transform: translateX(110%);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .toast.show { transform: translateX(0); }
        .toast::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            border-radius: var(--radius-md) 0 0 var(--radius-md);
        }
        .toast.success::before { background: #00e676; }
        .toast.error::before { background: var(--accent-red); }
        .toast-icon { font-size: 1.2rem; flex-shrink: 0; }
        .toast-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .toast-msg { font-size: 0.78rem; color: var(--text-secondary); }

        @media (max-width: 480px) {
            .login-card { padding: 25px 20px; }
            .admin-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-badge">
            <div class="admin-icon">🔐</div>
            <h1 class="admin-title">Admin Panel</h1>
            <p class="admin-subtitle">Grovia Investment Platform</p>
        </div>

        <div class="login-card">
            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label class="form-label">Admin Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input 
                            type="email" 
                            class="input-field" 
                            id="adminEmail" 
                            placeholder="Enter admin email" 
                            autocomplete="email"
                            required
                        >
                    </div>
                    <div class="error-message" id="emailError">Please enter a valid email</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔑</span>
                        <input 
                            type="password" 
                            class="input-field" 
                            id="adminPassword" 
                            placeholder="Enter password" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword()">👁</button>
                    </div>
                    <div class="error-message" id="passwordError">Password is required</div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Login to Admin</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <a href="index.html" class="back-link">← Back to User Login</a>
    </div>

    <div class="toasts" id="toasts"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
            authDomain: "grovia-15266.firebaseapp.com",
            projectId: "grovia-15266",
            storageBucket: "grovia-15266.firebasestorage.app",
            messagingSenderId: "330674853010",
            appId: "1:330674853010:web:15a2cce632dd4528b8024b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function toast(type, title, msg) {
            const box = document.getElementById('toasts');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<div class="toast-icon">${type === 'success' ? '✓' : '✗'}</div><div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
            box.appendChild(el);
            requestAnimationFrame(() => el.classList.add('show'));
            setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4000);
        }

        window.togglePassword = function() {
            const input = document.getElementById('adminPassword');
            input.type = input.type === 'password' ? 'text' : 'password';
        };

        window.handleAdminLogin = async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            
            document.getElementById('emailError').classList.remove('show');
            document.getElementById('passwordError').classList.remove('show');
            
            if (!email) {
                document.getElementById('emailError').classList.add('show');
                return;
            }
            if (!password) {
                document.getElementById('passwordError').classList.add('show');
                return;
            }
            
            loginBtn.classList.add('btn-loading');
            loginBtn.disabled = true;
            
            try {
                // Sign in with Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Check if user is admin in Firestore
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                
                if (userDoc.exists() && userDoc.data().isAdmin === true) {
                    toast('success', 'Login Successful', 'Welcome back, Admin!');
                    
                    sessionStorage.setItem('grovia_admin', 'true');
                    sessionStorage.setItem('grovia_admin_email', email);
                    
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1500);
                } else {
                    // Not an admin - logout
                    await signOut(auth);
                    toast('error', 'Access Denied', 'This account does not have admin privileges.');
                    loginBtn.classList.remove('btn-loading');
                    loginBtn.disabled = false;
                }
                
            } catch (error) {
                console.error('Login error:', error);
                loginBtn.classList.remove('btn-loading');
                loginBtn.disabled = false;
                
                const errorMessages = {
                    'auth/user-not-found': 'No account found with this email.',
                    'auth/wrong-password': 'Incorrect password. Please try again.',
                    'auth/invalid-email': 'Please enter a valid email address.',
                    'auth/network-request-failed': 'Network error. Check your connection.'
                };
                
                toast('error', 'Login Failed', errorMessages[error.code] || 'An error occurred. Please try again.');
            }
        };

        // Check if already logged in as admin
        onAuthStateChanged(auth, (user) => {
            if (user && sessionStorage.getItem('grovia_admin') === 'true') {
                window.location.href = 'admin-dashboard.html';
            }
        });
    </script>
</body>
</html>
