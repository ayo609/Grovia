<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Requests - Grovia Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-elevated: #22222e;
            --accent-red: #ff4444;
            --accent-red-dark: #cc0000;
            --accent-gold: #ffd700;
            --accent-green: #00e676;
            --accent-blue: #29b6f6;
            --text-primary: #f5f5f7;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --border: rgba(255,255,255,0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 40% at 10% 10%, rgba(255,215,0,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(255,68,68,0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: sticky; top: 0; z-index: 200;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 36px; height: 36px; border-radius: 9px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-red-dark));
            display: grid; place-items: center;
            font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: white;
        }
        .logo-name {
            font-family: var(--font-display); font-size: 1rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .admin-email { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); }
        .logout-btn {
            padding: 6px 16px; border-radius: 40px; border: 1px solid rgba(255,68,68,0.4);
            background: transparent; color: var(--accent-red); font-family: var(--font-body);
            font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .logout-btn:hover { background: rgba(255,68,68,0.1); }

        .main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px 0; }

        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px; text-align: center;
        }
        .stat-label {
            font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 4px;
        }
        .stat-value { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; }
        .stat-value.pending { color: var(--accent-gold); }
        .stat-value.approved { color: var(--accent-green); }
        .stat-value.rejected { color: var(--accent-red); }

        .filter-tabs {
            display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-tab {
            padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 25px; color: var(--text-secondary); cursor: pointer;
            white-space: nowrap; transition: var(--transition);
            font-family: var(--font-body); font-size: 0.78rem; font-weight: 600;
        }
        .filter-tab:hover { border-color: var(--accent-gold); }
        .filter-tab.active {
            background: linear-gradient(135deg, var(--accent-gold), #ff9800);
            color: #0a0a0f; border-color: transparent;
        }

        .withdrawals-list { display: flex; flex-direction: column; gap: 12px; }
        .withdrawal-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 16px; transition: var(--transition);
        }
        .withdrawal-card:hover { border-color: var(--accent-gold); }
        .withdrawal-card.pending { border-left: 3px solid var(--accent-gold); }
        .withdrawal-card.approved { border-left: 3px solid var(--accent-green); }
        .withdrawal-card.rejected { border-left: 3px solid var(--accent-red); }

        .withdrawal-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
        }
        .withdrawal-user { display: flex; align-items: center; gap: 10px; }
        .withdrawal-avatar {
            width: 35px; height: 35px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), #ff9800);
            display: grid; place-items: center; font-weight: 700; font-size: 0.85rem;
            color: #0a0a0f; flex-shrink: 0;
        }
        .withdrawal-info { flex: 1; }
        .withdrawal-name { font-weight: 600; font-size: 0.85rem; }
        .withdrawal-email { font-size: 0.7rem; color: var(--text-muted); }
        .withdrawal-amount {
            font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
            color: var(--accent-gold);
        }
        .withdrawal-status {
            padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 600;
        }
        .withdrawal-status.pending { background: rgba(255,193,7,0.15); color: var(--accent-gold); }
        .withdrawal-status.approved { background: rgba(0,230,118,0.15); color: var(--accent-green); }
        .withdrawal-status.rejected { background: rgba(255,68,68,0.15); color: var(--accent-red); }

        .method-badge {
            display: inline-block; font-size: 0.62rem; font-weight: 700;
            padding: 2px 8px; border-radius: 12px;
            margin-bottom: 6px;
        }
        .method-badge.usdt { background: rgba(41,182,246,0.15); color: var(--accent-blue); }
        .method-badge.bank { background: rgba(0,230,118,0.15); color: var(--accent-green); }

        .withdrawal-address {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 10px 12px;
            font-family: 'Courier New', monospace; font-size: 0.75rem;
            color: var(--accent-blue); word-break: break-all; margin: 8px 0;
        }

        .detail-box {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 10px 12px;
            margin: 8px 0;
        }
        .detail-line {
            display: flex; justify-content: space-between; padding: 4px 0;
            font-size: 0.75rem; gap: 8px;
        }
        .detail-line:not(:last-child) { border-bottom: 1px solid var(--border); }
        .detail-line .lbl { color: var(--text-muted); }
        .detail-line .val { font-weight: 600; color: var(--text-primary); text-align: right; word-break: break-all; }

        .withdrawal-time { font-size: 0.7rem; color: var(--text-muted); }
        .withdrawal-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .action-btn {
            padding: 7px 14px; border-radius: 6px; font-size: 0.7rem; font-weight: 600;
            cursor: pointer; border: none; transition: var(--transition); font-family: var(--font-body);
        }
        .view-btn { background: rgba(41,182,246,0.15); color: var(--accent-blue); border: 1px solid rgba(41,182,246,0.3); }
        .view-btn:hover { background: var(--accent-blue); color: white; }
        .approve-btn { background: rgba(0,230,118,0.15); color: var(--accent-green); border: 1px solid rgba(0,230,118,0.3); }
        .approve-btn:hover { background: var(--accent-green); color: #0a0a0f; }
        .reject-btn { background: rgba(255,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(255,68,68,0.3); }
        .reject-btn:hover { background: var(--accent-red); color: white; }

        /* ══════ Info blocks (matching deposit page style) ══════ */
        .info-block {
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            font-size: 0.72rem;
            line-height: 1.45;
        }
        .info-block.localtime {
            background: rgba(41,182,246,0.05);
            border-color: rgba(41,182,246,0.22);
        }
        .info-block.fees {
            background: rgba(255,82,82,0.05);
            border-color: rgba(255,82,82,0.25);
        }
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 2px 0;
        }
        .info-row + .info-row { margin-top: 3px; }
        .info-icon { flex-shrink: 0; font-size: 0.8rem; line-height: 1.4; }
        .info-label {
            color: var(--text-muted);
            font-size: 0.63rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 700;
            flex-shrink: 0;
            min-width: 90px;
        }
        .info-value {
            color: var(--text-primary);
            font-weight: 600;
            word-break: break-word;
        }
        .info-value.localtime-value { color: var(--accent-blue); font-family: var(--font-display); }
        .info-value.zone-value { color: var(--text-secondary); font-size: 0.7rem; }
        .info-value.gross { color: var(--accent-gold); }
        .info-value.fee { color: var(--accent-red); }
        .info-value.net { color: var(--accent-green); font-family: var(--font-display); font-size: 0.78rem; }

        .empty-state {
            text-align: center; padding: 40px; background: var(--bg-card);
            border-radius: var(--radius-md); border: 1px solid var(--border);
            color: var(--text-muted); font-size: 0.85rem;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
            background: rgba(10,10,15,0.95); backdrop-filter: blur(16px);
            border-top: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-around; z-index: 200;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px; background: none;
            border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition);
            padding: 4px 15px; text-decoration: none; font-family: var(--font-body);
        }
        .nav-item:hover, .nav-item.active { color: var(--accent-red); }
        .nav-item svg { width: 22px; height: 22px; }
        .nav-label { font-size: 0.65rem; font-weight: 600; }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
            z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .overlay.show { display: flex; }
        .modal {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 25px; width: 100%; max-width: 470px; position: relative;
            animation: fadeUp 0.25s ease; max-height: 90vh; overflow-y: auto;
        }
        @keyframes fadeUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-close {
            position: absolute; top: 14px; right: 14px; background: none; border: none;
            color: var(--text-muted); font-size: 1.3rem; cursor: pointer;
        }
        .modal-title {
            font-family: var(--font-display); font-size: 1.1rem; font-weight: 700;
            margin-bottom: 15px; color: var(--accent-gold);
        }
        .detail-row {
            display: flex; justify-content: space-between; padding: 8px 0;
            border-bottom: 1px solid var(--border); font-size: 0.82rem;
            flex-wrap: wrap; gap: 5px;
        }
        .detail-label { color: var(--text-muted); flex-shrink: 0; }
        .detail-value { font-weight: 600; word-break: break-all; text-align: right; max-width: 65%; }
        .detail-value.localtime-modal { color: var(--accent-blue); font-family: var(--font-display); font-size: 0.78rem; }
        .detail-value.zone-modal { color: var(--text-secondary); font-size: 0.72rem; }
        .detail-value.fee-modal { color: var(--accent-red); }
        .detail-value.net-modal { color: var(--accent-green); font-family: var(--font-display); }

        .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-modal {
            padding: 11px; border-radius: var(--radius-sm); font-family: var(--font-body);
            font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: var(--transition);
        }
        .btn-modal.cancel { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-modal.approve { background: var(--accent-green); color: #0a0a0f; }
        .btn-modal.approve:hover { opacity: 0.85; }
        .btn-modal.reject { background: rgba(255,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(255,68,68,0.3); }
        .btn-modal.reject:hover { background: var(--accent-red); color: white; }

        .toasts { position: fixed; bottom: 76px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 13px 16px; min-width: 280px; max-width: 360px; display: flex; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); transform: translateX(110%);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative;
        }
        .toast.show { transform: translateX(0); }
        .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
        .toast.success::before { background: var(--accent-green); }
        .toast.error::before { background: var(--accent-red); }
        .toast-icon { font-size: 1rem; flex-shrink: 0; }
        .toast-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .toast-msg { font-size: 0.78rem; color: var(--text-secondary); }

        @media (max-width: 600px) {
            .main { padding: 16px 12px 0; }
            .logo-name { display: none; }
            .admin-email { display: none; }
            .stats-row { grid-template-columns: 1fr; }
            .info-label { min-width: 70px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-mark">A</div>

    </div>

<!-- Withdrawal Detail Modal -->
<div class="overlay" id="detailOverlay">
    <div class="modal">
        <button class="modal-close" onclick="closeDetail()">×</button>
        <div class="modal-title">Withdrawal Details</div>
        <div id="detailContent"></div>
        <div class="modal-btns" id="detailActions">
            <button class="btn-modal reject" onclick="rejectFromModal()">Reject</button>

<!-- Logout Modal -->

    <div class="modal">
        <div class="modal-title" style="color: var(--accent-red);">Confirm Logout</div>
        <p style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 15px;">Are you sure you want to logout?</p>
        <div class="modal-btns">
            <button class="btn-modal cancel" onclick="closeLogout()">Cancel</button>
            <button class="btn-modal reject" onclick="doLogout()">Logout</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
    authDomain: "grovia-15266.firebaseapp.com",
    projectId: "grovia-15266",
    storageBucket: "grovia-15266.firebasestorage.app",
    messagingSenderId: "330674853010",
    appId: "1:330674853010:web:15a2cce632dd4528b8024b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allWithdrawals = [];
let currentFilter = 'pending';
let currentWithdrawal = null;

function toast(type, title, msg) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<div class="toast-icon">${type === 'success' ? '✓' : '✗'}</div><div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4500);
}

window.showLogout = () => document.getElementById('logoutOverlay').classList.add('show');
window.closeLogout = () => document.getElementById('logoutOverlay').classList.remove('show');
window.doLogout = async () => {
    sessionStorage.removeItem('grovia_admin');
    await signOut(auth);
    location.href = 'admin-login.html';
};

window.filterWithdrawals = function(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderWithdrawals();
};

function formatDate(dateValue) {
    if (!dateValue) return '—';
    let date;
    if (typeof dateValue.toDate === 'function') date = dateValue.toDate();
    else if (dateValue instanceof Date) date = dateValue;
    else return '—';
    return date.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

/* Escape HTML so user input can't break layout */
function esc(str) {
    if (str === undefined || str === null) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

/* Detect withdrawal method */
function getWithdrawalMethod(w) {
    if (w.bank || w.accountNumber || w.accountName ||
        (w.method && w.method.toLowerCase().includes('bank')) ||
        (w.method && w.method.toLowerCase().includes('naira'))) {
        return 'bank';
    }
    return 'usdt';
}

/* Compute fee + net (uses stored values if present, else derives them) */
function getFeeData(w) {
    const amount = Number(w.amount) || 0;
    let fee = Number(w.fee);
    let net = Number(w.netAmount);

    if (!isFinite(fee) && isFinite(net)) fee = amount - net;
    if (!isFinite(net) && isFinite(fee)) net = amount - fee;
    if (!isFinite(fee) && !isFinite(net)) {
        fee = amount * 0.05;       // 5% fallback
        net = amount - fee;
    }
    return { amount, fee, net };
}

/* Build the local time info block HTML */
function buildLocalTimeBlock(w) {
    if (!w.userLocalTime && !w.userTimeZone) return '';
    return `
        <div class="info-block localtime">
            <div class="info-row">
                <span class="info-icon">🕒</span>
                <span class="info-label">User Local Time</span>
                <span class="info-value localtime-value">${esc(w.userLocalTime || '—')}</span>
            </div>
            <div class="info-row">
                <span class="info-icon">🌍</span>
                <span class="info-label">Timezone</span>
                <span class="info-value zone-value">
                    ${esc(w.userTimeZone || 'Unknown')}
                    ${w.userTimeZoneOffset ? ' · ' + esc(w.userTimeZoneOffset) : ''}
                    ${w.userLocale ? ' · ' + esc(w.userLocale) : ''}
                </span>
            </div>
        </div>
    `;
}

/* Build the fee breakdown block HTML */
function buildFeeBlock(w) {
    const { amount, fee, net } = getFeeData(w);
    const isBank = getWithdrawalMethod(w) === 'bank';

    let extraBankRow = '';
    if (isBank && w.nairaAmount) {
        const nairaAmount = Number(w.nairaAmount) || 0;
        const nairaFee = Number(w.feeInNaira) || (nairaAmount * 0.05);
        const nairaNet = Number(w.netInNaira) || (nairaAmount - nairaFee);
        extraBankRow = `
            <div class="info-row" style="margin-top:6px; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.08);">
                <span class="info-icon">🇳🇬</span>
                <span class="info-label">Naira Breakdown</span>
                <span class="info-value zone-value">
                    ₦${nairaAmount.toLocaleString()} gross · 
                    ₦${nairaFee.toLocaleString()} fee · 
                    <strong style="color:var(--accent-green)">₦${nairaNet.toLocaleString()} net</strong>
                </span>
            </div>
        `;
    }

    return `
        <div class="info-block fees">
            <div class="info-row">
                <span class="info-icon">💰</span>
                <span class="info-label">Gross Amount</span>
                <span class="info-value gross">$${amount.toFixed(2)}</span>
            </div>
            <div class="info-row">
                <span class="info-icon">✂️</span>
                <span class="info-label">Fee (5%)</span>
                <span class="info-value fee">-$${fee.toFixed(2)}</span>
            </div>
            <div class="info-row">
                <span class="info-icon">✅</span>
                <span class="info-label">User Receives</span>
                <span class="info-value net">$${net.toFixed(2)}</span>
            </div>
            ${extraBankRow}
        </div>
    `;
}

function renderWithdrawals() {
    const list = document.getElementById('withdrawalsList');
    const filtered = allWithdrawals.filter(w => currentFilter === 'all' || w.status === currentFilter);

    const pending = allWithdrawals.filter(w => w.status === 'pending').length;
    const approved = allWithdrawals.filter(w => w.status === 'approved').length;
    const rejected = allWithdrawals.filter(w => w.status === 'rejected').length;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statApproved').textContent = approved;
    document.getElementById('statRejected').textContent = rejected;

    if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">No ${currentFilter} withdrawals found</div>`;
        return;
    }

    list.innerHTML = '';
    filtered.forEach(w => {
        const method = getWithdrawalMethod(w);
        const card = document.createElement('div');
        card.className = `withdrawal-card ${w.status}`;

        let methodHtml = '';
        if (method === 'bank') {
            methodHtml = `
                <span class="method-badge bank">🏦 Bank Transfer</span>
                <div class="detail-box">
                    <div class="detail-line"><span class="lbl">Bank</span><span class="val">${esc(w.bank || '—')}</span></div>
                    <div class="detail-line"><span class="lbl">Account Number</span><span class="val">${esc(w.accountNumber || '—')}</span></div>
                    <div class="detail-line"><span class="lbl">Account Name</span><span class="val">${esc(w.accountName || '—')}</span></div>
                </div>
            `;
        } else {
            methodHtml = `
                <span class="method-badge usdt">💎 USDT (BEP20)</span>
                <div class="withdrawal-address">${esc(w.walletAddress || 'No address provided')}</div>
            `;
        }

        card.innerHTML = `
            <div class="withdrawal-header">
                <div class="withdrawal-user">
                    <div class="withdrawal-avatar">${esc((w.username || 'U').charAt(0).toUpperCase())}</div>
                    <div class="withdrawal-info">
                        <div class="withdrawal-name">${esc(w.username || 'Unknown')}</div>
                        <div class="withdrawal-email">${esc(w.email || '')}</div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div class="withdrawal-amount">$${(Number(w.amount) || 0).toFixed(2)}</div>
                    <span class="withdrawal-status ${esc(w.status)}">${esc(w.status)}</span>
                </div>
            </div>
            ${methodHtml}
            <div class="withdrawal-time" style="margin-top: 8px;">Requested (your time): ${formatDate(w.createdAt)}</div>
            ${buildLocalTimeBlock(w)}
            ${buildFeeBlock(w)}
            <div class="withdrawal-actions">
                <button class="action-btn view-btn" onclick="viewWithdrawal('${w.id}')">View Details</button>
                ${w.status === 'pending' ? `
                    <button class="action-btn approve-btn" onclick="approveWithdrawal('${w.id}')">Approve</button>
                    <button class="action-btn reject-btn" onclick="rejectWithdrawal('${w.id}')">Reject</button>
                ` : ''}
            </div>
        `;
        list.appendChild(card);
    });
}

/* Build detail HTML for the modal */
function buildDetailHtml(w) {
    const method = getWithdrawalMethod(w);
    const { amount, fee, net } = getFeeData(w);

    let html = `
        <div class="detail-row"><span class="detail-label">Username</span><span class="detail-value">${esc(w.username || '—')}</span></div>
        <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${esc(w.email || '—')}</span></div>
    `;

    // User local time rows
    if (w.userLocalTime || w.userTimeZone) {
        html += `
            <div class="detail-row">
                <span class="detail-label">User Local Time</span>
                <span class="detail-value localtime-modal">${esc(w.userLocalTime || '—')}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Timezone</span>
                <span class="detail-value zone-modal">
                    ${esc(w.userTimeZone || 'Unknown')}
                    ${w.userTimeZoneOffset ? ' · ' + esc(w.userTimeZoneOffset) : ''}
                    ${w.userLocale ? ' · ' + esc(w.userLocale) : ''}
                </span>
            </div>
        `;
    }

    // Fee breakdown rows
    html += `
        <div class="detail-row"><span class="detail-label">Gross Amount</span><span class="detail-value">$${amount.toFixed(2)}</span></div>
        <div class="detail-row"><span class="detail-label">Fee (5%)</span><span class="detail-value fee-modal">-$${fee.toFixed(2)}</span></div>
        <div class="detail-row"><span class="detail-label">User Receives</span><span class="detail-value net-modal">$${net.toFixed(2)}</span></div>
    `;

    // Method-specific rows
    if (method === 'bank') {
        html += `
            <div class="detail-row"><span class="detail-label">Method</span><span class="detail-value" style="color:var(--accent-green)">🏦 Bank Transfer</span></div>
            <div class="detail-row"><span class="detail-label">Bank</span><span class="detail-value">${esc(w.bank || '—')}</span></div>
            <div class="detail-row"><span class="detail-label">Account Number</span><span class="detail-value">${esc(w.accountNumber || '—')}</span></div>
            <div class="detail-row"><span class="detail-label">Account Name</span><span class="detail-value">${esc(w.accountName || '—')}</span></div>
        `;
        if (w.nairaAmount) {
            const nairaAmount = Number(w.nairaAmount) || 0;
            const nairaFee = Number(w.feeInNaira) || (nairaAmount * 0.05);
            const nairaNet = Number(w.netInNaira) || (nairaAmount - nairaFee);
            html += `
                <div class="detail-row"><span class="detail-label">Naira Gross</span><span class="detail-value" style="color:var(--accent-gold)">₦${nairaAmount.toLocaleString()}</span></div>
                <div class="detail-row"><span class="detail-label">Naira Fee</span><span class="detail-value fee-modal">-₦${nairaFee.toLocaleString()}</span></div>
                <div class="detail-row"><span class="detail-label">Naira Net</span><span class="detail-value net-modal">₦${nairaNet.toLocaleString()}</span></div>
            `;
        }
    } else {
        html += `
            <div class="detail-row"><span class="detail-label">Method</span><span class="detail-value" style="color:var(--accent-blue)">💎 USDT (BEP20)</span></div>
            <div class="detail-row"><span class="detail-label">Network</span><span class="detail-value">BEP20 (BSC)</span></div>
            <div class="detail-row"><span class="detail-label">Wallet Address</span><span class="detail-value">${esc(w.walletAddress || '—')}</span></div>
        `;
    }

    // Status + timestamps
    html += `
        <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value">${esc(w.status)}</span></div>
        <div class="detail-row"><span class="detail-label">Requested</span><span class="detail-value">${formatDate(w.createdAt)}</span></div>
    `;

    if (w.processedAt) {
        html += `<div class="detail-row"><span class="detail-label">Processed</span><span class="detail-value">${formatDate(w.processedAt)}</span></div>`;
    }

    return html;
}

window.viewWithdrawal = function(id) {
    currentWithdrawal = allWithdrawals.find(w => w.id === id);
    if (!currentWithdrawal) return;
    document.getElementById('detailContent').innerHTML = buildDetailHtml(currentWithdrawal);
    document.getElementById('detailActions').style.display = currentWithdrawal.status === 'pending' ? 'grid' : 'none';
    document.getElementById('detailOverlay').classList.add('show');
};

window.closeDetail = () => {
    document.getElementById('detailOverlay').classList.remove('show');
    currentWithdrawal = null;
};

window.approveFromModal = async () => {
    if (currentWithdrawal) await approveWithdrawal(currentWithdrawal.id, true);
};

window.rejectFromModal = async () => {
    if (currentWithdrawal) await rejectWithdrawal(currentWithdrawal.id, true);
};

window.approveWithdrawal = async function(id, fromModal = false) {
    const w = allWithdrawals.find(x => x.id === id);
    if (!w) return;

    if (!fromModal) {
        const method = getWithdrawalMethod(w) === 'bank' ? 'Bank Transfer' : 'USDT (BEP20)';
        if (!confirm(`Approve $${Number(w.amount).toFixed(2)} withdrawal via ${method} to ${w.username}?`)) return;
    }

    try {
        await updateDoc(doc(db, 'withdrawals', id), {
            status: 'approved',
            processedAt: serverTimestamp(),
            adminNote: 'Approved'
        });

        await addDoc(collection(db, 'transactions'), {
            uid: w.uid,
            type: 'withdrawal',
            amount: Number(w.amount) || 0,
            fee: Number(w.fee) || (Number(w.amount) * 0.05),
            netAmount: Number(w.netAmount) || (Number(w.amount) * 0.95),
            status: 'completed',
            createdAt: serverTimestamp()
        });

        closeDetail();
        toast('success', 'Withdrawal Approved', `$${Number(w.amount).toFixed(2)} approved for ${w.username}.`);
        await loadWithdrawals();
    } catch (e) {
        console.error('Approve error:', e);
        toast('error', 'Failed', 'Error approving withdrawal: ' + (e.code || e.message));
    }
};

window.rejectWithdrawal = async function(id, fromModal = false) {
    const w = allWithdrawals.find(x => x.id === id);
    if (!w) return;

    if (!fromModal) {
        if (!confirm(`Reject withdrawal from ${w.username}? $${Number(w.amount).toFixed(2)} will be refunded.`)) return;
    }

    try {
        // 1. Update the withdrawal doc
        await updateDoc(doc(db, 'withdrawals', id), {
            status: 'rejected',
            processedAt: serverTimestamp(),
            adminNote: 'Rejected'
        });

        // 2. Refund user's withdrawal wallet
        try {
            await updateDoc(doc(db, 'users', w.uid), {
                withdrawalWallet: increment(Number(w.amount) || 0)
            });
        } catch (refundErr) {
            console.error('Refund error:', refundErr);
            toast('error', 'Refund Failed', 'Withdrawal rejected but refund failed. Check console.');
        }

        closeDetail();
        toast('success', 'Withdrawal Rejected', `$${Number(w.amount).toFixed(2)} refunded to ${w.username}.`);
        await loadWithdrawals();
    } catch (e) {
        console.error('Reject error:', e);
        toast('error', 'Failed', 'Error rejecting withdrawal: ' + (e.code || e.message));
    }
};

async function loadWithdrawals() {
    try {
        const snapshot = await getDocs(collection(db, 'withdrawals'));
        allWithdrawals = [];
        snapshot.forEach(d => {
            allWithdrawals.push({ id: d.id, ...d.data() });
        });

        allWithdrawals.sort((a, b) => {
            const dA = a.createdAt?.toDate?.() || new Date(0);
            const dB = b.createdAt?.toDate?.() || new Date(0);
            return dB - dA;
        });

        renderWithdrawals();
    } catch (e) {
        console.error('Load error:', e);
        document.getElementById('withdrawalsList').innerHTML = '<div class="empty-state">Error loading withdrawals</div>';
    }
}

onAuthStateChanged(auth, (user) => {
    if (user && sessionStorage.getItem('grovia_admin') === 'true') {
        document.getElementById('adminEmail').textContent = user.email;
        loadWithdrawals();
    } else {
        location.href = 'admin-login.html';
    }
});
</script>

</html>
