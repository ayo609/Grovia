<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Requests - Grovia Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-elevated: #22222e;
            --accent-red: #ff4444;
            --accent-red-dark: #cc0000;
            --accent-gold: #ffd700;
            --accent-green: #00e676;
            --accent-blue: #29b6f6;
            --text-primary: #f5f5f7;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --border: rgba(255,255,255,0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 40% at 10% 10%, rgba(0,230,118,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(41,182,246,0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: sticky; top: 0; z-index: 200;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 36px; height: 36px; border-radius: 9px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-red-dark));
            display: grid; place-items: center;
            font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: white;
        }
        .logo-name {
            font-family: var(--font-display); font-size: 1rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .admin-email { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); }
        .logout-btn {
            padding: 6px 16px; border-radius: 40px; border: 1px solid rgba(255,68,68,0.4);
            background: transparent; color: var(--accent-red); font-family: var(--font-body);
            font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .logout-btn:hover { background: rgba(255,68,68,0.1); }

        .main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px 0; }

        /* Method Tabs */
        .method-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .method-tab {
            flex: 1; padding: 10px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer;
            text-align: center; transition: var(--transition);
            font-family: var(--font-body); font-size: 0.8rem; font-weight: 600;
        }
        .method-tab.active {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            color: #0a0a0f; border-color: transparent;
        }

        /* Status Tabs Row */
        .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }

        .filter-tabs {
            display: flex; gap: 8px; flex: 1; overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .filter-tab {
            padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 25px; color: var(--text-secondary); cursor: pointer;
            white-space: nowrap; transition: var(--transition);
            font-family: var(--font-body); font-size: 0.78rem; font-weight: 600;
        }
        .filter-tab:hover { border-color: var(--accent-green); }
        .filter-tab.active {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            color: #0a0a0f; border-color: transparent;
        }

        /* Small Discrete Date Filter */
        .date-filter { position: relative; flex-shrink: 0; }
        .date-filter-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-muted); cursor: pointer;
            display: grid; place-items: center;
            transition: var(--transition); font-size: 0.9rem;
        }
        .date-filter-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }
        .date-filter-btn.active {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            color: #0a0a0f; border-color: transparent;
        }
        .date-filter-menu {
            position: absolute; top: 42px; right: 0;
            background: var(--bg-elevated); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 6px;
            min-width: 150px; display: none; z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .date-filter-menu.show { display: block; }
        .date-filter-item {
            padding: 8px 12px; font-size: 0.78rem; font-weight: 600;
            color: var(--text-secondary); cursor: pointer;
            border-radius: 4px; transition: var(--transition); white-space: nowrap;
        }
        .date-filter-item:hover { background: rgba(0,230,118,0.1); color: var(--text-primary); }
        .date-filter-item.active { color: var(--accent-green); }

        /* Deposit Cards */
        .deposits-list { display: flex; flex-direction: column; gap: 12px; }
        .deposit-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 16px; transition: var(--transition);
        }
        .deposit-card:hover { border-color: var(--accent-green); }
        .deposit-card.pending { border-left: 3px solid var(--accent-gold); }
        .deposit-card.approved { border-left: 3px solid var(--accent-green); }
        .deposit-card.rejected { border-left: 3px solid var(--accent-red); }

        .deposit-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
        }
        .deposit-user { display: flex; align-items: center; gap: 10px; }
        .deposit-avatar {
            width: 35px; height: 35px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            display: grid; place-items: center; font-weight: 700; font-size: 0.85rem;
            color: #0a0a0f; flex-shrink: 0;
        }
        .deposit-info { flex: 1; }
        .deposit-name { font-weight: 600; font-size: 0.85rem; }
        .deposit-fullname { font-size: 0.7rem; color: var(--text-muted); }
        .deposit-email { font-size: 0.7rem; color: var(--text-muted); }
        .deposit-method {
            display: inline-block; padding: 2px 8px; border-radius: 12px;
            font-size: 0.6rem; font-weight: 700; margin-top: 3px;
        }
        .deposit-method.usdt { background: rgba(41,182,246,0.15); color: var(--accent-blue); }
        .deposit-method.naira { background: rgba(0,230,118,0.15); color: var(--accent-green); }
        .deposit-amount {
            font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
            color: var(--accent-green);
        }
        .deposit-status { padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 600; }
        .deposit-status.pending { background: rgba(255,193,7,0.15); color: var(--accent-gold); }
        .deposit-status.approved { background: rgba(0,230,118,0.15); color: var(--accent-green); }
        .deposit-status.rejected { background: rgba(255,68,68,0.15); color: var(--accent-red); }

        .deposit-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .action-btn {
            padding: 7px 14px; border-radius: 6px; font-size: 0.7rem; font-weight: 600;
            cursor: pointer; border: none; transition: var(--transition); font-family: var(--font-body);
        }
        .view-receipt-btn { background: rgba(41,182,246,0.15); color: var(--accent-blue); border: 1px solid rgba(41,182,246,0.3); }
        .view-receipt-btn:hover { background: var(--accent-blue); color: white; }
        .approve-btn { background: rgba(0,230,118,0.15); color: var(--accent-green); border: 1px solid rgba(0,230,118,0.3); }
        .approve-btn:hover { background: var(--accent-green); color: #0a0a0f; }
        .reject-btn { background: rgba(255,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(255,68,68,0.3); }
        .reject-btn:hover { background: var(--accent-red); color: white; }

        .deposit-time { font-size: 0.7rem; color: var(--text-muted); }

        /* ══════ TIME / TXID INFO BLOCKS ══════ */
        .info-block {
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            font-size: 0.72rem;
            line-height: 1.45;
        }

        /* User local time block */
        .info-block.localtime {
            background: rgba(41,182,246,0.05);
            border-color: rgba(41,182,246,0.22);
        }
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 2px 0;
        }
        .info-row + .info-row { margin-top: 3px; }
        .info-icon { flex-shrink: 0; font-size: 0.8rem; line-height: 1.4; }
        .info-label {
            color: var(--text-muted);
            font-size: 0.63rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 700;
            flex-shrink: 0;
            min-width: 90px;
        }
        .info-value {
            color: var(--text-primary);
            font-weight: 600;
            word-break: break-word;
        }
        .info-value.localtime-value { color: var(--accent-blue); font-family: var(--font-display); }
        .info-value.zone-value { color: var(--text-secondary); font-size: 0.7rem; }

        /* TXID block */
        .info-block.txid {
            background: rgba(255,82,82,0.05);
            border-color: rgba(255,82,82,0.28);
        }
        .info-block.txid .info-label { color: var(--accent-red); }
        .info-block.txid.missing {
            background: rgba(255,68,68,0.1);
            border-color: rgba(255,68,68,0.45);
        }
        .txid-value {
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: var(--accent-blue);
            background: rgba(41,182,246,0.08);
            border: 1px solid rgba(41,182,246,0.25);
            border-radius: 4px;
            padding: 6px 8px;
            word-break: break-all;
            line-height: 1.5;
            user-select: all;
            cursor: pointer;
            margin-top: 3px;
        }
        .txid-value:hover { background: rgba(41,182,246,0.14); }
        .txid-copy-btn {
            margin-top: 6px;
            padding: 4px 10px;
            font-size: 0.65rem;
            font-weight: 700;
            background: rgba(41,182,246,0.12);
            color: var(--accent-blue);
            border: 1px solid rgba(41,182,246,0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-body);
        }
        .txid-copy-btn:hover { background: var(--accent-blue); color: #0a0a0f; }
        .txid-copy-btn.copied {
            background: rgba(0,230,118,0.15);
            color: var(--accent-green);
            border-color: rgba(0,230,118,0.35);
        }

        .empty-state {
            text-align: center; padding: 40px; background: var(--bg-card);
            border-radius: var(--radius-md); border: 1px solid var(--border);
            color: var(--text-muted); font-size: 0.85rem;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
            background: rgba(10,10,15,0.95); backdrop-filter: blur(16px);
            border-top: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-around; z-index: 200;
            overflow-x: auto; scrollbar-width: none;
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px; background: none;
            border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition);
            padding: 4px 10px; text-decoration: none; font-family: var(--font-body);
            flex-shrink: 0; min-width: 50px;
        }
        .nav-item:hover, .nav-item.active { color: var(--accent-red); }
        .nav-item svg { width: 20px; height: 20px; }
        .nav-label { font-size: 0.55rem; font-weight: 600; }

        /* Modals */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
            z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .overlay.show { display: flex; }
        .modal {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 25px; width: 100%; max-width: 450px; position: relative;
            animation: fadeUp 0.25s ease; max-height: 90vh; overflow-y: auto;
        }
        @keyframes fadeUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; }
        .modal-title { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; color: var(--accent-green); }
        .receipt-image { width: 100%; border-radius: var(--radius-md); margin-bottom: 15px; border: 1px solid var(--border); object-fit: contain; max-height: 300px; background: var(--bg-secondary); }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; gap: 10px; }
        .detail-label { color: var(--text-muted); flex-shrink: 0; }
        .detail-value { font-weight: 600; word-break: break-all; text-align: right; max-width: 65%; }
        .detail-value.txid-modal {
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            color: var(--accent-blue);
            background: rgba(41,182,246,0.08);
            border: 1px solid rgba(41,182,246,0.22);
            border-radius: 4px;
            padding: 4px 8px;
            max-width: 70%;
            text-align: left;
        }
        .detail-value.localtime-modal { color: var(--accent-blue); font-family: var(--font-display); font-size: 0.78rem; }
        .detail-value.zone-modal { color: var(--text-secondary); font-size: 0.72rem; }

        .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-modal { padding: 11px; border-radius: var(--radius-sm); font-family: var(--font-body); font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; transition: var(--transition); }
        .btn-modal.cancel { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-modal.approve { background: var(--accent-green); color: #0a0a0f; }
        .btn-modal.reject { background: rgba(255,68,68,0.15); color: var(--accent-red); border: 1px solid rgba(255,68,68,0.3); }

        .toasts { position: fixed; bottom: 76px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 13px 16px; min-width: 280px; max-width: 360px; display: flex; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); transform: translateX(110%);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative;
        }
        .toast.show { transform: translateX(0); }
        .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
        .toast.success::before { background: var(--accent-green); }
        .toast.error::before { background: var(--accent-red); }
        .toast-icon { font-size: 1rem; flex-shrink: 0; }
        .toast-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .toast-msg { font-size: 0.78rem; color: var(--text-secondary); }

        @media (max-width: 600px) {
            .main { padding: 16px 12px 0; }
            .logo-name { display: none; }
            .admin-email { display: none; }
            .info-label { min-width: 70px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-mark">A</div>
        <div class="logo-name">Admin Panel</div>
    </div>
    <div class="header-right">
        <span class="admin-email" id="adminEmail">admin@grovia.com</span>
        <button class="logout-btn" onclick="showLogout()">Logout</button>
    </div>
</header>

<main class="main">
    <!-- Method Tabs -->
    <div class="method-tabs">
        <button class="method-tab active" onclick="switchMethod('all', this)">All Methods</button>
        <button class="method-tab" onclick="switchMethod('USDT (BEP20)', this)">USDT</button>
        <button class="method-tab" onclick="switchMethod('Naira (PALMPAY)', this)">Naira</button>
    </div>

    <!-- Status Tabs + Small Date Filter -->
    <div class="status-row">
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="filterDeposits('pending', this)">Pending</button>
            <button class="filter-tab" onclick="filterDeposits('approved', this)">Approved</button>
            <button class="filter-tab" onclick="filterDeposits('rejected', this)">Rejected</button>
        </div>

        <!-- Small Discrete Date Filter -->
        <div class="date-filter">
            <button class="date-filter-btn" id="dateFilterBtn" onclick="toggleDateFilter(event)">📅</button>
            <div class="date-filter-menu" id="dateFilterMenu">
                <div class="date-filter-item active" data-dayfilter="all" onclick="setDayFilter('all', this)">All Dates</div>
                <div class="date-filter-item" data-dayfilter="today" onclick="setDayFilter('today', this)">Today</div>
                <div class="date-filter-item" data-dayfilter="yesterday" onclick="setDayFilter('yesterday', this)">Yesterday</div>
            </div>
        </div>
    </div>

    <!-- Deposits List -->
    <div class="deposits-list" id="depositsList">
        <div class="empty-state">Loading deposits...</div>
    </div>
</main>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span class="nav-label">Security</span>
    </a>
</nav>

<!-- Receipt Modal -->
<div class="overlay" id="receiptOverlay">
    <div class="modal">
        <button class="modal-close" onclick="closeReceipt()">×</button>
        <div class="modal-title">Payment Receipt</div>
        <img class="receipt-image" id="receiptImage" src="" alt="Receipt">
        <div id="receiptDetails"></div>
        <div class="modal-btns" id="receiptActions">
            <button class="btn-modal reject" onclick="rejectFromModal()">Reject</button>
            <button class="btn-modal approve" onclick="approveFromModal()">Approve</button>
        </div>
    </div>
</div>

<!-- Logout Modal -->
<div class="overlay" id="logoutOverlay">
    <div class="modal">
        <div class="modal-title" style="color: var(--accent-red);">Confirm Logout</div>
        <p style="font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 15px;">Are you sure you want to logout?</p>
        <div class="modal-btns">
            <button class="btn-modal cancel" onclick="closeLogout()">Cancel</button>
            <button class="btn-modal reject" onclick="doLogout()">Logout</button>
        </div>
    </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, increment, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
    authDomain: "grovia-15266.firebaseapp.com",
    projectId: "grovia-15266",
    storageBucket: "grovia-15266.firebasestorage.app",
    messagingSenderId: "330674853010",
    appId: "1:330674853010:web:15a2cce632dd4528b8024b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allDeposits = [];
let currentFilter = 'pending';
let currentMethod = 'all';
let currentDayFilter = 'all';
let currentDeposit = null;

function toast(type, title, msg) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<div class="toast-icon">${type === 'success' ? 'OK' : '!'}</div><div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4000);
}

window.showLogout = () => document.getElementById('logoutOverlay').classList.add('show');
window.closeLogout = () => document.getElementById('logoutOverlay').classList.remove('show');
window.doLogout = async () => {
    sessionStorage.removeItem('grovia_admin');
    await signOut(auth);
    location.href = 'admin-login.html';
};

window.switchMethod = function(method, btn) {
    currentMethod = method;
    document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderDeposits();
};

window.filterDeposits = function(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderDeposits();
};

/* ══════ DATE FILTER ══════ */
window.toggleDateFilter = function(e) {
    e.stopPropagation();
    const menu = document.getElementById('dateFilterMenu');
    const btn = document.getElementById('dateFilterBtn');
    menu.classList.toggle('show');
    btn.classList.toggle('active');
};

window.setDayFilter = function(day, el) {
    currentDayFilter = day;
    document.querySelectorAll('[data-dayfilter]').forEach(i => i.classList.remove('active'));
    el.classList.add('active');

    const btn = document.getElementById('dateFilterBtn');
    if (day === 'all') btn.classList.remove('active');
    else btn.classList.add('active');

    document.getElementById('dateFilterMenu').classList.remove('show');
    renderDeposits();
};

document.addEventListener('click', (e) => {
    const menu = document.getElementById('dateFilterMenu');
    const wrap = document.querySelector('.date-filter');
    if (wrap && !wrap.contains(e.target)) {
        menu.classList.remove('show');
        document.getElementById('dateFilterBtn').classList.toggle('active', currentDayFilter !== 'all');
    }
});

/* Helper: Check if a date is "today" or "yesterday" in local time */
function isToday(date) {
    if (!date) return false;
    const now = new Date();
    return date.getDate() === now.getDate() &&
           date.getMonth() === now.getMonth() &&
           date.getFullYear() === now.getFullYear();
}

function isYesterday(date) {
    if (!date) return false;
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    return date.getDate() === yesterday.getDate() &&
           date.getMonth() === yesterday.getMonth() &&
           date.getFullYear() === yesterday.getFullYear();
}

function formatDate(dateValue) {
    if (!dateValue) return '—';
    let date;
    if (typeof dateValue.toDate === 'function') date = dateValue.toDate();
    else if (dateValue instanceof Date) date = dateValue;
    else return '—';
    return date.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

/* Escape HTML so weird TXIDs / usernames can't break the DOM */
function esc(str) {
    if (str === undefined || str === null) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

/* Copy TXID to clipboard */
window.copyTxid = function(id, evt) {
    if (evt) evt.stopPropagation();
    const deposit = allDeposits.find(d => d.id === id);
    if (!deposit || !deposit.transactionHash) return;
    const btn = evt ? evt.currentTarget : null;
    navigator.clipboard.writeText(deposit.transactionHash).then(() => {
        toast('success', 'TXID Copied', 'Transaction hash copied to clipboard.');
        if (btn) {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = 'Copy TXID';
                btn.classList.remove('copied');
            }, 2000);
        }
    }).catch(() => {
        toast('error', 'Copy Failed', 'Could not copy the TXID.');
    });
};

function renderDeposits() {
    const list = document.getElementById('depositsList');
    let filtered = allDeposits.filter(d => {
        const matchesFilter = currentFilter === d.status;
        const matchesMethod = currentMethod === 'all' || d.paymentMethod === currentMethod;

        let matchesDay = true;
        if (currentDayFilter !== 'all') {
            const dt = d.createdAt?.toDate?.();
            if (!dt) {
                matchesDay = false;
            } else if (currentDayFilter === 'today') {
                matchesDay = isToday(dt);
            } else if (currentDayFilter === 'yesterday') {
                matchesDay = isYesterday(dt);
            }
        }

        return matchesFilter && matchesMethod && matchesDay;
    });

    if (filtered.length === 0) {
        const dayLabel = currentDayFilter === 'today' ? "today's" : currentDayFilter === 'yesterday' ? "yesterday's" : '';
        list.innerHTML = `<div class="empty-state">No ${currentFilter} ${dayLabel} ${currentMethod !== 'all' ? currentMethod : ''} deposits found</div>`;
        return;
    }

    list.innerHTML = '';
    filtered.forEach(deposit => {
        const isNaira = deposit.paymentMethod?.includes('Naira');
        const card = document.createElement('div');
        card.className = `deposit-card ${deposit.status}`;

        // ── Build TXID block (only for USDT) ──
        let txidBlockHtml = '';
        if (!isNaira) {
            if (deposit.transactionHash) {
                txidBlockHtml = `
                    <div class="info-block txid">
                        <div class="info-row">
                            <span class="info-icon">🔗</span>
                            <span class="info-label">TXID · Required</span>
                        </div>
                        <div class="txid-value" title="Click to select">${esc(deposit.transactionHash)}</div>
                        <button class="txid-copy-btn" onclick="copyTxid('${deposit.id}', event)">Copy TXID</button>
                    </div>
                `;
            } else {
                txidBlockHtml = `
                    <div class="info-block txid missing">
                        <div class="info-row">
                            <span class="info-icon">⚠️</span>
                            <span class="info-label">TXID · Missing</span>
                        </div>
                        <div style="color: var(--accent-red); font-size: 0.72rem; margin-top: 4px; font-weight: 600;">
                            No transaction hash on this deposit — verify manually before approving.
                        </div>
                        ${deposit.senderAddress ? `<div class="txid-value" style="opacity:0.7">${esc(deposit.senderAddress)}<div style="font-size:0.6rem;color:var(--text-muted);margin-top:3px;">(legacy sender address)</div></div>` : ''}
                    </div>
                `;
            }
        }

        // ── Build user local time block ──
        let localTimeBlockHtml = '';
        if (deposit.userLocalTime || deposit.userTimeZone) {
            localTimeBlockHtml = `
                <div class="info-block localtime">
                    <div class="info-row">
                        <span class="info-icon">🕒</span>
                        <span class="info-label">User Local Time</span>
                        <span class="info-value localtime-value">${esc(deposit.userLocalTime || '—')}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-icon">🌍</span>
                        <span class="info-label">Timezone</span>
                        <span class="info-value zone-value">
                            ${esc(deposit.userTimeZone || 'Unknown')}
                            ${deposit.userTimeZoneOffset ? ' · ' + esc(deposit.userTimeZoneOffset) : ''}
                            ${deposit.userLocale ? ' · ' + esc(deposit.userLocale) : ''}
                        </span>
                    </div>
                </div>
            `;
        }

        card.innerHTML = `
            <div class="deposit-header">
                <div class="deposit-user">
                    <div class="deposit-avatar">${esc((deposit.username || 'U').charAt(0).toUpperCase())}</div>
                    <div class="deposit-info">
                        <div class="deposit-name">${esc(deposit.username || 'User')}</div>
                        <div class="deposit-fullname">Full Name: ${esc(deposit.fullName || 'N/A')}</div>
                        <div class="deposit-email">${esc(deposit.email || 'No email')}</div>
                        <span class="deposit-method ${isNaira ? 'naira' : 'usdt'}">${esc(deposit.paymentMethod || 'USDT')}</span>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div class="deposit-amount">$${(deposit.amount || 0).toFixed(2)}</div>
                    <span class="deposit-status ${deposit.status}">${esc(deposit.status)}</span>
                </div>
            </div>
            <div class="deposit-time">Submitted (your time): ${formatDate(deposit.createdAt)}</div>
            ${localTimeBlockHtml}
            ${txidBlockHtml}
            <div class="deposit-actions">
                <button class="action-btn view-receipt-btn" onclick="viewReceipt('${deposit.id}')">View Receipt</button>
                ${deposit.status === 'pending' ? `
                    <button class="action-btn approve-btn" onclick="approveDeposit('${deposit.id}')">Approve</button>
                    <button class="action-btn reject-btn" onclick="rejectDeposit('${deposit.id}')">Reject</button>
                ` : ''}
            </div>
        `;
        list.appendChild(card);
    });
}

window.viewReceipt = function(id) {
    currentDeposit = allDeposits.find(d => d.id === id);
    if (!currentDeposit) return;

    document.getElementById('receiptImage').src = currentDeposit.paymentScreenshot || '';

    // Build detail rows
    let detailsHtml = `
        <div class="detail-row"><span class="detail-label">Username</span><span class="detail-value">${esc(currentDeposit.username)}</span></div>
        <div class="detail-row"><span class="detail-label">Full Name</span><span class="detail-value">${esc(currentDeposit.fullName)}</span></div>
        <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${esc(currentDeposit.email)}</span></div>
        <div class="detail-row"><span class="detail-label">Method</span><span class="detail-value">${esc(currentDeposit.paymentMethod)}</span></div>
        <div class="detail-row"><span class="detail-label">Amount</span><span class="detail-value">$${currentDeposit.amount.toFixed(2)}</span></div>
    `;

    if (currentDeposit.amountInput) {
        detailsHtml += `<div class="detail-row"><span class="detail-label">Amount Sent</span><span class="detail-value">${esc(currentDeposit.amountInput)}</span></div>`;
    }

    // User local time rows
    if (currentDeposit.userLocalTime || currentDeposit.userTimeZone) {
        detailsHtml += `
            <div class="detail-row">
                <span class="detail-label">User Local Time</span>
                <span class="detail-value localtime-modal">${esc(currentDeposit.userLocalTime || '—')}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Timezone</span>
                <span class="detail-value zone-modal">
                    ${esc(currentDeposit.userTimeZone || 'Unknown')}
                    ${currentDeposit.userTimeZoneOffset ? ' · ' + esc(currentDeposit.userTimeZoneOffset) : ''}
                    ${currentDeposit.userLocale ? ' · ' + esc(currentDeposit.userLocale) : ''}
                </span>
            </div>
        `;
    }

    // TXID / transaction hash row
    if (currentDeposit.transactionHash) {
        detailsHtml += `
            <div class="detail-row" style="flex-direction: column; align-items: flex-start;">
                <span class="detail-label" style="color: var(--accent-red); font-weight:700;">🔗 TXID (Required)</span>
                <div class="detail-value txid-modal" style="max-width: 100%; width: 100%; margin-top: 4px;">${esc(currentDeposit.transactionHash)}</div>
            </div>
        `;
    } else if (!currentDeposit.paymentMethod?.includes('Naira')) {
        detailsHtml += `
            <div class="detail-row">
                <span class="detail-label" style="color: var(--accent-red); font-weight:700;">🔗 TXID</span>
                <span class="detail-value" style="color: var(--accent-red);">⚠ Missing</span>
            </div>
        `;
    }

    // Legacy fallback for sender address
    if (!currentDeposit.transactionHash && currentDeposit.senderAddress) {
        detailsHtml += `
            <div class="detail-row" style="flex-direction: column; align-items: flex-start;">
                <span class="detail-label">Sender Address (legacy)</span>
                <div class="detail-value txid-modal" style="max-width: 100%; width: 100%; margin-top: 4px;">${esc(currentDeposit.senderAddress)}</div>
            </div>
        `;
    }

    document.getElementById('receiptDetails').innerHTML = detailsHtml;

    document.getElementById('receiptActions').style.display = currentDeposit.status === 'pending' ? 'grid' : 'none';
    document.getElementById('receiptOverlay').classList.add('show');
};

window.closeReceipt = () => { document.getElementById('receiptOverlay').classList.remove('show'); currentDeposit = null; };
window.approveFromModal = async () => { if (currentDeposit) await approveDeposit(currentDeposit.id); };
window.rejectFromModal = async () => { if (currentDeposit) await rejectDeposit(currentDeposit.id); };

window.approveDeposit = async function(id) {
    const deposit = allDeposits.find(d => d.id === id);
    if (!deposit) return;

    if (!confirm(`Approve $${deposit.amount.toFixed(2)} deposit from ${deposit.username}?`)) return;

    try {
        await updateDoc(doc(db, 'deposits', id), { status: 'approved', processedAt: serverTimestamp() });

        await updateDoc(doc(db, 'users', deposit.uid), {
            depositWallet: increment(deposit.amount)
        });

        await addDoc(collection(db, 'transactions'), {
            uid: deposit.uid,
            type: 'deposit',
            amount: deposit.amount,
            status: 'completed',
            createdAt: serverTimestamp()
        });

        closeReceipt();
        toast('success', 'Deposit Approved', `$${deposit.amount.toFixed(2)} credited to ${deposit.username}.`);
        loadDeposits();
    } catch (e) {
        console.error(e);
        toast('error', 'Failed', 'Error approving deposit.');
    }
};

window.rejectDeposit = async function(id) {
    const deposit = allDeposits.find(d => d.id === id);
    if (!deposit) return;

    if (!confirm(`Reject deposit from ${deposit.username}?`)) return;

    try {
        await updateDoc(doc(db, 'deposits', id), { status: 'rejected', processedAt: serverTimestamp() });
        closeReceipt();
        toast('success', 'Deposit Rejected', `Deposit from ${deposit.username} rejected.`);
        loadDeposits();
    } catch (e) {
        console.error(e);
        toast('error', 'Failed', 'Error rejecting deposit.');
    }
};

async function loadDeposits() {
    try {
        const snapshot = await getDocs(collection(db, 'deposits'));
        allDeposits = [];
        snapshot.forEach(doc => {
            allDeposits.push({ id: doc.id, ...doc.data() });
        });

        allDeposits.sort((a, b) => {
            const dateA = a.createdAt?.toDate?.() || new Date(0);
            const dateB = b.createdAt?.toDate?.() || new Date(0);
            return dateB - dateA;
        });

        renderDeposits();
    } catch (e) {
        console.error(e);
        document.getElementById('depositsList').innerHTML = '<div class="empty-state">Error loading deposits</div>';
    }
}

onAuthStateChanged(auth, (user) => {
    if (user && sessionStorage.getItem('grovia_admin') === 'true') {
        document.getElementById('adminEmail').textContent = user.email;
        loadDeposits();
    } else {
        location.href = 'admin-login.html';
    }
});
</script>
