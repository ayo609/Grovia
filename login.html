<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grovia</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0c1220;
            --bg-secondary: #111927;
            --bg-card: #162030;
            --bg-elevated: #1c2a3a;
            --accent-green: #00e676;
            --accent-blue: #29b6f6;
            --accent-gold: #ffc107;
            --accent-red: #ff5252;
            --text-primary: #eef2f7;
            --text-secondary: #8fa3b8;
            --text-muted: #506070;
            --border: rgba(255,255,255,0.07);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,230,118,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,230,118,0.025) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 25s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 40% at 15% 20%, rgba(41,182,246,0.05) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 85% 80%, rgba(0,230,118,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .back-link:hover { color: var(--accent-blue); }

        .back-link svg { width: 14px; height: 14px; }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(41,182,246,0.25);
        }

        .logo-icon span {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 700;
            color: #0c1220;
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-tagline {
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Form Header */
        .form-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .form-subtitle {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* Inputs */
        .input-group {
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-blue);
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            z-index: 1;
            display: flex;
        }

        .input-icon svg { width: 16px; height: 16px; }

        .input-field {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 13px 16px 13px 42px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            outline: none;
        }

        .input-field:focus {
            border-color: rgba(41,182,246,0.5);
            background: var(--bg-elevated);
            box-shadow: 0 0 0 3px rgba(41,182,246,0.08);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            transition: var(--transition);
        }
        .toggle-password:hover { color: var(--accent-blue); }
        .toggle-password svg { width: 16px; height: 16px; }

        .error-message {
            color: var(--accent-red);
            font-size: 0.75rem;
            margin-top: 5px;
            display: none;
        }
        .error-message.show { display: block; }

        /* Remember / Forgot */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            background: var(--bg-secondary);
        }

        .checkbox-group input[type="checkbox"]:checked {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .checkbox-group input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0c1220;
            font-size: 11px;
            font-weight: 700;
        }

        .checkbox-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .forgot-link:hover { color: var(--accent-green); }

        /* Button */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            border: none;
            color: #0c1220;
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
            border-radius: var(--radius-sm);
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.92;
            box-shadow: 0 8px 24px rgba(41,182,246,0.25);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(12,18,32,0.3);
            border-top-color: #0c1220;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-loading .spinner { display: block; }
        .btn-loading .btn-text { display: none; }

        /* Footer */
        .form-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .form-footer a {
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        .form-footer a:hover { color: var(--accent-blue); }

        /* Toasts */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 18px;
            min-width: 280px;
            max-width: 380px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transform: translateX(120%);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .toast.show { transform: translateX(0); }

        .toast::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }

        .toast.success::before { background: var(--accent-green); }
        .toast.error::before { background: var(--accent-red); }
        .toast.warning::before { background: var(--accent-gold); }

        .toast-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
        }

        .toast.success .toast-icon { color: var(--accent-green); }
        .toast.error .toast-icon { color: var(--accent-red); }
        .toast.warning .toast-icon { color: var(--accent-gold); }

        .toast-content { flex: 1; }

        .toast-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 3px;
            color: var(--text-primary);
        }

        .toast-message {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px;
            font-size: 1.1rem;
            transition: var(--transition);
            flex-shrink: 0;
            line-height: 1;
        }
        .toast-close:hover { color: var(--text-primary); }

        @media (max-width: 480px) {
            .card { padding: 28px 22px; }
            .brand-name { font-size: 1.5rem; }
            .form-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <div class="card">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M19 12H5"/>
                    <path d="M12 19l-7-7 7-7"/>
                </svg>
                Back to Register
            </a>

            <div class="logo-section">
                <div class="logo-icon"><span>G</span></div>
                <h1 class="brand-name">Grovia</h1>
                <p class="brand-tagline">Dollar Investment Platform</p>
            </div>

            <h2 class="form-title">Welcome Back</h2>
            <p class="form-subtitle">Login to access your investment dashboard</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label class="input-label">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input type="text" class="input-field" id="username" placeholder="Enter your username" autocomplete="username" required>
                    </div>
                    <div class="error-message" id="usernameError"></div>
                </div>

                <div class="input-group">
                    <label class="input-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" class="input-field" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="remember-forgot">
                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link" onclick="forgotPassword(event)">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary" id="loginButton">
                    <span class="btn-text">Login</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="index.html">Register Now</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
            authDomain: "grovia-15266.firebaseapp.com",
            projectId: "grovia-15266",
            storageBucket: "grovia-15266.firebasestorage.app",
            messagingSenderId: "330674853010",
            appId: "1:330674853010:web:15a2cce632dd4528b8024b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function showToast(type, title, message, duration = 4000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icons = {
                success: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>',
                error: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                warning: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
            };

            toast.innerHTML = `
                <div class="toast-icon">${icons[type]}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, duration);
        }

        window.togglePasswordVisibility = function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                    <path d="M14.12 14.12a3 3 0 11-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
        };

        window.handleLogin = async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            document.getElementById('usernameError').classList.remove('show');
            document.getElementById('passwordError').classList.remove('show');

            if (!username) {
                document.getElementById('usernameError').textContent = 'Please enter your username';
                document.getElementById('usernameError').classList.add('show');
                return;
            }

            if (!password) {
                document.getElementById('passwordError').textContent = 'Please enter your password';
                document.getElementById('passwordError').classList.add('show');
                return;
            }

            const loginButton = document.getElementById('loginButton');
            loginButton.classList.add('btn-loading');
            loginButton.disabled = true;

            try {
                const usersRef = collection(db, 'users');
                const q = query(usersRef, where('username', '==', username));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    loginButton.classList.remove('btn-loading');
                    loginButton.disabled = false;
                    document.getElementById('usernameError').textContent = 'Username not found';
                    document.getElementById('usernameError').classList.add('show');
                    showToast('error', 'Login Failed', 'Username not found. Please check and try again.');
                    return;
                }

                const userData = querySnapshot.docs[0].data();
                const userEmail = userData.email;

                await signInWithEmailAndPassword(auth, userEmail, password);

                loginButton.classList.remove('btn-loading');

                if (rememberMe) {
                    localStorage.setItem('grovia_username', username);
                } else {
                    localStorage.removeItem('grovia_username');
                }

                showToast('success', 'Welcome Back!', `Logged in as ${userData.username}. Redirecting...`, 6000);

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                loginButton.classList.remove('btn-loading');
                loginButton.disabled = false;
                console.error('Login error:', error);

                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    document.getElementById('passwordError').textContent = 'Incorrect password';
                    document.getElementById('passwordError').classList.add('show');
                    showToast('error', 'Login Failed', 'Incorrect password. Please try again.');
                } else if (error.code === 'auth/user-not-found') {
                    document.getElementById('usernameError').textContent = 'Username not found';
                    document.getElementById('usernameError').classList.add('show');
                    showToast('error', 'Login Failed', 'Username not found. Please register first.');
                } else {
                    showToast('error', 'Login Failed', 'An error occurred. Please try again.');
                }
            }
        };

        window.forgotPassword = function(event) {
            event.preventDefault();
            showToast('warning', 'Password Reset', 'Please contact support to reset your password.');
        };

        document.addEventListener('DOMContentLoaded', () => {
            const rememberedUsername = localStorage.getItem('grovia_username');
            if (rememberedUsername) {
                document.getElementById('username').value = rememberedUsername;
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>
</body>
</html>
