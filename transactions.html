<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Grovia</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0c1220;
            --bg-secondary: #111927;
            --bg-card: #162030;
            --bg-elevated: #1c2a3a;
            --accent-green: #00e676;
            --accent-blue: #29b6f6;
            --accent-gold: #ffc107;
            --accent-purple: #7c3aed;
            --accent-red: #ff5252;
            --text-primary: #eef2f7;
            --text-secondary: #8fa3b8;
            --text-muted: #506070;
            --border: rgba(255,255,255,0.07);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 10% 20%, rgba(0,230,118,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 80%, rgba(41,182,246,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(12,18,32,0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logout-btn {
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,82,82,0.4);
            background: transparent;
            color: var(--accent-red);
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .logout-btn:hover { background: rgba(255,82,82,0.1); }

        .main { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 20px 16px 0; }

        /* Summary Bar - compact */
        .summary-bar {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px;
        }
        .summary-item {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px; text-align: center;
        }
        .summary-label {
            font-size: 0.6rem; font-weight: 600; letter-spacing: 0.5px;
            color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;
        }
        .summary-value { font-family: var(--font-display); font-size: 0.9rem; font-weight: 700; }
        .summary-item.deposits .summary-value { color: var(--accent-green); }
        .summary-item.withdrawals .summary-value { color: var(--accent-gold); }
        .summary-item.investments .summary-value { color: var(--accent-blue); }
        .summary-item.roi .summary-value { color: var(--accent-purple); }

        /* Dropdown Filter */
        .dropdown-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        .dropdown-select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: var(--transition);
        }
        .dropdown-select:focus { border-color: var(--accent-purple); }
        .dropdown-arrow {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 0.8rem;
        }

        /* Transaction List */
        .transaction-list { display: flex; flex-direction: column; gap: 8px; }

        .transaction-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 12px 14px; position: relative; transition: var(--transition);
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .transaction-card::before {
            content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        }
        .transaction-card.deposit::before { background: var(--accent-green); }
        .transaction-card.withdrawal::before { background: var(--accent-gold); }
        .transaction-card.investment::before { background: var(--accent-blue); }
        .transaction-card.referral::before { background: var(--accent-purple); }
        .transaction-card.roi::before { background: var(--accent-green); }
        .transaction-card:hover { border-color: var(--accent-purple); }

        .transaction-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .transaction-icon {
            width: 32px; height: 32px; border-radius: 8px; display: flex;
            align-items: center; justify-content: center;
            font-family: var(--font-display); font-weight: 700; font-size: 0.75rem;
            flex-shrink: 0;
        }
        .deposit .transaction-icon { background: rgba(0,230,118,0.15); color: var(--accent-green); }
        .withdrawal .transaction-icon { background: rgba(255,193,7,0.15); color: var(--accent-gold); }
        .investment .transaction-icon { background: rgba(41,182,246,0.15); color: var(--accent-blue); }
        .referral .transaction-icon { background: rgba(124,58,237,0.15); color: var(--accent-purple); }
        .roi .transaction-icon { background: rgba(0,230,118,0.15); color: var(--accent-green); }

        .transaction-info { flex: 1; min-width: 0; }
        .transaction-type { font-weight: 600; font-size: 0.8rem; text-transform: capitalize; }
        .transaction-time { font-size: 0.68rem; color: var(--text-muted); }

        .transaction-right { text-align: right; flex-shrink: 0; }
        .transaction-amount {
            font-family: var(--font-display); font-weight: 700; font-size: 0.9rem;
        }
        .transaction-amount.positive { color: var(--accent-green); }
        .transaction-amount.negative { color: var(--accent-red); }
        .transaction-status {
            font-size: 0.65rem; font-weight: 600; text-transform: capitalize;
            margin-top: 2px;
        }
        .status-completed { color: var(--accent-green); }
        .status-pending { color: var(--accent-gold); }
        .status-active { color: var(--accent-blue); }
        .status-paid { color: var(--accent-purple); }
        .status-credited { color: var(--accent-green); }

        .empty-state {
            text-align: center; padding: 35px 20px; background: var(--bg-card);
            border-radius: var(--radius-md); border: 1px solid var(--border);
        }
        .empty-icon { font-size: 1.5rem; margin-bottom: 8px; color: var(--text-muted); }
        .empty-text { color: var(--text-secondary); font-size: 0.85rem; }

        .load-more { text-align: center; margin-top: 15px; }
        .load-more-btn {
            padding: 9px 22px; background: transparent; border: 2px solid var(--accent-purple);
            color: var(--accent-purple); border-radius: 25px; cursor: pointer;
            font-family: var(--font-body); font-weight: 600; font-size: 0.8rem; transition: var(--transition);
        }
        .load-more-btn:hover { background: var(--accent-purple); color: white; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
            background: rgba(12,18,32,0.95); backdrop-filter: blur(16px);
            border-top: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-around; z-index: 200;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px; background: none;
            border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition);
            padding: 4px 15px; text-decoration: none; font-family: var(--font-body);
        }
        .nav-item:hover, .nav-item.active { color: var(--accent-green); }
        .nav-item svg { width: 22px; height: 22px; }
        .nav-label { font-size: 0.65rem; font-weight: 600; }

        .toasts { position: fixed; bottom: 76px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 12px 15px; min-width: 260px; max-width: 340px; display: flex; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); transform: translateX(110%);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative;
        }
        .toast.show { transform: translateX(0); }
        .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
        .toast.success::before { background: var(--accent-green); }
        .toast.error::before { background: var(--accent-red); }
        .toast-icon { font-size: 1rem; flex-shrink: 0; }
        .toast-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .toast-msg { font-size: 0.78rem; color: var(--text-secondary); }

        @media (max-width: 600px) {
            .summary-bar { grid-template-columns: repeat(2, 1fr); }
            .main { padding: 16px 12px 0; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-title">Grovia</div>
    <button class="logout-btn" onclick="location.href='login.html'">Logout</button>
</header>

<main class="main">
    <!-- Summary Bar -->
    <div class="summary-bar">
        <div class="summary-item deposits">
            <div class="summary-label">Deposits</div>
            <div class="summary-value" id="totalDeposits">$0.00</div>
        </div>
        <div class="summary-item withdrawals">
            <div class="summary-label">Withdrawals</div>
            <div class="summary-value" id="totalWithdrawals">$0.00</div>
        </div>
        <div class="summary-item investments">
            <div class="summary-label">Investments</div>
            <div class="summary-value" id="totalInvestments">$0.00</div>
        </div>
        <div class="summary-item roi">
            <div class="summary-label">ROI Earned</div>
            <div class="summary-value" id="totalROI">$0.00</div>
        </div>
    </div>

    <!-- Dropdown Filter -->
    <div class="dropdown-wrapper">
        <select class="dropdown-select" id="filterSelect" onchange="filterTransactions(this.value)">
            <option value="all">All Transactions</option>
            <option value="deposit">Deposits</option>
            <option value="withdrawal">Withdrawals</option>
            <option value="investment">Investments</option>
            <option value="referral">Referrals</option>
            <option value="roi">ROI Earnings</option>
        </select>
        <span class="dropdown-arrow">▼</span>
    </div>

    <!-- Transaction List -->
    <div class="transaction-list" id="transactionList">
        <div class="empty-state">
            <div class="empty-icon">...</div>
            <p class="empty-text">Loading transactions...</p>
        </div>
    </div>

    <!-- Load More -->
    <div class="load-more" id="loadMoreContainer" style="display: none;">
        <button class="load-more-btn" onclick="loadMoreTransactions()">Load More</button>
    </div>
</main>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="nav-label">Home</span>
    </a>
    <a href="transactions.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        <span class="nav-label">History</span>
    </a>
    <a href="referrals.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="nav-label">Referrals</span>
    </a>
    <a href="profile.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="nav-label">Profile</span>
    </a>
</nav>

<div class="toasts" id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
    authDomain: "grovia-15266.firebaseapp.com",
    projectId: "grovia-15266",
    storageBucket: "grovia-15266.firebasestorage.app",
    messagingSenderId: "330674853010",
    appId: "1:330674853010:web:15a2cce632dd4528b8024b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let allTransactions = [];
let currentFilter = 'all';
let visibleCount = 10;

function toast(type, title, msg) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<div class="toast-icon">${type === 'success' ? 'OK' : '!'}</div><div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4000);
}

function getIcon(type) {
    const icons = { deposit: 'D', withdrawal: 'W', investment: 'I', referral: 'R', roi: 'R' };
    return icons[type] || 'T';
}

function getStatusClass(status) {
    const map = {
        'completed': 'status-completed',
        'pending': 'status-pending',
        'active': 'status-active',
        'paid': 'status-paid',
        'credited': 'status-credited',
        'approved': 'status-completed'
    };
    return map[status] || 'status-completed';
}

function formatTime(dateValue) {
    if (!dateValue) return '';
    let date;
    if (typeof dateValue.toDate === 'function') date = dateValue.toDate();
    else if (dateValue instanceof Date) date = dateValue;
    else if (typeof dateValue === 'string') date = new Date(dateValue);
    else return '';
    return date.toLocaleString('en-US', { 
        month: 'short', day: 'numeric', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
}

function displayTransactions() {
    const list = document.getElementById('transactionList');
    const filtered = allTransactions.filter(tx => currentFilter === 'all' || tx.type === currentFilter);
    
    if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state"><div class="empty-icon">No Data</div><p class="empty-text">No transactions found</p></div>`;
        document.getElementById('loadMoreContainer').style.display = 'none';
        return;
    }
    
    const visible = filtered.slice(0, visibleCount);
    let html = '';
    
    visible.forEach(tx => {
        const isPositive = tx.type === 'deposit' || tx.type === 'referral' || tx.type === 'roi';
        const timeDisplay = formatTime(tx.createdAt);
        const typeLabel = tx.type === 'roi' ? 'ROI Earnings' : tx.type;
        const statusClass = getStatusClass(tx.status);
        const statusLabel = tx.status === 'approved' ? 'completed' : (tx.status || 'completed');
        
        html += `
            <div class="transaction-card ${tx.type}">
                <div class="transaction-left">
                    <div class="transaction-icon">${getIcon(tx.type)}</div>
                    <div class="transaction-info">
                        <div class="transaction-type">${typeLabel}</div>
                        <div class="transaction-time">${timeDisplay}</div>
                    </div>
                </div>
                <div class="transaction-right">
                    <div class="transaction-amount ${isPositive ? 'positive' : 'negative'}">
                        ${isPositive ? '+' : '-'}$${(tx.amount || 0).toFixed(2)}
                    </div>
                    <div class="transaction-status ${statusClass}">${statusLabel}</div>
                </div>
            </div>
        `;
    });
    
    list.innerHTML = html;
    document.getElementById('loadMoreContainer').style.display = filtered.length > visibleCount ? 'block' : 'none';
    updateSummary(filtered);
}

function updateSummary(transactions) {
    let deposits = 0, withdrawals = 0, investments = 0, roi = 0;
    transactions.forEach(tx => {
        const amt = tx.amount || 0;
        if (tx.type === 'deposit') deposits += amt;
        if (tx.type === 'withdrawal') withdrawals += amt;
        if (tx.type === 'investment') investments += amt;
        if (tx.type === 'roi') roi += amt;
    });
    document.getElementById('totalDeposits').textContent = `$${deposits.toFixed(2)}`;
    document.getElementById('totalWithdrawals').textContent = `$${withdrawals.toFixed(2)}`;
    document.getElementById('totalInvestments').textContent = `$${investments.toFixed(2)}`;
    document.getElementById('totalROI').textContent = `$${roi.toFixed(2)}`;
}

window.filterTransactions = function(filter) {
    currentFilter = filter;
    displayTransactions();
};

window.loadMoreTransactions = function() {
    visibleCount += 10;
    displayTransactions();
};

async function loadAllTransactions() {
    if (!currentUser) return;
    try {
        allTransactions = [];
        
        // Load deposits requests
        const depositsQuery = query(collection(db, 'deposits'), where('uid', '==', currentUser.uid));
        const depositsSnap = await getDocs(depositsQuery);
        depositsSnap.forEach(doc => {
            const data = doc.data();
            allTransactions.push({
                id: doc.id,
                type: 'deposit',
                amount: data.amount,
                status: data.status === 'approved' ? 'completed' : data.status,
                createdAt: data.createdAt
            });
        });
        
        // Load transactions
        const txQuery = query(collection(db, 'transactions'), where('uid', '==', currentUser.uid));
        const txSnap = await getDocs(txQuery);
        txSnap.forEach(doc => {
            allTransactions.push({ ...doc.data(), id: doc.id });
        });
        
        // Load withdrawals requests
        const withdrawalsQuery = query(collection(db, 'withdrawals'), where('uid', '==', currentUser.uid));
        const withdrawalsSnap = await getDocs(withdrawalsQuery);
        withdrawalsSnap.forEach(doc => {
            const data = doc.data();
            allTransactions.push({
                id: doc.id,
                type: 'withdrawal',
                amount: data.amount,
                status: data.status === 'approved' ? 'completed' : data.status,
                createdAt: data.createdAt
            });
        });
        
        // Load plans (investments)
        const plansQuery = query(collection(db, 'plans'), where('uid', '==', currentUser.uid));
        const plansSnap = await getDocs(plansQuery);
        plansSnap.forEach(doc => {
            const data = doc.data();
            allTransactions.push({
                id: doc.id,
                type: 'investment',
                amount: data.amount,
                status: data.status || 'active',
                createdAt: data.createdAt || data.startDate
            });
        });
        
        // Load referral bonuses
        const refQuery = query(collection(db, 'referralBonuses'), where('referrerUid', '==', currentUser.uid));
        const refSnap = await getDocs(refQuery);
        refSnap.forEach(doc => {
            const data = doc.data();
            allTransactions.push({
                id: doc.id,
                type: 'referral',
                amount: data.amount,
                status: 'paid',
                createdAt: data.createdAt
            });
        });
        
        // Load ROI earnings
        const roiQuery = query(collection(db, 'roiEarnings'), where('uid', '==', currentUser.uid));
        const roiSnap = await getDocs(roiQuery);
        roiSnap.forEach(doc => {
            const data = doc.data();
            allTransactions.push({
                id: doc.id,
                type: 'roi',
                amount: data.amount,
                status: data.status || 'credited',
                createdAt: data.createdAt
            });
        });
        
        // Sort by date
        allTransactions.sort((a, b) => {
            const dateA = a.createdAt?.toDate?.() || new Date(0);
            const dateB = b.createdAt?.toDate?.() || new Date(0);
            return dateB - dateA;
        });
        
        displayTransactions();
    } catch (error) {
        console.error('Error loading transactions:', error);
        document.getElementById('transactionList').innerHTML = `<div class="empty-state"><div class="empty-icon">!</div><p class="empty-text">Error loading transactions</p></div>`;
    }
}

onAuthStateChanged(auth, async user => {
    if (user) {
        currentUser = user;
        await loadAllTransactions();
    } else {
        location.href = 'login.html';
    }
});
</script>
</body>
</html>
