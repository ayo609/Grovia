<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Grovia</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1729;
            --bg-secondary: #1a2332;
            --bg-card: #1f2b3d;
            --accent-green: #00ff88;
            --accent-blue: #00d4ff;
            --accent-gold: #ffd700;
            --accent-purple: #7c3aed;
            --accent-red: #ff4757;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border-color: #2d3748;
            --font-primary: 'Space Grotesk', sans-serif;
            --font-secondary: 'Inter', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-secondary);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 0% 50%, rgba(0, 255, 136, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue), var(--accent-purple));
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 45px;
            height: 45px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .back-btn:hover {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }

        .header-title {
            font-family: var(--font-primary);
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Summary Bar */
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .summary-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: var(--transition);
        }

        .summary-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .summary-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .summary-value {
            font-family: var(--font-primary);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .summary-item.deposits .summary-value { color: var(--accent-green); }
        .summary-item.withdrawals .summary-value { color: var(--accent-gold); }
        .summary-item.investments .summary-value { color: var(--accent-blue); }
        .summary-item.earnings .summary-value { color: var(--accent-purple); }

        /* Filter Pills */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding: 5px;
            scrollbar-width: none;
        }

        .filter-container::-webkit-scrollbar {
            display: none;
        }

        .filter-pill {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            font-family: var(--font-secondary);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .filter-pill:hover {
            border-color: var(--accent-purple);
            color: var(--text-primary);
        }

        .filter-pill.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
            border-color: transparent;
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.3);
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, 
                var(--accent-green), 
                var(--accent-blue), 
                var(--accent-purple)
            );
            opacity: 0.3;
        }

        .date-group {
            margin-bottom: 30px;
            position: relative;
        }

        .date-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-family: var(--font-primary);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .date-label::before {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--accent-purple);
            border-radius: 50%;
            position: absolute;
            left: -26px;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.5);
        }

        /* Transaction Card */
        .transaction-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            margin-bottom: 15px;
            padding: 20px;
            position: relative;
            transition: var(--transition);
            overflow: hidden;
        }

        .transaction-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 4px;
        }

        .transaction-card.deposit::before {
            background: var(--accent-green);
        }

        .transaction-card.withdrawal::before {
            background: var(--accent-gold);
        }

        .transaction-card.investment::before {
            background: var(--accent-blue);
        }

        .transaction-card.referral::before {
            background: var(--accent-purple);
        }

        .transaction-card:hover {
            transform: translateX(5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-purple);
        }

        .transaction-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .transaction-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .deposit .transaction-icon {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
        }

        .withdrawal .transaction-icon {
            background: rgba(255, 215, 0, 0.15);
            color: var(--accent-gold);
        }

        .investment .transaction-icon {
            background: rgba(0, 212, 255, 0.15);
            color: var(--accent-blue);
        }

        .referral .transaction-icon {
            background: rgba(124, 58, 237, 0.15);
            color: var(--accent-purple);
        }

        .transaction-type {
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: capitalize;
        }

        .transaction-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .transaction-amount {
            font-family: var(--font-primary);
            font-weight: 700;
            font-size: 1.2rem;
            text-align: right;
        }

        .transaction-amount.positive {
            color: var(--accent-green);
        }

        .transaction-amount.negative {
            color: var(--accent-red);
        }

        .transaction-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.completed {
            background: var(--accent-green);
            box-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
        }

        .status-dot.pending {
            background: var(--accent-gold);
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        .status-dot.active {
            background: var(--accent-blue);
            box-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
            color: var(--text-muted);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .empty-text {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* Load More */
        .load-more {
            text-align: center;
            margin-top: 20px;
        }

        .load-more-btn {
            padding: 12px 30px;
            background: transparent;
            border: 2px solid var(--accent-purple);
            color: var(--accent-purple);
            border-radius: 25px;
            cursor: pointer;
            font-family: var(--font-secondary);
            font-weight: 600;
            transition: var(--transition);
        }

        .load-more-btn:hover {
            background: var(--accent-purple);
            color: white;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 2px solid var(--accent-purple);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            padding: 5px 15px;
            text-decoration: none;
            font-family: var(--font-secondary);
        }

        .nav-item:hover,
        .nav-item.active {
            color: var(--accent-purple);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
        }

        .nav-label {
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 16px 20px;
            margin-bottom: 10px;
            min-width: 300px;
            display: flex;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.4s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .toast.show {
            transform: translateX(0);
        }

        @media (max-width: 600px) {
            .summary-bar {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .transaction-card {
                padding: 15px;
            }
            
            .transaction-amount {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
                <h1 class="header-title">Transaction History</h1>
            </div>
        </div>

        <!-- Summary Bar -->
        <div class="summary-bar">
            <div class="summary-item deposits">
                <div class="summary-label">Deposits</div>
                <div class="summary-value" id="totalDeposits">$0.00</div>
            </div>
            <div class="summary-item withdrawals">
                <div class="summary-label">Withdrawals</div>
                <div class="summary-value" id="totalWithdrawals">$0.00</div>
            </div>
            <div class="summary-item investments">
                <div class="summary-label">Investments</div>
                <div class="summary-value" id="totalInvestments">$0.00</div>
            </div>
            <div class="summary-item earnings">
                <div class="summary-label">Earnings</div>
                <div class="summary-value" id="totalEarnings">$0.00</div>
            </div>
        </div>

        <!-- Filter Pills -->
        <div class="filter-container">
            <button class="filter-pill active" onclick="filterTransactions('all', this)">All</button>
            <button class="filter-pill" onclick="filterTransactions('deposit', this)">Deposits</button>
            <button class="filter-pill" onclick="filterTransactions('withdrawal', this)">Withdrawals</button>
            <button class="filter-pill" onclick="filterTransactions('investment', this)">Investments</button>
            <button class="filter-pill" onclick="filterTransactions('referral', this)">Referrals</button>
        </div>

        <!-- Timeline -->
        <div class="timeline" id="timeline">
            <div class="empty-state">
                <div class="empty-icon">...</div>
                <p class="empty-text">Loading transactions...</p>
            </div>
        </div>

        <!-- Load More -->
        <div class="load-more" id="loadMoreContainer" style="display: none;">
            <button class="load-more-btn" onclick="loadMoreTransactions()">Load More</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="nav-label">Home</span>
        </a>
        <a href="history.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            <span class="nav-label">History</span>
        </a>
        <a href="referrals.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
            <span class="nav-label">Referrals</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="nav-label">Profile</span>
        </a>
    </nav>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
            authDomain: "grovia-15266.firebaseapp.com",
            projectId: "grovia-15266",
            storageBucket: "grovia-15266.firebasestorage.app",
            messagingSenderId: "330674853010",
            appId: "1:330674853010:web:15a2cce632dd4528b8024b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allTransactions = [];
        let currentFilter = 'all';
        let visibleCount = 10;

        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div>${type === 'success' ? 'OK' : '!'}</div>
                <div>
                    <div style="font-weight: 700;">${title}</div>
                    <div style="font-size: 0.9rem;">${message}</div>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        function formatDate(date) {
            if (!date) return 'Unknown';
            const now = new Date();
            const txDate = date instanceof Date ? date : new Date(date);
            const diffDays = Math.floor((now - txDate) / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return 'This Week';
            if (diffDays < 30) return 'This Month';
            return txDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        function groupTransactionsByDate(transactions) {
            const groups = {};
            transactions.forEach(tx => {
                let dateValue = tx.createdAt;
                if (dateValue && typeof dateValue.toDate === 'function') {
                    dateValue = dateValue.toDate();
                }
                const dateGroup = formatDate(dateValue);
                if (!groups[dateGroup]) {
                    groups[dateGroup] = [];
                }
                groups[dateGroup].push(tx);
            });
            return groups;
        }

        function getTransactionIcon(type) {
            const icons = {
                deposit: 'D',
                withdrawal: 'W',
                investment: 'I',
                referral: 'R'
            };
            return icons[type] || 'T';
        }

        function getStatusDot(status) {
            if (status === 'completed' || status === 'paid') return 'completed';
            if (status === 'pending') return 'pending';
            return 'active';
        }

        function displayTransactions() {
            const timeline = document.getElementById('timeline');
            
            const filtered = allTransactions.filter(tx => {
                if (currentFilter === 'all') return true;
                return tx.type === currentFilter;
            });
            
            if (filtered.length === 0) {
                timeline.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">No Data</div>
                        <p class="empty-text">No transactions found</p>
                    </div>
                `;
                document.getElementById('loadMoreContainer').style.display = 'none';
                return;
            }
            
            const visibleTransactions = filtered.slice(0, visibleCount);
            const groups = groupTransactionsByDate(visibleTransactions);
            
            let html = '';
            Object.keys(groups).forEach(dateGroup => {
                html += `<div class="date-group">`;
                html += `<div class="date-label">${dateGroup}</div>`;
                
                groups[dateGroup].forEach(tx => {
                    const isPositive = tx.type === 'deposit' || tx.type === 'referral';
                    const statusDot = getStatusDot(tx.status);
                    let dateDisplay = '';
                    if (tx.createdAt && typeof tx.createdAt.toDate === 'function') {
                        dateDisplay = tx.createdAt.toDate().toLocaleTimeString();
                    }
                    
                    html += `
                        <div class="transaction-card ${tx.type}">
                            <div class="transaction-header">
                                <div class="transaction-info">
                                    <div class="transaction-icon">${getTransactionIcon(tx.type)}</div>
                                    <div>
                                        <div class="transaction-type">${tx.type || 'Unknown'}</div>
                                        <div class="transaction-date">${dateDisplay}</div>
                                    </div>
                                </div>
                                <div class="transaction-amount ${isPositive ? 'positive' : 'negative'}">
                                    ${isPositive ? '+' : '-'}$${(tx.amount || 0).toFixed(2)}
                                </div>
                            </div>
                            <div class="transaction-status">
                                <span class="status-dot ${statusDot}"></span>
                                <span>${tx.status || 'completed'}</span>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            });
            
            timeline.innerHTML = html;
            
            if (filtered.length > visibleCount) {
                document.getElementById('loadMoreContainer').style.display = 'block';
            } else {
                document.getElementById('loadMoreContainer').style.display = 'none';
            }
            
            updateSummary(filtered);
        }

        function updateSummary(transactions) {
            let totalDeposits = 0;
            let totalWithdrawals = 0;
            let totalInvestments = 0;
            let totalEarnings = 0;
            
            transactions.forEach(tx => {
                const amount = tx.amount || 0;
                if (tx.type === 'deposit') totalDeposits += amount;
                if (tx.type === 'withdrawal') totalWithdrawals += amount;
                if (tx.type === 'investment') totalInvestments += amount;
                if (tx.type === 'referral') totalEarnings += amount;
            });
            
            document.getElementById('totalDeposits').textContent = `$${totalDeposits.toFixed(2)}`;
            document.getElementById('totalWithdrawals').textContent = `$${totalWithdrawals.toFixed(2)}`;
            document.getElementById('totalInvestments').textContent = `$${totalInvestments.toFixed(2)}`;
            document.getElementById('totalEarnings').textContent = `$${totalEarnings.toFixed(2)}`;
        }

        window.filterTransactions = function(filter, element) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-pill').forEach(pill => {
                pill.classList.remove('active');
            });
            element.classList.add('active');
            
            displayTransactions();
        };

        window.loadMoreTransactions = function() {
            visibleCount += 10;
            displayTransactions();
        };

        async function loadTransactions() {
            if (!currentUser) return;
            
            try {
                const transactionsQuery = query(
                    collection(db, 'transactions'),
                    where('uid', '==', currentUser.uid)
                );
                
                const snapshot = await getDocs(transactionsQuery);
                allTransactions = [];
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allTransactions.push({
                        ...data,
                        id: doc.id
                    });
                });
                
                // Sort by date manually
                allTransactions.sort((a, b) => {
                    const dateA = a.createdAt?.toDate?.() || new Date(0);
                    const dateB = b.createdAt?.toDate?.() || new Date(0);
                    return dateB - dateA;
                });
                
                displayTransactions();
                
            } catch (error) {
                console.error('Error loading transactions:', error);
                const timeline = document.getElementById('timeline');
                timeline.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">!</div>
                        <p class="empty-text">No transactions yet</p>
                    </div>
                `;
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadTransactions();
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
