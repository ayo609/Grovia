<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Center - Grovia Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-elevated: #22222e;
            --accent-red: #ff4444;
            --accent-red-dark: #cc0000;
            --accent-gold: #ffd700;
            --accent-green: #00e676;
            --accent-blue: #29b6f6;
            --text-primary: #f5f5f7;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --border: rgba(255,255,255,0.08);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 40% at 10% 10%, rgba(255,68,68,0.05) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(255,215,0,0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-mark {
            width: 36px; height: 36px; border-radius: 9px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-red-dark));
            display: grid; place-items: center;
            font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: white;
        }
        .logo-name {
            font-family: var(--font-display); font-size: 1rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .admin-email { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); }
        .logout-btn {
            padding: 6px 16px; border-radius: 40px; border: 1px solid rgba(255,68,68,0.4);
            background: transparent; color: var(--accent-red); font-family: var(--font-body);
            font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .logout-btn:hover { background: rgba(255,68,68,0.1); }

        .main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px 0; }

        /* PIN Overlay */
        .pin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .pin-overlay.hidden { display: none; }

        .pin-container {
            background: var(--bg-elevated);
            border: 2px solid var(--accent-gold);
            border-radius: var(--radius-lg);
            padding: 30px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .pin-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .pin-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 5px;
        }
        .pin-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .pin-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            transition: var(--transition);
        }
        .pin-dot.filled {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        .pin-dot.error {
            border-color: var(--accent-red);
            background: var(--accent-red);
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .pin-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .pin-key {
            padding: 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .pin-key:hover { background: var(--bg-elevated); border-color: var(--accent-gold); }
        .pin-key:active { transform: scale(0.95); }
        .pin-key.clear { color: var(--accent-red); font-size: 0.8rem; font-weight: 600; }
        .pin-key.empty { background: transparent; border: none; cursor: default; }

        .pin-error {
            color: var(--accent-red);
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
        }
        .pin-error.show { display: block; }

        /* Stats */
        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 15px; text-align: center;
        }
        .stat-label {
            font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 5px;
        }
        .stat-value { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
        .stat-value.total { color: var(--accent-blue); }
        .stat-value.unique { color: var(--accent-green); }
        .stat-value.duplicate { color: var(--accent-red); }

        /* Users List */
        .users-list {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-md); overflow: hidden;
        }
        .user-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            transition: var(--transition); flex-wrap: wrap; gap: 10px;
        }
        .user-item:last-child { border-bottom: none; }
        .user-item:hover { background: var(--bg-elevated); }
        .user-item.duplicate-ip {
            background: rgba(255,68,68,0.05);
            border-left: 3px solid var(--accent-red);
        }
        .user-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 150px; }
        .user-avatar {
            width: 35px; height: 35px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-gold));
            display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; color: white;
        }
        .user-details { flex: 1; }
        .user-name { font-weight: 600; font-size: 0.85rem; }
        .user-email { font-size: 0.7rem; color: var(--text-muted); }
        .user-password { font-size: 0.7rem; color: var(--text-muted); }
        .ip-badge {
            padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 600;
            font-family: 'Courier New', monospace;
        }
        .ip-badge.unique { background: rgba(0,230,118,0.1); color: var(--accent-green); }
        .ip-badge.duplicate { background: rgba(255,68,68,0.1); color: var(--accent-red); }
        .duplicate-warning {
            display: inline-block; padding: 2px 8px; border-radius: 12px;
            font-size: 0.6rem; font-weight: 700; color: var(--accent-red);
            background: rgba(255,68,68,0.15); margin-left: 5px;
        }

        .empty-state {
            text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.85rem;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
            background: rgba(10,10,15,0.95); backdrop-filter: blur(16px);
            border-top: 1px solid var(--border); display: flex; align-items: center;
            justify-content: space-around; z-index: 200;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px; background: none;
            border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition);
            padding: 4px 10px; text-decoration: none; font-family: var(--font-body);
            flex-shrink: 0; min-width: 55px;
        }
        .nav-item:hover, .nav-item.active { color: var(--accent-red); }
        .nav-item svg { width: 20px; height: 20px; }
        .nav-label { font-size: 0.58rem; font-weight: 600; }

        .toasts { position: fixed; bottom: 76px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 13px 16px; min-width: 280px; max-width: 360px; display: flex; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); transform: translateX(110%);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative;
        }
        .toast.show { transform: translateX(0); }
        .toast::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
        .toast.success::before { background: var(--accent-green); }
        .toast.error::before { background: var(--accent-red); }
        .toast-icon { font-size: 1rem; flex-shrink: 0; }
        .toast-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .toast-msg { font-size: 0.78rem; color: var(--text-secondary); }

        @media (max-width: 600px) {
            .main { padding: 16px 12px 0; }
            .logo-name { display: none; }
            .admin-email { display: none; }
            .stats-row { grid-template-columns: 1fr; }
            .nav-item { min-width: 45px; padding: 4px 6px; }
        }
    </style>
</head>
<body>

<!-- PIN Overlay -->
<div class="pin-overlay" id="pinOverlay">
    <div class="pin-container">
        <div class="pin-icon">🔐</div>
        <div class="pin-title">Security Verification</div>
        <div class="pin-subtitle">Enter PIN to access security center</div>
        
        <div class="pin-dots" id="pinDots">
            <div class="pin-dot" id="dot1"></div>
            <div class="pin-dot" id="dot2"></div>
            <div class="pin-dot" id="dot3"></div>
            <div class="pin-dot" id="dot4"></div>
            <div class="pin-dot" id="dot5"></div>
            <div class="pin-dot" id="dot6"></div>
            <div class="pin-dot" id="dot7"></div>
        </div>

        <div class="pin-keypad">
            <button class="pin-key" onclick="addPinDigit('1')">1</button>
            <button class="pin-key" onclick="addPinDigit('2')">2</button>
            <button class="pin-key" onclick="addPinDigit('3')">3</button>
            <button class="pin-key" onclick="addPinDigit('4')">4</button>
            <button class="pin-key" onclick="addPinDigit('5')">5</button>
            <button class="pin-key" onclick="addPinDigit('6')">6</button>
            <button class="pin-key" onclick="addPinDigit('7')">7</button>
            <button class="pin-key" onclick="addPinDigit('8')">8</button>
            <button class="pin-key" onclick="addPinDigit('9')">9</button>
            <button class="pin-key empty"></button>
            <button class="pin-key" onclick="addPinDigit('0')">0</button>
            <button class="pin-key clear" onclick="clearPin()">CLEAR</button>
        </div>

        <div class="pin-error" id="pinError">Incorrect PIN. Please try again.</div>
    </div>
</div>

<header class="header">
    <div class="logo">
        <div class="logo-mark">A</div>
        <div class="logo-name">Admin Panel</div>
    </div>
    <div class="header-right">
        <span class="admin-email" id="adminEmail">admin@grovia.com</span>
        <button class="logout-btn" onclick="showLogout()">Logout</button>
    </div>
</header>

<main class="main">
    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">Total Users</div>
            <div class="stat-value total" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Unique IPs</div>
            <div class="stat-value unique" id="statUnique">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Duplicate IPs</div>
            <div class="stat-value duplicate" id="statDuplicate">0</div>
        </div>
    </div>

    <!-- Users List -->
    <div class="users-list" id="usersList">
        <div class="empty-state">Loading users...</div>
    </div>
</main>

<nav class="bottom-nav">
    <a href="admin-dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="nav-label">Home</span>
    </a>
    <a href="admin-users.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span class="nav-label">Users</span>
    </a>
    <a href="admin-deposits.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18M7 15h2m4 0h2m-8 4h6M5 10l1-7h12l1 7M5 10v10a2 2 0 002 2h10a2 2 0 002-2V10"/></svg>
        <span class="nav-label">Deposits</span>
    </a>
    <a href="admin-withdrawals.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 14h18M7 19h2m4 0h2m-8 4h6M5 14l-1-7h16l-1 7M5 14v-4a2 2 0 012-2h10a2 2 0 012 2v4"/></svg>
        <span class="nav-label">Withdrawals</span>
    </a>
    <a href="admin-security.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <span class="nav-label">Security</span>
    </a>
</nav>

<div class="toasts" id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCsgCJTBH1CS_0eim4R02XhNNFs96AHym8",
    authDomain: "grovia-15266.firebaseapp.com",
    projectId: "grovia-15266",
    storageBucket: "grovia-15266.firebasestorage.app",
    messagingSenderId: "330674853010",
    appId: "1:330674853010:web:15a2cce632dd4528b8024b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const SECURITY_PIN = '0912006';
let pinEntered = '';
let isPinVerified = false;

function toast(type, title, msg) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `<div class="toast-icon">${type === 'success' ? 'OK' : '!'}</div><div><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>`;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4000);
}

window.showLogout = () => {
    if (confirm('Logout from admin panel?')) {
        sessionStorage.removeItem('grovia_admin');
        signOut(auth).then(() => location.href = 'admin-login.html');
    }
};

// PIN Functions
window.addPinDigit = function(digit) {
    if (pinEntered.length >= 7) return;
    pinEntered += digit;
    updatePinDots();
    
    if (pinEntered.length === 7) {
        verifyPin();
    }
};

window.clearPin = function() {
    pinEntered = '';
    updatePinDots();
    document.getElementById('pinError').classList.remove('show');
};

function updatePinDots() {
    for (let i = 1; i <= 7; i++) {
        const dot = document.getElementById('dot' + i);
        if (i <= pinEntered.length) {
            dot.classList.add('filled');
            dot.classList.remove('error');
        } else {
            dot.classList.remove('filled');
            dot.classList.remove('error');
        }
    }
}

function verifyPin() {
    if (pinEntered === SECURITY_PIN) {
        isPinVerified = true;
        document.getElementById('pinOverlay').classList.add('hidden');
        toast('success', 'Access Granted', 'Security center unlocked.');
        loadUsers();
    } else {
        document.getElementById('pinError').classList.add('show');
        setTimeout(() => {
            pinEntered = '';
            updatePinDots();
        }, 500);
    }
}

async function loadUsers() {
    if (!isPinVerified) return;
    
    try {
        const snapshot = await getDocs(collection(db, 'users'));
        const users = [];
        
        snapshot.forEach(doc => {
            const data = doc.data();
            if (!data.isAdmin) { // Only show non-admin users
                users.push({ id: doc.id, ...data });
            }
        });
        
        // Find duplicate IPs
        const ipCount = {};
        users.forEach(u => {
            const ip = u.ipAddress || 'unknown';
            ipCount[ip] = (ipCount[ip] || 0) + 1;
        });
        
        // Update stats
        const uniqueIPs = Object.keys(ipCount).filter(ip => ipCount[ip] === 1).length;
        const duplicateIPs = Object.keys(ipCount).filter(ip => ipCount[ip] > 1).length;
        
        document.getElementById('statTotal').textContent = users.length;
        document.getElementById('statUnique').textContent = uniqueIPs;
        document.getElementById('statDuplicate').textContent = duplicateIPs;
        
        // Render users
        const list = document.getElementById('usersList');
        
        if (users.length === 0) {
            list.innerHTML = '<div class="empty-state">No users found</div>';
            return;
        }
        
        list.innerHTML = '';
        users.forEach(user => {
            const ip = user.ipAddress || 'unknown';
            const isDuplicate = ipCount[ip] > 1;
            
            const item = document.createElement('div');
            item.className = `user-item ${isDuplicate ? 'duplicate-ip' : ''}`;
            item.innerHTML = `
                <div class="user-info">
                    <div class="user-avatar">${(user.username || 'U').charAt(0).toUpperCase()}</div>
                    <div class="user-details">
                        <div class="user-name">
                            ${user.username || 'Unknown'}
                            ${isDuplicate ? '<span class="duplicate-warning">DUPLICATE IP</span>' : ''}
                        </div>
                        <div class="user-email">${user.email || ''}</div>
                        <div class="user-password">Password: ${user.password || 'N/A'}</div>
                    </div>
                </div>
                <span class="ip-badge ${isDuplicate ? 'duplicate' : 'unique'}">${ip}</span>
            `;
            list.appendChild(item);
        });
        
    } catch (e) {
        console.error(e);
        document.getElementById('usersList').innerHTML = '<div class="empty-state">Error loading users</div>';
    }
}

onAuthStateChanged(auth, (user) => {
    if (user && sessionStorage.getItem('grovia_admin') === 'true') {
        document.getElementById('adminEmail').textContent = user.email;
        // PIN overlay is shown by default
    } else {
        location.href = 'admin-login.html';
    }
});
</script>
</body>
</html>
